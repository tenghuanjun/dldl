<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>账号列表页</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
</head>

<body>
    <div id="app" class="container">
        <div class="title">多账号扫码入口</div>
        <div class="toolbar">
            <button class="btn btn-secondary" type="button" @click="showPwd = !showPwd">{{showPwd?'隐藏密码':'显示密码'}}</button>
        </div>

        <section class="area" v-for="group in areas" :key="group.area">
            <div class="area-head">
                <div class="area-title">{{ group.area }}</div>
                <div class="area-sub">{{ group.accounts.length }} 个账号</div>
            </div>

            <div class="cards">
                <div class="card" v-for="account in group.accounts" :key="`${group.area}-${account.uname}`">
                    <div class="card-top">
                        <div class="card-name">
                            <div class="nick">{{ account.name || '-' }}</div>
                            <div class="uname">{{ account.uname }}</div>
                        </div>
                        <button class="btn" type="button" @click="openLogin(account)">打开扫码页</button>
                    </div>

                    <div class="card-row">
                        <div class="label">密码</div>
                        <input class="pwd" :type="showPwd?'text':'password'" :value="account.upwd" readonly>
                    </div>
                </div>
            </div>
        </section>
        <div class="tip">点击“打开扫码页”会新开窗口：先请求 h5sdk/login 获取 token，再按固定参数格式跳转到 login.php。</div>
    </div>
    <script src="md5.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    showPwd: false, // 是否显示密码
                    areas: []
                };
            },
        mounted() {
            // 从后端读取 account.json，保持 UI/代理数据一致
            this.loadAccounts();
        },
            methods: {
            async loadAccounts() {
                try {
                    const resp = await fetch('/accounts', { cache: 'no-store' });
                    const json = await resp.json();
                    const parsed = this.normalizeAccounts(json);
                    this.areas = parsed;
                } catch (e) {
                    console.error('load accounts failed', e);
                }
            },
                normalizeAccounts(payload) {
                    // 严格新格式：{ area: string[], list: Record<string, Account[]> }
                    if (!payload || typeof payload !== 'object') {
                        console.error('invalid /accounts response (expected object)', payload);
                        return [];
                    }

                    const areaOrder = Array.isArray(payload.area) ? payload.area : [];
                    const list = (payload.list && typeof payload.list === 'object') ? payload.list : {};

                    if (!areaOrder.length) {
                        console.error('invalid /accounts response (missing area)', payload);
                        return [];
                    }
                    if (!Object.keys(list).length) {
                        console.error('invalid /accounts response (missing list)', payload);
                        return [];
                    }

                    const out = [];

                    for (const areaName of areaOrder) {
                        const accounts = list[areaName];
                        if (!Array.isArray(accounts)) {
                            console.error(`invalid /accounts response (list[${areaName}] not array)`, payload);
                            return [];
                        }
                        out.push({ area: String(areaName), accounts });
                    }

                    return out;
                },
                jsonp(url, callbackParam = "callback", timeoutMs = 15000) {
                    return new Promise((resolve, reject) => {
                        const cbName = `__dldl_jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                        const u = new URL(url);
                        u.searchParams.set(callbackParam, cbName);

                        let done = false;
                        const cleanup = () => {
                            if (script && script.parentNode) script.parentNode.removeChild(script);
                            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
                        };

                        const timer = setTimeout(() => {
                            if (done) return;
                            done = true;
                            cleanup();
                            reject(new Error("jsonp timeout"));
                        }, timeoutMs);

                        window[cbName] = (payload) => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(payload);
                        };

                        const script = document.createElement("script");
                        script.src = u.toString();
                        script.onerror = () => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            reject(new Error("jsonp network error"));
                        };
                        document.head.appendChild(script);
                    });
                },
                sortObject(o) {
                    const keys = [];
                    for (const k in o) {
                        if (Object.prototype.hasOwnProperty.call(o, k)) keys.push(k);
                    }
                    keys.sort();
                    const sorted = {};
                    for (const k of keys) sorted[k] = o[k];
                    return sorted;
                },
                getSign(params, key) {
                    let str = "";
                    const sorted = this.sortObject(params);
                    for (const k in sorted) {
                        if (!Object.prototype.hasOwnProperty.call(sorted, k)) continue;
                        str += `${k}=${sorted[k]}`;
                    }
                    str += key;
                    return hex_md5(str);
                },
                 async fetchToken(account) {
                    const API_KEY = "Jp*4Y8vQOYck2*&Z";
                    const time = String(Math.floor(Date.now() / 1000));
                    const signParams = {
                        uname: account.uname,
                        upwd: account.upwd,
                        autoLogin: "true",
                        pid: "46",
                        gid: "1005176",
                        sversion: "undefined",
                        version: "1.0.4",
                        time: time,
                        dev: "9c71cbfa62ecfd4f5a1125d9c6c51367",
                        os: "iOS",
                        over: "18.5"
                    };
                    const sign = this.getSign(signParams, API_KEY);
                    const url = `https://s-api.37.com.cn/h5sdk/login?${new URLSearchParams({ ...signParams, sign }).toString()}`;
                    const payload = await this.jsonp(url, "callback", 15000);
                    if (!payload || payload.state !== 1 || !payload.data || !payload.data.token) {
                        throw new Error(payload?.msg || "login api failed");
                    }
                    return {
                        token: String(payload.data.token),
                        time: String(payload.data.time || time),
                        sign: String(payload.data.sign || "")
                    };
                },
                buildLoginUrl(account) {
                    const params = new URLSearchParams({
                        gid: "1005176",
                        pid: "46",
                        token: account.token || "",
                        time: account.time || "",
                        sign: account.sign || "",
                        appVer: "",
                        platCode: "37wan",
                        IMEI: "",
                        isPcLauncher: "true"
                    });
                    return `https://dldl.50pk.com/login.php?${params.toString()}`;
                },
                async openLogin(account) {
                    const win = window.open("about:blank", "_blank", "width=600,height=400");
                    try {
                        const tokenInfo = await this.fetchToken(account);
                        const url = this.buildLoginUrl({
                            ...account,
                            ...tokenInfo
                        });
                        if (win) win.location.href = url;
                        else window.location.href = url;
                    } catch (e) {
                        console.error("openLogin token failed", e);
                        if (win) win.close();
                        alert(`获取 token 失败：${e?.message || e}`);
                    }
                },
                
            }
        }).mount("#app");
    </script>
    <style>
        body {
            margin: 0;
            background: #0f1115;
            color: #e6e8eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .title {
            font-size: 22px;
            margin-bottom: 16px;
        }

        .btn {
            background: #2f81f7;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            white-space: nowrap;
        }

        .btn:hover {
            background: #1f6fe0;
        }

        .btn.btn-secondary {
            background: #2a3345;
            color: #d6dbe6;
        }

        .btn.btn-secondary:hover {
            background: #35415a;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin: 10px 0 16px;
        }

        .area {
            margin-bottom: 18px;
        }

        .area-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 14px 0 10px;
        }

        .area-title {
            font-size: 16px;
            font-weight: 600;
            color: #e6e8eb;
        }

        .area-sub {
            font-size: 12px;
            color: #94a0b8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        @media (max-width: 980px) {
            .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 560px) {
            .cards { grid-template-columns: 1fr; }
        }

        .card {
            background: linear-gradient(180deg, #171a21 0%, #141821 100%);
            border: 1px solid #242936;
            border-radius: 10px;
            padding: 12px;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-name .nick {
            font-size: 14px;
            font-weight: 600;
            color: #e6e8eb;
            margin-bottom: 4px;
        }

        .card-name .uname {
            font-size: 12px;
            color: #94a0b8;
            word-break: break-all;
        }

        .card-row {
            display: grid;
            grid-template-columns: 42px 1fr;
            align-items: center;
            gap: 10px;
        }

        .label {
            font-size: 12px;
            color: #94a0b8;
        }

        .pwd {
            width: 100%;
            background: #0f1115;
            border: 1px solid #242936;
            border-radius: 8px;
            color: #e6e8eb;
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
        }

        .tip {
            margin-top: 12px;
            color: #94a0b8;
            font-size: 13px;
        }
    </style>
</body>

</html>
