<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>账号列表页</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
</head>

<body>
    <div id="app" class="container">
        <div class="title">多账号扫码入口</div>
        <table>
            <thead>
                <tr>
                    <th>账号</th>
                    <th>备注</th>
                    <th>密码</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="account in accounts" :key="account.uname">
                    <td>{{ account.uname }}</td>
                    <td>{{ account.name || "-" }}</td>
                    <td>
                        <input :type="showPwd?'text':'password'" :value="account.upwd">
                    </td>
                    <td>
                        <button class="btn" type="button" @click="openLogin(account)">打开扫码页</button>
                        <span>&nbsp;&nbsp;</span>
                        <!-- <button class="btn" type="button" @click="refreshToken(account)">刷新令牌</button> -->
                        <span>&nbsp;&nbsp;</span>
                        <button class="btn" type="button" @click="showPwd = !showPwd">{{showPwd?'隐藏':'显示'}}</button>
                        <span>&nbsp;&nbsp;</span>
                        <!-- <button class="btn" type="button" @click="copyAccountPwd(account)">复制账号密码</button> -->
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="tip">点击“打开扫码页”会新开窗口：先请求 h5sdk/login 获取 token，再按固定参数格式跳转到 login.php。</div>
    </div>
    <script src="md5.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    showPwd: false, // 是否显示密码
                    accounts: []
                };
            },
        mounted() {
            // 从后端读取 account.json，保持 UI/代理数据一致
            this.loadAccounts();
        },
            methods: {
            async loadAccounts() {
                try {
                    const resp = await fetch('/accounts', { cache: 'no-store' });
                    const json = await resp.json();
                    // debugger
                    if (Array.isArray(json)) {
                        this.accounts = json;
                    } else {
                        console.error('invalid /accounts response', json);
                    }
                } catch (e) {
                    console.error('load accounts failed', e);
                }
            },
                jsonp(url, callbackParam = "callback", timeoutMs = 15000) {
                    return new Promise((resolve, reject) => {
                        const cbName = `__dldl_jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                        const u = new URL(url);
                        u.searchParams.set(callbackParam, cbName);

                        let done = false;
                        const cleanup = () => {
                            if (script && script.parentNode) script.parentNode.removeChild(script);
                            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
                        };

                        const timer = setTimeout(() => {
                            if (done) return;
                            done = true;
                            cleanup();
                            reject(new Error("jsonp timeout"));
                        }, timeoutMs);

                        window[cbName] = (payload) => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(payload);
                        };

                        const script = document.createElement("script");
                        script.src = u.toString();
                        script.onerror = () => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            reject(new Error("jsonp network error"));
                        };
                        document.head.appendChild(script);
                    });
                },
                sortObject(o) {
                    const keys = [];
                    for (const k in o) {
                        if (Object.prototype.hasOwnProperty.call(o, k)) keys.push(k);
                    }
                    keys.sort();
                    const sorted = {};
                    for (const k of keys) sorted[k] = o[k];
                    return sorted;
                },
                getSign(params, key) {
                    let str = "";
                    const sorted = this.sortObject(params);
                    for (const k in sorted) {
                        if (!Object.prototype.hasOwnProperty.call(sorted, k)) continue;
                        str += `${k}=${sorted[k]}`;
                    }
                    str += key;
                    return hex_md5(str);
                },
                 async fetchToken(account) {
                    const API_KEY = "Jp*4Y8vQOYck2*&Z";
                    const time = String(Math.floor(Date.now() / 1000));
                    const signParams = {
                        uname: account.uname,
                        upwd: account.upwd,
                        autoLogin: "true",
                        pid: "46",
                        gid: "1005176",
                        sversion: "undefined",
                        version: "1.0.4",
                        time: time,
                        dev: "9c71cbfa62ecfd4f5a1125d9c6c51367",
                        os: "iOS",
                        over: "18.5"
                    };
                    const sign = this.getSign(signParams, API_KEY);
                    const url = `https://s-api.37.com.cn/h5sdk/login?${new URLSearchParams({ ...signParams, sign }).toString()}`;
                    const payload = await this.jsonp(url, "callback", 15000);
                    if (!payload || payload.state !== 1 || !payload.data || !payload.data.token) {
                        throw new Error(payload?.msg || "login api failed");
                    }
                    return {
                        token: String(payload.data.token),
                        time: String(payload.data.time || time),
                        sign: String(payload.data.sign || "")
                    };
                },
                buildLoginUrl(account) {
                    const params = new URLSearchParams({
                        gid: "1005176",
                        pid: "46",
                        token: account.token || "",
                        time: account.time || "",
                        sign: account.sign || "",
                        appVer: "",
                        platCode: "37wan",
                        IMEI: "",
                        isPcLauncher: "true"
                    });
                    return `https://dldl.50pk.com/login.php?${params.toString()}`;
                },
                async openLogin(account) {
                    const win = window.open("about:blank", "_blank", "width=600,height=400");
                    try {
                        const tokenInfo = await this.fetchToken(account);
                        const url = this.buildLoginUrl({
                            ...account,
                            ...tokenInfo
                        });
                        if (win) win.location.href = url;
                        else window.location.href = url;
                    } catch (e) {
                        console.error("openLogin token failed", e);
                        if (win) win.close();
                        alert(`获取 token 失败：${e?.message || e}`);
                    }
                },
                
            }
        }).mount("#app");
    </script>
    <style>
        body {
            margin: 0;
            background: #0f1115;
            color: #e6e8eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        .container {
            max-width: 980px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .title {
            font-size: 22px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #171a21;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            border-bottom: 1px solid #242936;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #1d2230;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn {
            background: #2f81f7;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1f6fe0;
        }

        .tip {
            margin-top: 12px;
            color: #94a0b8;
            font-size: 13px;
        }
    </style>
</body>

</html>
