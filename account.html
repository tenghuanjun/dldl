<html class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>账号列表页</title>
    <script src="vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.9/dist/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.9/theme-chalk/dark/css-vars.css" />
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.9/dist/index.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.js"></script>
</head>

<body>
    <div id="app" class="container">
        <div v-if="!isLoggedIn" class="login-container">
            <div class="login-box">
                <h2 class="login-title">用户登录</h2>
                <div class="login-form">
                    <div class="login-field">
                        <label class="login-label">用户名</label>
                        <input class="login-input" v-model="loginForm.username" placeholder="请输入用户名" @keyup.enter="handleLogin">
                    </div>
                    <div class="login-field">
                        <label class="login-label">密码</label>
                        <input class="login-input" type="password" v-model="loginForm.password" placeholder="请输入密码" @keyup.enter="handleLogin">
                    </div>
                    <div class="login-actions">
                        <button class="btn login-btn" type="button" @click="handleLogin" :disabled="loginLoading" :class="{ 'btn-loading': loginLoading }">{{ loginLoading ? '登录中...' : '登录' }}</button>
                        <button class="btn btn-secondary login-btn" type="button" @click="handleRegister" :disabled="loginLoading" :class="{ 'btn-loading': loginLoading }">{{ loginLoading ? '注册中...' : '注册' }}</button>
                    </div>
                    <div v-if="loginError" class="login-error">{{ loginError }}</div>
                </div>
            </div>
        </div>
        <template v-if="isLoggedIn">
        <header class="account-controls-sticky">
            <div class="sticky-row sticky-row-top">
                <h1 class="sticky-page-title">多账号扫码入口</h1>
                <div class="user-info">
                    <span class="username">{{ currentUser?.username }}</span>
                    <button v-if="isAdmin" class="btn btn-secondary btn-compact" type="button" @click="openUserManageModal">用户管理</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="handleLogout">退出</button>
                </div>
                <div class="sticky-tools">
                    <button class="btn btn-secondary btn-compact" type="button" @click="openAccountModal()">新增</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="showPwd = !showPwd">{{ showPwd ? '隐藏密码' : '显示密码' }}</button>
                    <button
                        class="btn btn-compact"
                        type="button"
                        :disabled="selectedAccountCount === 0"
                        @click="batchLaunchSelected"
                    >批量启动（{{ selectedAccountCount }}）</button>
                    <button
                        class="btn btn-compact"
                        :class="useProxy ? 'btn-proxy-active' : 'btn-secondary'"
                        type="button"
                        @click="toggleProxyAndRefreshIP"
                    >{{ useProxy ? (proxyIP === '代理中' ? '代理IP: 已启用（切换IP）' : proxyIP) : '代理IP: 未启用（点击启用并切换IP）' }}</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="openAreaSortModal">区服排序</button>
                </div>
            </div>
            <div class="sticky-row sticky-row-batch">
                <span class="batch-row-head">
                    同区批次
                    <span class="batch-info-icon" title="按该区下列表顺序分批启动，与下方勾选无关">ⓘ</span>
                </span>
                <el-select
                    v-model="batchPanelArea"
                    class="batch-area-select batch-select-ep"
                    size="default"
                    filterable
                    clearable
                    placeholder="区服"
                >
                    <el-option
                        v-for="g in areas"
                        :key="'batch-opt-' + g.area"
                        :label="g.area"
                        :value="g.area"
                    />
                </el-select>
                <label class="batch-inline-label">每批</label>
                <input
                    v-model.number="batchPanelSize"
                    type="number"
                    min="1"
                    step="1"
                    class="form-input batch-num-input"
                >
                <label class="batch-inline-label">第</label>
                <input
                    v-model.number="batchPanelBatchNo"
                    type="number"
                    min="1"
                    step="1"
                    class="form-input batch-num-input"
                >
                <label class="batch-inline-label">批</label>
                <button class="btn btn-compact" type="button" @click="batchLaunchByAreaSlice">启动该批</button>
            </div>
        </header>

        <section class="area" v-for="group in areas" :key="group.area">
            <div class="area-head">
                <div class="area-title">{{ group.area }}</div>
                <div class="area-sub">
                    {{ group.accounts.length }} 个账号
                    <button type="button" class="btn-link" @click="selectAllInArea(group, true)">全选</button>
                    <button type="button" class="btn-link" @click="selectAllInArea(group, false)">取消全选</button>
                    <button class="btn btn-danger btn-mini" type="button" @click="deleteArea(group)">删除区服</button>
                </div>
            </div>

            <div class="cards" v-account-cards-sortable="group">
                <div class="card sortable-account-card" v-for="account in group.accounts" :key="`${group.area}-${account.uname}`">
                    <label class="card-check-wrap" @mousedown.stop @click.stop>
                        <input
                            type="checkbox"
                            :checked="isAccountSelected(group.area, account)"
                            @change="onAccountCheckboxChange($event, group.area, account)"
                        >
                    </label>
                    <button type="button" class="card-drag-handle" aria-label="拖拽排序" title="拖拽排序">⋮⋮</button>
                    <div class="card-main">
                        <div class="card-top">
                            <div class="card-name">
                                <div class="nick white-space-nowrap">{{ account.name || '-' }}</div>
                                <div class="uname white-space-nowrap" v-if="showPwd">{{ account.uname }}</div>
                                <div class="uname white-space-nowrap" v-if="showPwd">{{ account.upwd }}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-secondary" type="button" @click="editAccount(account)">编辑</button>
                                <button class="btn btn-secondary" type="button" @click="refreshToken(account)">刷新 token</button>
                                <button class="btn" type="button" @click="openLogin(account)">打开扫码页</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="tip">同一区服下可按住左侧「⋮⋮」拖拽卡片调整账号顺序，松手后自动保存到数据库。勾选卡片左侧复选框后点「批量启动扫码页」会按列表顺序约每隔 2 秒依次打开（可跨多个区服，只启动已勾选的账号）。「同区服按批次启动」用于同一区内按每批人数、第几批切片启动，与勾选无关。单个账号仍点「打开扫码页」。</div>
        <div class="tip tip-secondary">点击「打开扫码页」会新开窗口跳转到 login.php：若当前账号已缓存 token，则直接使用，不请求登录接口也不重复写入；仅在没有 token 时会请求 h5sdk/login 并保存到数据库。点击「刷新 token」会强制重新登录并覆盖保存。</div>
        <div class="tip tip-secondary">「代理IP」功能使用 Cloudflare Workers 代理请求登录接口，可绕过IP请求次数限制。点击「切换IP」会切换 Cloudflare 出口IP。使用前请先部署 <code>cloudflare-worker.js</code> 到 Cloudflare Workers，并将 Worker URL 填入配置。</div>

        <div v-if="accountModalVisible" class="modal-mask" @click.self="closeAccountModal()">
            <div class="modal">
                <div class="modal-title">{{ accountModalMode === 'create' ? '新增账号' : '编辑账号' }}</div>
                <div class="form-grid">
                    <div class="form-field full">
                        <label class="form-label">区服</label>
                        <el-select
                            v-model="accountForm.area"
                            class="area-select"
                            filterable
                            allow-create
                            default-first-option
                            clearable
                            placeholder="搜索或选择区服，也可输入新名称后回车创建"
                        >
                            <el-option
                                v-for="group in areas"
                                :key="group.area"
                                :label="group.area"
                                :value="group.area"
                            />
                        </el-select>
                    </div>
                    <div class="form-field">
                        <label class="form-label">昵称 name</label>
                        <input class="form-input" v-model="accountForm.name" placeholder="请输入昵称">
                    </div>
                    <div class="form-field">
                        <label class="form-label">账号 uname</label>
                        <input class="form-input" v-model="accountForm.uname" placeholder="请输入账号">
                    </div>
                    <div class="form-field full">
                        <label class="form-label">密码 upwd</label>
                        <input class="form-input" v-model="accountForm.upwd" placeholder="请输入密码">
                    </div>
                    <div class="form-field full">
                        <label class="form-label">完整登录地址</label>
                        <div class="url-extract-row">
                            <textarea
                                v-model="loginUrlPaste"
                                class="form-input form-textarea url-paste-input"
                                rows="2"
                                placeholder="粘贴浏览器地址栏中的 login.php?... 整段链接，点击右侧「提取」自动填入下方三项"
                            ></textarea>
                            <button type="button" class="btn url-extract-btn" @click="extractLoginParamsFromUrl">提取</button>
                        </div>
                    </div>
                    <div class="form-field full">
                        <label class="form-label">token</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.token" rows="3" placeholder="可选；留空则打开扫码页时会自动拉取"></textarea>
                    </div>
                    <div class="form-field">
                        <label class="form-label">time</label>
                        <input class="form-input" v-model="accountForm.time" placeholder="可选，与 sign 配套">
                    </div>
                    <div class="form-field">
                        <label class="form-label">sign</label>
                        <input class="form-input form-mono" v-model="accountForm.sign" placeholder="可选，与 time 配套">
                    </div>
                </div>
                <div class="form-help">保存后会写入数据库，新增账号会自动创建对应区服分组。可将完整 login.php 链接粘贴到上方并点「提取」，或手动填写 token / time / sign，或通过「刷新 token」写入。</div>
                <div class="modal-actions">
                    <button v-if="accountModalMode === 'edit'" class="btn btn-danger" type="button" @click="deleteEditingAccount()">删除账号</button>
                    <button class="btn btn-secondary" type="button" @click="closeAccountModal()">取消</button>
                    <button class="btn" type="button" @click="submitAccountModal()">保存</button>
                </div>
            </div>
        </div>

        <div v-if="areaSortModalVisible" class="modal-mask" @click.self="closeAreaSortModal">
            <div class="modal">
                <div class="modal-title">区服排序</div>
                <div class="area-sort-tip">拖拽下方区服调整顺序，松手后自动保存</div>
                <div class="area-sort-list" ref="areaSortList">
                    <div class="area-sort-item" v-for="group in areaSortList" :key="group.area" :data-area="group.area">
                        <span class="area-sort-handle">⋮⋮</span>
                        <span class="area-sort-name">{{ group.area }}</span>
                        <span class="area-sort-count">{{ group.accounts.length }} 个账号</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" type="button" @click="closeAreaSortModal">关闭</button>
                </div>
            </div>
        </div>

        <div v-if="userManageModalVisible" class="modal-mask" @click.self="closeUserManageModal">
            <div class="modal" style="max-width: 600px;">
                <div class="modal-title">用户管理</div>
                <div class="user-manage-tip">tenghuanjun 为管理员，不可禁用和删除</div>
                <div class="user-manage-list">
                    <div class="user-manage-item" v-for="user in allUsers" :key="user.id">
                        <span class="user-manage-name">{{ user.username }}</span>
                        <span class="user-manage-role" v-if="user.username === 'tenghuanjun'">管理员</span>
                        <span class="user-manage-status" :class="user.enabled ? 'status-enabled' : 'status-disabled'">{{ user.enabled ? '已启用' : '已禁用' }}</span>
                        <button class="btn btn-mini" :class="user.enabled ? 'btn-danger' : 'btn-success'" type="button" @click="toggleUserEnabled(user)" :disabled="user.username === 'tenghuanjun'">{{ user.enabled ? '禁用' : '启用' }}</button>
                        <button class="btn btn-secondary btn-mini" type="button" @click="openChangePwdModal(user)">改密码</button>
                        <button class="btn btn-danger btn-mini" type="button" @click="deleteUser(user)" :disabled="user.username === 'tenghuanjun'">删除</button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" type="button" @click="closeUserManageModal">关闭</button>
                </div>
            </div>
        </div>

        <div v-if="changePwdModalVisible" class="modal-mask" @click.self="closeChangePwdModal">
            <div class="modal" style="max-width: 360px;">
                <div class="modal-title">修改密码 - {{ changePwdUser?.username }}</div>
                <div class="login-field">
                    <label class="login-label">新密码</label>
                    <input class="login-input" type="password" v-model="newPassword" placeholder="请输入新密码" @keyup.enter="submitChangePwd">
                </div>
                <div class="modal-actions" style="margin-top: 16px;">
                    <button class="btn btn-secondary" type="button" @click="closeChangePwdModal">取消</button>
                    <button class="btn" type="button" @click="submitChangePwd">确认修改</button>
                </div>
            </div>
        </div>
        </template>
    </div>
    <script src="md5.js"></script>
    <script>
        const { createApp } = Vue;
        const ElMessage = window.ElementPlus?.ElMessage;
        const ElMessageBox = window.ElementPlus?.ElMessageBox;

        function destroyAccountCardsSortable(el) {
            if (el._accountCardsSortable) {
                el._accountCardsSortable.destroy();
                el._accountCardsSortable = null;
            }
        }

        const accountCardsSortableDirective = {
            mounted(el, binding) {
                el._sortableGroupRef = binding.value;
                const SortableCtor = window.Sortable;
                if (typeof SortableCtor !== 'function' || !binding.value || !Array.isArray(binding.value.accounts)) {
                    return;
                }
                el._accountCardsSortable = SortableCtor.create(el, {
                    animation: 180,
                    handle: '.card-drag-handle',
                    draggable: '.sortable-account-card',
                    ghostClass: 'card-sortable-ghost',
                    chosenClass: 'card-sortable-chosen',
                    dragClass: 'card-sortable-drag',
                    forceFallback: true,
                    fallbackTolerance: 5,
                    onEnd(evt) {
                        const g = el._sortableGroupRef;
                        if (!g || !Array.isArray(g.accounts)) return;
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        if (oldIndex === newIndex || oldIndex == null || newIndex == null) return;
                        const list = g.accounts;
                        const moved = list.splice(oldIndex, 1)[0];
                        list.splice(newIndex, 0, moved);
                        const vm = binding.instance;
                        if (vm && typeof vm.onAccountCardsSorted === 'function') {
                            void vm.onAccountCardsSorted();
                        }
                    }
                });
            },
            updated(el, binding) {
                el._sortableGroupRef = binding.value;
            },
            unmounted(el) {
                destroyAccountCardsSortable(el);
            }
        };

        const supabaseUrl = 'https://xywlbjsyhpyyxboznmct.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5d2xianN5aHB5eXhib3pubWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODgwNzIsImV4cCI6MjA5NDY2NDA3Mn0.Q0KzoMgwNInH4gi30DEK_d1NbZCwl5yFjnTjubm_gYs';
        const db = supabase.createClient(supabaseUrl, supabaseKey);
        console.log('Supabase initialized OK');

        const app = createApp({
            data() {
                return {
                    isLoggedIn: false,
                    currentUser: null,
                    loginForm: { username: '', password: '' },
                    loginLoading: false,
                    loginError: '',
                    showPwd: false,
                    areas: [],
                    accountModalVisible: false,
                    accountModalMode: 'create',
                    accountForm: { area: '', name: '', uname: '', upwd: '', token: '', time: '', sign: '' },
                    loginUrlPaste: '',
                    editingAccountRef: null,
                    /** 勾选批量启动：key = accountSelectKey(area, account) */
                    accountSelectMap: {},
                    /** 同区服按批次：区服、每批个数、第几批（从 1 开始） */
                    batchPanelArea: '',
                    batchPanelSize: 5,
                    batchPanelBatchNo: 1,
                    /** 代理IP配置 */
                    useProxy: false,
                    proxyWorkerUrl: 'https://red-moon-ff95.tenghuanjun.workers.dev',
                    proxyIP: '直连',
                    areaSortModalVisible: false,
                    areaSortList: [],
                    userManageModalVisible: false,
                    allUsers: [],
                    changePwdModalVisible: false,
                    changePwdUser: null,
                    newPassword: '',
                };
            },
            computed: {
                selectedAccountCount() {
                    const m = this.accountSelectMap;
                    return Object.keys(m).filter((k) => m[k]).length;
                },
                isAdmin() {
                    return this.currentUser?.username === 'tenghuanjun';
                }
            },
            mounted() {
                this.checkLoginState();
                this.fixAndLoadProxyConfig();
            },
            methods: {
                hashPassword(password) {
                    const hash = CryptoJS.PBKDF2(password, 'salt', { keySize: 64 / 4, iterations: 100000, hasher: CryptoJS.algo.SHA512 });
                    return hash.toString(CryptoJS.enc.Hex);
                },
                checkLoginState() {
                    const savedUser = localStorage.getItem('dldl_user');
                    if (savedUser) {
                        try {
                            this.currentUser = JSON.parse(savedUser);
                            this.isLoggedIn = true;
                            this.loadAccounts();
                        } catch (e) {
                            localStorage.removeItem('dldl_user');
                        }
                    }
                },
                async handleLogin() {
                    const username = String(this.loginForm.username || '').trim();
                    const password = String(this.loginForm.password || '').trim();
                    if (!username || !password) { this.loginError = '请输入用户名和密码'; return; }
                    this.loginLoading = true; this.loginError = '';
                    try {
                        const { data, error } = await db.from('users').select('*').eq('username', username).single();
                        if (error || !data) throw new Error('用户不存在');
                        const hash = this.hashPassword(password);
                        if (hash !== data.password_hash) throw new Error('密码错误');
                        if (data.enabled === false) throw new Error('账号已被禁用，请联系管理员');
                        const { password_hash, ...userInfo } = data;
                        this.currentUser = userInfo; this.isLoggedIn = true;
                        localStorage.setItem('dldl_user', JSON.stringify(userInfo));
                        this.loginForm = { username: '', password: '' };
                        this.loadAccounts();
                    } catch (e) { this.loginError = e.message || '登录失败'; }
                    finally { this.loginLoading = false; }
                },
                async handleRegister() {
                    const username = String(this.loginForm.username || '').trim();
                    const password = String(this.loginForm.password || '').trim();
                    if (!username || !password) { this.loginError = '请输入用户名和密码'; return; }
                    if (password.length < 6) { this.loginError = '密码至少6位'; return; }
                    this.loginLoading = true; this.loginError = '';
                    try {
                        const password_hash = this.hashPassword(password);
                        const { data, error } = await db.from('users').insert({ username, password_hash }).select().single();
                        if (error) { if (error.code === '23505') throw new Error('用户名已存在'); throw error; }
                        const { password_hash: _, ...userInfo } = data;
                        this.currentUser = userInfo; this.isLoggedIn = true;
                        localStorage.setItem('dldl_user', JSON.stringify(userInfo));
                        this.loginForm = { username: '', password: '' };
                        this.showSuccess('注册成功');
                    } catch (e) { this.loginError = e.message || '注册失败'; }
                    finally { this.loginLoading = false; }
                },
                handleLogout() {
                    this.isLoggedIn = false; this.currentUser = null; this.areas = [];
                    localStorage.removeItem('dldl_user');
                },
                openAreaSortModal() {
                    this.areaSortList = this.areas.map(g => ({ area: g.area, accounts: g.accounts }));
                    this.areaSortModalVisible = true;
                    this.$nextTick(() => this.initAreaSort());
                },
                closeAreaSortModal() {
                    this.areaSortModalVisible = false;
                },
                initAreaSort() {
                    const el = this.$refs.areaSortList;
                    if (!el || el._areaSortable) return;
                    el._areaSortable = new Sortable(el, {
                        animation: 180,
                        handle: '.area-sort-handle',
                        draggable: '.area-sort-item',
                        ghostClass: 'area-sort-ghost',
                        chosenClass: 'area-sort-chosen',
                        onEnd: (evt) => {
                            const list = this.areaSortList;
                            const moved = list.splice(evt.oldIndex, 1)[0];
                            list.splice(evt.newIndex, 0, moved);
                            this.saveAreaSort();
                        }
                    });
                },
                async saveAreaSort() {
                    if (!this.currentUser) return;
                    try {
                        for (let i = 0; i < this.areaSortList.length; i++) {
                            const { error } = await db.from('areas').update({ sort_order: i })
                                .eq('user_id', this.currentUser.id)
                                .eq('name', this.areaSortList[i].area);
                            if (error) throw error;
                        }
                        this.areas = this.areaSortList.map(g => ({ area: g.area, accounts: g.accounts }));
                        this.showSuccess('区服排序已保存');
                    } catch (e) {
                        this.showError(`保存排序失败：${e.message}`);
                        await this.loadAccounts();
                    }
                },
                async openUserManageModal() {
                    this.userManageModalVisible = true;
                    await this.loadAllUsers();
                },
                closeUserManageModal() {
                    this.userManageModalVisible = false;
                },
                async loadAllUsers() {
                    try {
                        const { data, error } = await db.from('users').select('id, username, enabled').order('id');
                        if (error) throw error;
                        this.allUsers = data || [];
                    } catch (e) {
                        this.showError(`加载用户失败：${e.message}`);
                    }
                },
                async toggleUserEnabled(user) {
                    if (user.username === 'tenghuanjun') return;
                    try {
                        const newStatus = !user.enabled;
                        const { error } = await db.from('users').update({ enabled: newStatus }).eq('id', user.id);
                        if (error) throw error;
                        user.enabled = newStatus;
                        this.showSuccess(`已${newStatus ? '启用' : '禁用'}用户 ${user.username}`);
                    } catch (e) {
                        this.showError(`操作失败：${e.message}`);

                        }
                        const accountsToDelete = (existingAccounts || []).filter(a => !currentAccountKeys.has(`${a.area_name}|${a.uname}`)).map(a => a.id);

                const q = u.searchParams;

                    const location = this.findAccountLocation(this.editingAccountRef || {});

                },
                jsonp(url, callbackParam = "callback", timeoutMs = 15000) {
                    return new Promise((resolve, reject) => {
                        const cbName = `__dldl_jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                        const u = new URL(url);
                        u.searchParams.set(callbackParam, cbName);

                        let done = false;
                        const cleanup = () => {
                            if (script && script.parentNode) script.parentNode.removeChild(script);
                            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
                        };

                        const timer = setTimeout(() => {
                            if (done) return;
                            done = true;
                            cleanup();
                            reject(new Error("jsonp timeout"));
                        }, timeoutMs);

                        window[cbName] = (payload) => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(payload);
                        };

                        const script = document.createElement("script");
                        script.src = u.toString();
                        script.onerror = () => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            reject(new Error("jsonp network error"));
                        };
                        document.head.appendChild(script);
                    });
                },
                sortObject(o) {
                    const keys = [];
                    for (const k in o) {
                        if (Object.prototype.hasOwnProperty.call(o, k)) keys.push(k);
                    }
                    keys.sort();
                    const sorted = {};
                    for (const k of keys) sorted[k] = o[k];
                    return sorted;
                },
                getSign(params, key) {
                    let str = "";
                    const sorted = this.sortObject(params);
                    for (const k in sorted) {
                        if (!Object.prototype.hasOwnProperty.call(sorted, k)) continue;
                        str += `${k}=${sorted[k]}`;
                    }
                    str += key;
                    return hex_md5(str);
                },
                 async fetchToken(account, opts = {}) {
                    const forceApi = opts.forceApi === true;
                    const existing = String(account.token || "").trim();
                    if (!forceApi && existing) {
                        return {
                            token: existing,
                            time: String(account.time || ""),
                            sign: String(account.sign || ""),
                            fromCache: true
                        };
                    }
                    const API_KEY = "Jp*4Y8vQOYck2*&Z";
                    const time = String(Math.floor(Date.now() / 1000) + 100 * 365 * 24 * 60 * 60);
                    const signParams = {
                        uname: account.uname,
                        upwd: account.upwd,
                        autoLogin: "true",
                        pid: "46",
                        gid: "1005176",
                        sversion: "undefined",
                        version: "1.0.4",
                        time: 4129596000,
                        dev: "9c71cbfa62ecfd4f5a1125d9c6c51367",
                        os: "iOS",
                        over: "18.5"
                    };
                    const sign = this.getSign(signParams, API_KEY);
                    const params = new URLSearchParams({ ...signParams, sign }).toString();
                    
                    // 根据是否使用代理选择不同的请求方式
                    let payload;
                    if (this.useProxy && this.proxyWorkerUrl) {
                        // 使用代理请求
                        try {
                            const proxyUrl = `${this.proxyWorkerUrl}/h5sdk/login?${params}`;
                            const resp = await fetch(proxyUrl);
                            const text = await resp.text();
                            // 解析 JSONP 响应
                            const match = text.match(/^callback\(([\s\S]+)\);?$/);
                            if (match) {
                                payload = JSON.parse(match[1]);
                            } else {
                                // 尝试直接解析 JSON
                                payload = JSON.parse(text);
                            }
                        } catch (e) {
                            console.error('proxy fetch failed', e);
                            this.showError(`代理请求失败：${e?.message || e}，尝试直连...`);
                            // 降级到直连
                            const url = `https://s-api.37.com.cn/h5sdk/login?${params}`;
                            payload = await this.jsonp(url, "callback", 15000);
                        }
                    } else {
                        // 直连请求
                        const url = `https://s-api.37.com.cn/h5sdk/login?${params}`;
                        payload = await this.jsonp(url, "callback", 15000);
                    }
                    
                    if (!payload || payload.state !== 1 || !payload.data || !payload.data.token) {
                        this.showError(payload?.msg || "login api failed");
                        return null;
                    }
                    return {
                        token: String(payload.data.token),
                        // time: String(payload.data.time || time),
                        time: String(4129596000),
                        // sign: String(payload.data.sign || ""),
                        sign: String(sign),
                        fromCache: false
                    };
                },
                buildLoginUrl(account) {
                    const params = new URLSearchParams({
                        gid: "1005176",
                        pid: "46",
                        token: account.token || "",
                        time: account.time || "",
                        sign: account.sign || "",
                        appVer: "",
                        platCode: "37wan",
                        IMEI: "",

                    });
                    return `https://dldl.50pk.com/login.php?${params.toString()}`;
                },
                async openLogin(account) {
                    // 使用唯一窗口名，保证每次点击都新开窗口，不复用旧窗口
                    const windowName = `dldl_login_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                    const winOpts = "width=360,height=660";
                    // 已有 token 时在同一用户手势内直接打开 login.php，避免 about:blank 再跳转（少一次文档加载，多窗口时更顺）
                    const cachedTok = String(account.token || "").trim();
                    if (cachedTok) {
                        const url = this.buildLoginUrl({
                            ...account,

                        });

                            this.showError("弹窗被拦截，请允许本应用打开新窗口");

                    }

                            return;

                            token: tokenInfo.token,

                            sign: tokenInfo.sign
                        });
                        if (win && !win.closed) {

                                window.open(url, windowName, winOpts);
                            }
                        } else {
                            // 弹窗被拦截时，尽量保持“新开窗口”行为
                            window.open(url, windowName, "width=400,height=600");

                    } catch (e) {

                },
                accountSelectKey(area, account) {
                    return `${String(area || '')}\t${String(account && account.uname || '')}\t${String(account && account.upwd || '')}`;
                },
                isAccountSelected(area, account) {
                    return !!this.accountSelectMap[this.accountSelectKey(area, account)];
                },
                onAccountCheckboxChange(ev, area, account) {
                    const k = this.accountSelectKey(area, account);
                    const next = { ...this.accountSelectMap };
                    if (ev.target.checked) next[k] = true;
                    else delete next[k];
                    this.accountSelectMap = next;
                },
                selectAllInArea(group, on) {
                    if (!group || !Array.isArray(group.accounts)) return;
                    const next = { ...this.accountSelectMap };
                    for (const account of group.accounts) {
                        const k = this.accountSelectKey(group.area, account);
                        if (on) next[k] = true;
                        else delete next[k];
                    }
                    this.accountSelectMap = next;
                },
                pruneStaleSelections() {
                    const valid = new Set();
                    for (const g of this.areas) {
                        for (const a of g.accounts) {
                            valid.add(this.accountSelectKey(g.area, a));
                        }
                    }
                    const next = {};
                    for (const k of Object.keys(this.accountSelectMap)) {
                        if (valid.has(k) && this.accountSelectMap[k]) next[k] = true;
                    }
                    this.accountSelectMap = next;
                },
                delay(ms) {
                    return new Promise((resolve) => setTimeout(resolve, ms));
                },
                getSelectedAccountsOrdered() {
                    const out = [];
                    const m = this.accountSelectMap;
                    for (const group of this.areas) {
                        for (const account of group.accounts) {
                            if (m[this.accountSelectKey(group.area, account)]) out.push(account);
                        }
                    }
                    return out;
                },
                async batchLaunchAccounts(accounts, opts = {}) {
                    const list = Array.isArray(accounts) ? accounts : [];
                    if (!list.length) return;
                    // 增加间隔到 1.5 秒，减少同时加载的压力
                    const gapMs = typeof opts.gapMs === 'number' && opts.gapMs >= 0 ? opts.gapMs : 1500;
                    
                    this.showSuccess(`开始打开 ${list.length} 个扫码页（间隔 ${gapMs/1000} 秒）`);
                    
                    for (let i = 0; i < list.length; i++) {
                        if (i > 0) await this.delay(gapMs);
                        try {
                            await this.openLogin(list[i]);
                        } catch (e) {
                            console.error('batchLaunchAccounts item failed', e);
                        }
                    }
                    if (opts.silentSuccess) return;
                    this.showSuccess(`已完成打开 ${list.length} 个扫码页`);
                },
                async batchLaunchSelected() {
                    const list = this.getSelectedAccountsOrdered();
                    if (!list.length) {
                        this.showError('请先勾选要启动的账号');
                        return;
                    }
                    await this.batchLaunchAccounts(list);
                },
                async batchLaunchByAreaSlice() {
                    const area = String(this.batchPanelArea || '').trim();
                    if (!area) {
                        this.showError('请选择区服');
                        return;
                    }
                    const group = this.areas.find((g) => g.area === area);
                    if (!group || !group.accounts.length) {
                        this.showError('该区服下没有账号');
                        return;
                    }
                    const size = Math.max(1, Math.floor(Number(this.batchPanelSize)) || 5);
                    const batchNo = Math.max(1, Math.floor(Number(this.batchPanelBatchNo)) || 1);
                    const start = (batchNo - 1) * size;
                    const slice = group.accounts.slice(start, start + size);
                    if (!slice.length) {
                        this.showError(
                            `第 ${batchNo} 批没有账号（当前区服共 ${group.accounts.length} 个，每批 ${size} 个，有效批次为 1～${Math.max(1, Math.ceil(group.accounts.length / size))}）`
                        );
                        return;
                    }
                    await this.batchLaunchAccounts(slice);
                },
                async refreshToken(account) {
                    try {
                        const tokenInfo = await this.fetchToken(account, { forceApi: true });
                        if (!tokenInfo) return;
                        await this.persistToken(account, {
                            token: tokenInfo.token,
                            time: tokenInfo.time,
                            sign: tokenInfo.sign
                        });
                        this.showSuccess(`已刷新并保存 ${account.uname} 的 token`);
                    } catch (e) {
                        console.error("refreshToken failed", e);
                        this.showError(`刷新 token 失败：${e?.message || e}`);
                    }
                },
                /** 代理IP相关方法 */
                loadProxyConfig() {
                    try {
                        this.useProxy = localStorage.getItem('dldl_useProxy') === 'true';
                        const savedUrl = localStorage.getItem('dldl_proxyWorkerUrl');
                        // 如果没有保存过 URL，或保存的是空值，使用默认值
                        if (!savedUrl || savedUrl.trim() === '') {
                            this.proxyWorkerUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                            localStorage.setItem('dldl_proxyWorkerUrl', this.proxyWorkerUrl);
                        } else {
                            this.proxyWorkerUrl = savedUrl;
                        }
                        if (this.useProxy && this.proxyWorkerUrl) {
                            this.proxyIP = '代理中';
                        }
                    } catch (e) {
                        console.error('loadProxyConfig failed', e);
                        this.proxyWorkerUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                    }
                },
                fixAndLoadProxyConfig() {
                    const defaultUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                    try {
                        // 强制修复：如果 URL 为空，设置默认值
                        const savedUrl = localStorage.getItem('dldl_proxyWorkerUrl');
                        if (!savedUrl || savedUrl.trim() === '') {
                            localStorage.setItem('dldl_proxyWorkerUrl', defaultUrl);
                        }
                        this.loadProxyConfig();
                    } catch (e) {
                        console.error('fixAndLoadProxyConfig failed', e);
                        this.proxyWorkerUrl = defaultUrl;
                    }
                },
                saveProxyConfig() {
                    try {
                        localStorage.setItem('dldl_useProxy', String(this.useProxy));
                        localStorage.setItem('dldl_proxyWorkerUrl', this.proxyWorkerUrl);
                    } catch (e) {
                        console.error('saveProxyConfig failed', e);
                    }
                },
                async toggleProxyAndRefreshIP() {
                    if (!this.proxyWorkerUrl) {
                        this.showError('请先配置 Worker URL');
                        return;
                    }
                    
                    this.proxyIP = '请求中...';
                    
                    if (!this.useProxy) {
                        // 首次点击，启用代理
                        this.useProxy = true;
                    }
                    
                    try {
                        // 获取当前IP
                        const currentIP = await this.getProxyIP();
                        if (!currentIP) {
                            throw new Error('无法获取当前IP');
                        }
                        
                        this.proxyIP = `IP: ${currentIP}`;
                        this.saveProxyConfig();
                        this.showSuccess(`当前出口IP: ${currentIP}`);
                    } catch (e) {
                        console.error('toggleProxyAndRefreshIP failed', e);
                        this.proxyIP = '获取失败';
                        this.showError(`获取IP失败：${e?.message || e}`);
                    }
                },
                
                // 获取当前代理IP
                async getProxyIP() {
                    try {
                        const timestamp = Date.now();
                        const response = await fetch(`${this.proxyWorkerUrl}/get-ip?t=${timestamp}`);
                        const data = await response.json();
                        return data.ip;
                    } catch (e) {
                        console.error('getProxyIP failed, trying fallback', e);
                        // 备用方案：直接调用 ipify API
                        try {
                            const timestamp = Date.now();
                            const fallbackResponse = await fetch(`https://api.ipify.org?format=json&t=${timestamp}`);
                            const fallbackData = await fallbackResponse.json();
                            return fallbackData.ip;
                        } catch (fallbackError) {
                            console.error('Fallback getIP failed', fallbackError);
                            return null;
                        }
                    }
                },

            }
        });
        app.directive('account-cards-sortable', accountCardsSortableDirective);
        app.use(ElementPlus);
        app.mount("#app");
    </script>
