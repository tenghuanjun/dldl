<html class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>账号列表页</title>
    <script src="vue.global.js"></script>
    <link rel="stylesheet" href="lib/element-plus.css" />
    <link rel="stylesheet" href="lib/element-plus-dark.css" />
    <script src="lib/element-plus.min.js"></script>
    <script src="lib/Sortable.min.js"></script>
    <script src="lib/supabase.min.js"></script>
    <script src="lib/crypto-js.js"></script>
</head>

<body>
    <div id="app" class="container">
        <div v-if="!isLoggedIn" class="login-container">
            <div class="login-box">
                <h2 class="login-title">用户登录</h2>
                <div class="login-form">
                    <div class="login-field">
                        <label class="login-label">用户名</label>
                        <input class="login-input" v-model="loginForm.username" placeholder="请输入用户名" @keyup.enter="handleLogin">
                    </div>
                    <div class="login-field">
                        <label class="login-label">密码</label>
                        <input class="login-input" type="password" v-model="loginForm.password" placeholder="请输入密码" @keyup.enter="handleLogin">
                    </div>
                    <div class="login-actions">
                        <button class="btn login-btn" type="button" @click="handleLogin" :disabled="loginLoading" :class="{ 'btn-loading': loginLoading }">{{ loginLoading ? '登录中...' : '登录' }}</button>
                        <button class="btn btn-secondary login-btn" type="button" @click="handleRegister" :disabled="loginLoading" :class="{ 'btn-loading': loginLoading }">{{ loginLoading ? '注册中...' : '注册' }}</button>
                    </div>
                    <div v-if="loginError" class="login-error">{{ loginError }}</div>
                </div>
            </div>
        </div>
        <template v-if="isLoggedIn">
        <header class="account-controls-sticky">
            <div class="sticky-row sticky-row-top">
                <h1 class="sticky-page-title">多账号扫码入口</h1>
                <div class="user-info">
                    <span class="username">{{ currentUser?.username }}</span>
                    <button v-if="isAdmin" class="btn btn-secondary btn-compact" type="button" @click="openUserManageModal">用户管理</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="handleLogout">退出</button>
                </div>
                <div class="sticky-tools">
                    <button class="btn btn-secondary btn-compact" type="button" @click="openAccountModal()">新增</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="showPwd = !showPwd">{{ showPwd ? '隐藏密码' : '显示密码' }}</button>
                    <select
                        v-model="batchLaunchMode"
                        class="batch-launch-mode-select"
                        title="批量启动方式"
                    >
                        <option value="quick">快捷登录</option>
                        <option value="scan">扫码页</option>
                    </select>
                    <button
                        class="btn btn-compact"
                        type="button"
                        :disabled="selectedAccountCount === 0"
                        @click="batchLaunchSelected"
                    >批量启动（{{ selectedAccountCount }}）</button>
                    <button
                        class="btn btn-compact"
                        :class="useProxy ? 'btn-proxy-active' : 'btn-secondary'"
                        type="button"
                        @click="toggleProxyAndRefreshIP"
                    >{{ proxyIP === '切换中...' ? '代理IP: 切换中...' : (useProxy ? proxyIP : '代理IP: 未启用（点击启用并切换IP）') }}</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="openAreaSortModal">区服排序</button>
                </div>
            </div>
            <div class="sticky-row sticky-row-batch">
                <span class="batch-row-head">
                    同区批次
                    <span class="batch-info-icon" title="按该区下列表顺序分批启动，与下方勾选无关">ⓘ</span>
                </span>
                <el-select
                    v-model="batchPanelArea"
                    class="batch-area-select batch-select-ep"
                    size="default"
                    filterable
                    clearable
                    placeholder="区服"
                >
                    <el-option
                        v-for="g in areas"
                        :key="'batch-opt-' + g.area"
                        :label="g.area"
                        :value="g.area"
                    />
                </el-select>
                <label class="batch-inline-label">每批</label>
                <input
                    v-model.number="batchPanelSize"
                    type="number"
                    min="1"
                    step="1"
                    class="form-input batch-num-input"
                >
                <label class="batch-inline-label">第</label>
                <input
                    v-model.number="batchPanelBatchNo"
                    type="number"
                    min="1"
                    step="1"
                    class="form-input batch-num-input"
                >
                <label class="batch-inline-label">批</label>
                <button class="btn btn-compact" type="button" @click="batchLaunchByAreaSlice">启动该批</button>
            </div>
        </header>

        <section class="area" v-for="group in areas" :key="group.area">
            <div class="area-head">
                <div class="area-title">{{ group.area }}</div>
                <div class="area-sub">
                    {{ group.accounts.length }} 个账号
                    <button type="button" class="btn-link" @click="selectAllInArea(group, true)">全选</button>
                    <button type="button" class="btn-link" @click="selectAllInArea(group, false)">取消全选</button>
                    <button class="btn btn-danger btn-mini" type="button" @click="deleteArea(group)">删除区服</button>
                </div>
            </div>

            <div class="cards" v-account-cards-sortable="group">
                <div class="card sortable-account-card" v-for="account in group.accounts" :key="`${group.area}-${account.uname}`">
                    <label class="card-check-wrap" @mousedown.stop @click.stop>
                        <input
                            type="checkbox"
                            :checked="isAccountSelected(group.area, account)"
                            @change="onAccountCheckboxChange($event, group.area, account)"
                        >
                    </label>
                    <button type="button" class="card-drag-handle" aria-label="拖拽排序" title="拖拽排序">⋮⋮</button>
                    <div class="card-main">
                        <div class="card-top">
                            <div class="card-name">
                                <div class="nick white-space-nowrap">{{ account.name || '-' }}</div>
                                <div class="uname white-space-nowrap" v-if="showPwd">{{ account.uname }}</div>
                                <div class="uname white-space-nowrap" v-if="showPwd">{{ account.upwd }}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-secondary" type="button" @click="editAccount(account)">编辑</button>
                                <button class="btn btn-secondary" type="button" @click="refreshToken(account)">刷新 token</button>
                                <button class="btn btn-secondary" type="button" @click="copyLoginUrl(account)">复制网址</button>
                                <button class="btn" type="button" @click="openLogin(account)">打开扫码页</button>
                                <button class="btn btn-secondary" type="button" @click="openQuickLogin(group.area, account)">快捷登录</button>
                                <button class="btn btn-secondary" type="button" @click="appLogin(account)">APP登录</button>
                            </div>
                            <div class="card-pass-row">
                                <div class="pass-code-input-wrap">
                                    <input
                                        ref="passCodeInputs"
                                        class="pass-code-input"
                                        type="text"
                                        placeholder="通行证码"
                                        :value="getPassCodeValue(group.area, account)"
                                        @input="onPassCodeInput($event, group.area, account)"
                                        @blur="onPassCodeBlur($event, group.area, account)"
                                        @keyup.enter="($event) => { $event.target.blur(); }"
                                    >
                                    <button
                                        v-if="getPassCodeValue(group.area, account)"
                                        class="pass-code-clear"
                                        type="button"
                                        tabindex="-1"
                                        title="清除"
                                        @mousedown.prevent="clearPassCode(group.area, account)"
                                    >✕</button>
                                </div>
                                <span v-if="isPassCodeSending(group.area, account)" class="pass-code-status sending">发送中…</span>
                                <span v-else-if="getPassCodeStatus(group.area, account) === 'ok'" class="pass-code-status ok">已发送 ✓</span>
                                <span v-else-if="getPassCodeStatus(group.area, account) === 'expired'" class="pass-code-status expired">已失效</span>
                                <span v-else-if="getPassCodeStatus(group.area, account) === 'fail'" class="pass-code-status fail">失败</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="tip">同一区服下可按住左侧「⋮⋮」拖拽卡片调整账号顺序，松手后自动保存到数据库。勾选卡片左侧复选框后点「批量启动」会按所选方式（快捷登录/扫码页）依次打开窗口（可跨多个区服，只启动已勾选的账号）。「同区服按批次启动」用于同一区内按每批人数、第几批切片启动，与勾选无关。单个账号仍点「打开扫码页」或「快捷登录」。</div>
        <div class="tip tip-secondary">点击「打开扫码页」会经本地代理打开 login.php：若当前账号已缓存 token，则直接使用；仅在没有 token 时会请求 h5sdk/login 并写入 Supabase。账号页或扫码页内「刷新 token」成功后，会将新 token/time/sign 更新到 Supabase 对应账号行（按 id 匹配）。</div>
        <div class="tip tip-secondary">「快捷登录」携带该账号的 uname、upwd、uinfo 打开新窗口，在 <code>37.com.cn/h5game/public/?pid=46&amp;gid=1005176</code> 注入 UINFO/HISTORY cookie 完成登录。无 uinfo 时按 uname/upwd 自动生成。需使用 DLDL-Proxy 桌面客户端。</div>
        <div class="tip tip-secondary">「代理IP」使用 GitHub Actions Runner 的 Azure IP 轮换：点击按钮查看当前可用 IP。每个账号的「刷新 token」优先使用 Actions 缓存的 token（5 分钟内有效），缓存未命中时走代理池直连。如需强制从全新 IP 获取 token，请在项目目录启动 proxy 后调用 <code>POST /gh-relay/request-token</code>（最多等待 2 分钟，Actions 定时任务每 5 分钟执行一次）。</div>

        <div v-if="accountModalVisible" class="modal-mask" @click.self="closeAccountModal()">
            <div class="modal">
                <div class="modal-title">{{ accountModalMode === 'create' ? '新增账号' : '编辑账号' }}</div>
                <div class="form-grid">
                    <div class="form-field full">
                        <label class="form-label">区服</label>
                        <el-select
                            v-model="accountForm.area"

                            default-first-option
                            clearable

                            <el-option
                                v-for="group in areas"
                                :key="group.area"
                                :label="group.area"
                                :value="group.area"
                            />
                        </el-select>
                    </div>
                    <div class="form-field">
                        <label class="form-label">昵称 name</label>
                        <input class="form-input" v-model="accountForm.name" placeholder="请输入昵称">
                    </div>
                    <div class="form-field">
                        <label class="form-label">账号 uname</label>
                        <input class="form-input" v-model="accountForm.uname" placeholder="请输入账号">
                    </div>
                    <div class="form-field full">
                        <label class="form-label">密码 upwd</label>
                        <input class="form-input" v-model="accountForm.upwd" placeholder="请输入密码">
                    </div>
                    <div class="form-field full form-section-label">快捷登录 Cookie</div>
                    <div class="form-field full">
                        <label class="form-label">uinfo</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.uinfo" rows="2" placeholder="可选；快捷登录优先使用该值注入 UINFO，留空则按 uname/upwd 自动生成"></textarea>
                    </div>
                    <div class="form-field full">
                        <label class="form-label">history</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.history" rows="2" placeholder='可选；建议为 JSON 数组，如 [{"uname":"xxx","upwd":"yyy"}]'></textarea>
                    </div>
                    <div class="form-field full form-section-label">扫码登录 token</div>
                    <div class="form-field full">
                        <label class="form-label">完整登录地址</label>
                        <div class="url-extract-row">
                            <textarea
                                v-model="loginUrlPaste"
                                class="form-input form-textarea url-paste-input"
                                rows="2"
                                placeholder="粘贴浏览器地址栏中的 login.php?... 整段链接，点击右侧「提取」自动填入下方三项"
                            ></textarea>
                            <button type="button" class="btn url-extract-btn" @click="extractLoginParamsFromUrl">提取</button>
                        </div>
                    </div>
                    <div class="form-field full">
                        <label class="form-label">token</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.token" rows="3" placeholder="可选；留空则打开扫码页时会自动拉取"></textarea>
                    </div>
                    <div class="form-field">
                        <label class="form-label">time</label>
                        <input class="form-input" v-model="accountForm.time" placeholder="可选，与 sign 配套">
                    </div>
                    <div class="form-field">
                        <label class="form-label">sign</label>
                        <input class="form-input form-mono" v-model="accountForm.sign" placeholder="可选，与 time 配套">
                    </div>
                    <div class="form-field full form-section-label">APP登录地址</div>
                    <div class="form-field full">
                        <label class="form-label">url</label>
                        <div class="pass-code-input-wrap">
                            <textarea
                                class="form-input form-textarea form-mono"
                                v-model="accountForm.url"
                                rows="2"
                                placeholder="点击「APP登录」后自动生成，可手动编辑"
                            ></textarea>
                            <button
                                v-if="accountForm.url"
                                class="pass-code-clear"
                                type="button"
                                tabindex="-1"
                                title="清除"
                                @mousedown.prevent="accountForm.url = ''"
                            >✕</button>
                        </div>
                    </div>
                </div>
                <div class="form-help">保存后会写入数据库，新增账号会自动创建对应区服分组。可将完整 login.php 链接粘贴到上方并点「提取」，或手动填写 token / time / sign，或通过「刷新 token」写入。</div>
                <div class="modal-actions">
                    <button v-if="accountModalMode === 'edit'" class="btn btn-danger" type="button" @click="deleteEditingAccount()">删除账号</button>
                    <button class="btn btn-secondary" type="button" @click="closeAccountModal()">取消</button>
                    <button class="btn" type="button" @click="submitAccountModal()">保存</button>
                </div>
            </div>
        </div>

        <div v-if="areaSortModalVisible" class="modal-mask" @click.self="closeAreaSortModal">
            <div class="modal">
                <div class="modal-title">区服排序</div>
                <div class="area-sort-tip">拖拽下方区服调整顺序，松手后自动保存</div>
                <div class="area-sort-list" ref="areaSortList">
                    <div class="area-sort-item" v-for="group in areaSortList" :key="group.area" :data-area="group.area">
                        <span class="area-sort-handle">⋮⋮</span>
                        <span class="area-sort-name">{{ group.area }}</span>
                        <span class="area-sort-count">{{ group.accounts.length }} 个账号</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" type="button" @click="closeAreaSortModal">关闭</button>
                </div>
            </div>
        </div>

        <div v-if="userManageModalVisible" class="modal-mask" @click.self="closeUserManageModal">
            <div class="modal" style="max-width: 600px;">
                <div class="modal-title">用户管理</div>
                <div class="user-manage-tip">tenghuanjun 为管理员，不可禁用和删除</div>
                <div class="user-manage-list">
                    <div class="user-manage-item" v-for="user in allUsers" :key="user.id">
                        <span class="user-manage-name">{{ user.username }}</span>
                        <span class="user-manage-role" v-if="user.username === 'tenghuanjun'">管理员</span>
                        <span class="user-manage-status" :class="user.enabled ? 'status-enabled' : 'status-disabled'">{{ user.enabled ? '已启用' : '已禁用' }}</span>
                        <button class="btn btn-mini" :class="user.enabled ? 'btn-danger' : 'btn-success'" type="button" @click="toggleUserEnabled(user)" :disabled="user.username === 'tenghuanjun'">{{ user.enabled ? '禁用' : '启用' }}</button>
                        <button class="btn btn-secondary btn-mini" type="button" @click="openChangePwdModal(user)">改密码</button>
                        <button class="btn btn-danger btn-mini" type="button" @click="deleteUser(user)" :disabled="user.username === 'tenghuanjun'">删除</button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" type="button" @click="closeUserManageModal">关闭</button>
                </div>
            </div>
        </div>

        <div v-if="changePwdModalVisible" class="modal-mask" @click.self="closeChangePwdModal">
            <div class="modal" style="max-width: 360px;">
                <div class="modal-title">修改密码 - {{ changePwdUser?.username }}</div>
                <div class="login-field">
                    <label class="login-label">新密码</label>
                    <input class="login-input" type="password" v-model="newPassword" placeholder="请输入新密码" @keyup.enter="submitChangePwd">
                </div>
                <div class="modal-actions" style="margin-top: 16px;">
                    <button class="btn btn-secondary" type="button" @click="closeChangePwdModal">取消</button>
                    <button class="btn" type="button" @click="submitChangePwd">确认修改</button>
                </div>
            </div>
        </div>

        <div v-if="loadingVisible" class="loading-mask">
            <div class="loading-spinner"></div>
            <div class="loading-text">{{ loadingText || '加载中...' }}</div>
        </div>
        </template>
    </div>
    <script src="md5.js"></script>
    <script>
        const { createApp } = Vue;
        const ElMessage = window.ElementPlus?.ElMessage;
        const ElMessageBox = window.ElementPlus?.ElMessageBox;

        function destroyAccountCardsSortable(el) {
            if (el._accountCardsSortable) {
                el._accountCardsSortable.destroy();
                el._accountCardsSortable = null;
            }
        }

        const accountCardsSortableDirective = {
            mounted(el, binding) {
                el._sortableGroupRef = binding.value;
                const SortableCtor = window.Sortable;
                if (typeof SortableCtor !== 'function' || !binding.value || !Array.isArray(binding.value.accounts)) {
                    return;
                }
                el._accountCardsSortable = SortableCtor.create(el, {
                    animation: 180,
                    handle: '.card-drag-handle',
                    draggable: '.sortable-account-card',
                    ghostClass: 'card-sortable-ghost',
                    chosenClass: 'card-sortable-chosen',
                    dragClass: 'card-sortable-drag',
                    forceFallback: true,
                    fallbackTolerance: 5,
                    onEnd(evt) {
                        const g = el._sortableGroupRef;
                        if (!g || !Array.isArray(g.accounts)) return;
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        if (oldIndex === newIndex || oldIndex == null || newIndex == null) return;
                        const list = g.accounts;
                        const moved = list.splice(oldIndex, 1)[0];
                        list.splice(newIndex, 0, moved);
                        const vm = binding.instance;
                        if (vm && typeof vm.onAccountCardsSorted === 'function') {
                            void vm.onAccountCardsSorted();
                        }
                    }
                });
            },
            updated(el, binding) {
                el._sortableGroupRef = binding.value;
            },
            unmounted(el) {
                destroyAccountCardsSortable(el);
            }
        };

        const supabaseUrl = 'https://xywlbjsyhpyyxboznmct.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5d2xianN5aHB5eXhib3pubWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODgwNzIsImV4cCI6MjA5NDY2NDA3Mn0.Q0KzoMgwNInH4gi30DEK_d1NbZCwl5yFjnTjubm_gYs';
        const db = supabase.createClient(supabaseUrl, supabaseKey);
        console.log('Supabase initialized OK');

        // 与 bundle.js SQUtil.encode 一致的 UINFO 编码函数
        function encodeUinfoPlain(plain) {
            const code = String(plain);
            if (!code) return '';
            let c = String.fromCharCode(code.charCodeAt(0) + code.length);
            for (let i = 1; i < code.length; i++) {
                c += String.fromCharCode(code.charCodeAt(i) + code.charCodeAt(i - 1));
            }
            return encodeURIComponent(c);
        }

        // 按 bundle.js 登录成功后的写法生成 UINFO、HISTORY cookie 值
        function build37CookieValues(account) {
            const uname = String(account.uname || '').trim();
            const upwd = String(account.upwd || '').trim();
            const uinfoObj = { uname, upwd, autoLogin: account.autoLogin !== false };
            const uinfo = encodeUinfoPlain(JSON.stringify(uinfoObj));
            const history = JSON.stringify([{ uname, upwd }]);
            return { uinfo, history };
        }

        const app = createApp({
            data() {
                return {
                    isLoggedIn: false,
                    currentUser: null,
                    loginForm: { username: '', password: '' },
                    loginLoading: false,
                    loginError: '',
                    showPwd: false,
                    areas: [],
                    accountModalVisible: false,
                    accountModalMode: 'create',
                    accountForm: { area: '', name: '', uname: '', upwd: '', token: '', time: '', sign: '', uinfo: '', history: '', url: '' },
                    loginUrlPaste: '',
                    editingAccountRef: null,
                    /** 勾选批量启动：key = accountSelectKey(area, account) */
                    accountSelectMap: {},
                    /** 批量启动方式：quick=快捷登录, scan=扫码页 */
                    batchLaunchMode: 'quick',
                    /** 同区服按批次：区服、每批个数、第几批（从 1 开始） */
                    batchPanelArea: '',
                    batchPanelSize: 5,
                    batchPanelBatchNo: 1,
                    /** 通行证登录 */
                    passCodeMap: {},
                    /** 代理IP配置 */
                    useProxy: false,
                    proxyWorkerUrl: 'https://red-moon-ff95.tenghuanjun.workers.dev',
                    proxyIP: '直连',
                    areaSortModalVisible: false,
                    areaSortList: [],
                    userManageModalVisible: false,
                    allUsers: [],
                    changePwdModalVisible: false,
                    changePwdUser: null,
                    newPassword: '',
                    loadingVisible: false,
                    loadingText: '',
                };
            },
            computed: {
                selectedAccountCount() {
                    const m = this.accountSelectMap;
                    return Object.keys(m).filter((k) => m[k]).length;
                },
                isAdmin() {
                    return this.currentUser?.username === 'tenghuanjun';
                }
            },
            mounted() {
                this.checkLoginState();
                this.fixAndLoadProxyConfig();
                this._onLoginPageTokenMessage = (event) => {
                    if (event.origin !== window.location.origin) return;
                    const payload = event.data;
                    if (!payload || payload.type !== 'dldl_token_refreshed') return;
                    void this.handleTokenRefreshedFromLoginPage(payload);
                };
                window.addEventListener('message', this._onLoginPageTokenMessage);
            },
            beforeUnmount() {
                if (this._onLoginPageTokenMessage) {
                    window.removeEventListener('message', this._onLoginPageTokenMessage);
                }
            },
            methods: {
                hashPassword(password) {
                    const hash = CryptoJS.PBKDF2(password, 'salt', { keySize: 64 / 4, iterations: 100000, hasher: CryptoJS.algo.SHA512 });
                    return hash.toString(CryptoJS.enc.Hex);
                },
                checkLoginState() {
                    const savedUser = localStorage.getItem('dldl_user');
                    if (savedUser) {
                        try {
                            this.currentUser = JSON.parse(savedUser);
                            this.isLoggedIn = true;
                            this.loadAccounts();
                        } catch (e) {
                            localStorage.removeItem('dldl_user');
                        }
                    }
                },
                async handleLogin() {
                    const username = String(this.loginForm.username || '').trim();
                    const password = String(this.loginForm.password || '').trim();
                    if (!username || !password) { this.loginError = '请输入用户名和密码'; return; }
                    this.loginLoading = true; this.loginError = '';
                    try {
                        const { data, error } = await db.from('users').select('*').eq('username', username).single();
                        if (error || !data) throw new Error('用户不存在');
                        const hash = this.hashPassword(password);
                        if (hash !== data.password_hash) throw new Error('密码错误');
                        if (data.enabled === false) throw new Error('账号已被禁用，请联系管理员');
                        const { password_hash, ...userInfo } = data;
                        this.currentUser = userInfo; this.isLoggedIn = true;
                        localStorage.setItem('dldl_user', JSON.stringify(userInfo));
                        this.loginForm = { username: '', password: '' };
                        this.loadAccounts();
                    } catch (e) { this.loginError = e.message || '登录失败'; }
                    finally { this.loginLoading = false; }
                },
                async handleRegister() {
                    const username = String(this.loginForm.username || '').trim();
                    const password = String(this.loginForm.password || '').trim();
                    if (!username || !password) { this.loginError = '请输入用户名和密码'; return; }
                    if (password.length < 6) { this.loginError = '密码至少6位'; return; }
                    this.loginLoading = true; this.loginError = '';
                    try {
                        const password_hash = this.hashPassword(password);
                        const { data, error } = await db.from('users').insert({ username, password_hash }).select().single();
                        if (error) { if (error.code === '23505') throw new Error('用户名已存在'); throw error; }
                        const { password_hash: _, ...userInfo } = data;
                        this.currentUser = userInfo; this.isLoggedIn = true;
                        localStorage.setItem('dldl_user', JSON.stringify(userInfo));
                        this.loginForm = { username: '', password: '' };
                        this.showSuccess('注册成功');
                    } catch (e) { this.loginError = e.message || '注册失败'; }
                    finally { this.loginLoading = false; }
                },
                handleLogout() {
                    this.isLoggedIn = false; this.currentUser = null; this.areas = [];
                    localStorage.removeItem('dldl_user');
                },
                openAreaSortModal() {
                    this.areaSortList = this.areas.map(g => ({ area: g.area, accounts: g.accounts }));
                    this.areaSortModalVisible = true;
                    this.$nextTick(() => this.initAreaSort());
                },
                closeAreaSortModal() {
                    this.areaSortModalVisible = false;
                },
                initAreaSort() {
                    const el = this.$refs.areaSortList;
                    if (!el || el._areaSortable) return;
                    el._areaSortable = new Sortable(el, {
                        animation: 180,
                        handle: '.area-sort-handle',
                        draggable: '.area-sort-item',
                        ghostClass: 'area-sort-ghost',
                        chosenClass: 'area-sort-chosen',
                        onEnd: (evt) => {
                            const list = this.areaSortList;
                            const moved = list.splice(evt.oldIndex, 1)[0];
                            list.splice(evt.newIndex, 0, moved);
                            this.saveAreaSort();
                        }
                    });
                },
                async saveAreaSort() {
                    if (!this.currentUser) return;
                    try {
                        for (let i = 0; i < this.areaSortList.length; i++) {
                            const { error } = await db.from('areas').update({ sort_order: i })
                                .eq('user_id', this.currentUser.id)
                                .eq('name', this.areaSortList[i].area);
                            if (error) throw error;
                        }
                        this.areas = this.areaSortList.map(g => ({ area: g.area, accounts: g.accounts }));
                        this.showSuccess('区服排序已保存');
                    } catch (e) {
                        this.showError(`保存排序失败：${e.message}`);
                        await this.loadAccounts();
                    }
                },
                async openUserManageModal() {
                    this.userManageModalVisible = true;
                    await this.loadAllUsers();
                },
                closeUserManageModal() {
                    this.userManageModalVisible = false;
                },
                async loadAllUsers() {
                    try {
                        const { data, error } = await db.from('users').select('id, username, enabled').order('id');
                        if (error) throw error;
                        this.allUsers = data || [];
                    } catch (e) {
                        this.showError(`加载用户失败：${e.message}`);
                    }
                },
                async toggleUserEnabled(user) {
                    if (user.username === 'tenghuanjun') return;
                    try {
                        const newStatus = !user.enabled;
                        const { error } = await db.from('users').update({ enabled: newStatus }).eq('id', user.id);
                        if (error) throw error;
                        user.enabled = newStatus;
                        this.showSuccess(`已${newStatus ? '启用' : '禁用'}用户 ${user.username}`);
                    } catch (e) {
                        this.showError(`操作失败：${e.message}`);
                    }
                },
                async deleteUser(user) {
                    if (user.username === 'tenghuanjun') return;
                    const confirmed = await this.confirmAction(`确认删除用户 ${user.username} 吗？该用户下的所有区服和账号将一并删除，不可恢复。`, '删除用户');
                    if (!confirmed) return;
                    try {
                        await db.from('accounts').delete().eq('user_id', user.id);
                        await db.from('areas').delete().eq('user_id', user.id);
                        const { error } = await db.from('users').delete().eq('id', user.id);
                        if (error) throw error;
                        this.allUsers = this.allUsers.filter(u => u.id !== user.id);
                        this.showSuccess(`已删除用户 ${user.username}`);
                    } catch (e) {
                        this.showError(`删除失败：${e.message}`);
                    }
                },
                openChangePwdModal(user) {
                    this.changePwdUser = user;
                    this.newPassword = '';
                    this.changePwdModalVisible = true;
                },
                closeChangePwdModal() {
                    this.changePwdModalVisible = false;
                    this.changePwdUser = null;
                },
                async submitChangePwd() {
                    const pwd = String(this.newPassword || '').trim();
                    if (!pwd) { this.showError('请输入新密码'); return; }
                    if (pwd.length < 6) { this.showError('密码至少6位'); return; }
                    try {
                        const password_hash = this.hashPassword(pwd);
                        const { error } = await db.from('users').update({ password_hash }).eq('id', this.changePwdUser.id);
                        if (error) throw error;
                        this.showSuccess(`已修改用户 ${this.changePwdUser.username} 的密码`);
                        this.closeChangePwdModal();
                    } catch (e) {
                        this.showError(`修改密码失败：${e.message}`);
                    }
                },
                showMessage(type, message) {
                    if (typeof ElMessage === 'function') {
                        ElMessage({
                            type,
                            message: String(message || ''),
                            duration: 2200,
                            showClose: true
                        });
                        return;
                    }
                    alert(String(message || ''));
                },
                showError(message) {
                    this.showMessage('error', message);
                },
                showSuccess(message) {
                    this.showMessage('success', message);
                },
                failWithMessage(message) {
                    this.showError(message);
                    return null;
                },
                async confirmAction(message, title = '提示') {
                    if (!ElMessageBox || typeof ElMessageBox.confirm !== 'function') {
                        return window.confirm(String(message || title));
                    }
                    try {
                        await ElMessageBox.confirm(String(message || ''), title, {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning',
                            closeOnClickModal: false,
                            appendTo: document.body
                        });
                        return true;
                    } catch (_) {
                        return false;
                    }
                },
                async loadAccounts() {
                    if (!this.currentUser) return;
                    try {
                        const { data: areasData, error: areasError } = await db
                            .from('areas').select('*').eq('user_id', this.currentUser.id).order('sort_order');
                        if (areasError) throw areasError;
                        const { data: accountsData, error: accountsError } = await db
                            .from('accounts').select('*').eq('user_id', this.currentUser.id).order('id');
                        if (accountsError) throw accountsError;
                        const accountsByArea = {};
                        for (const account of (accountsData || [])) {
                            if (!accountsByArea[account.area_name]) accountsByArea[account.area_name] = [];
                            accountsByArea[account.area_name].push({
                                id: account.id,
                                uname: account.uname,
                                upwd: account.upwd,
                                name: account.name,
                                token: account.token,
                                time: account.time,
                                sign: account.sign,
                                uinfo: account.uinfo || '',
                                history: account.history || '',
                                app_token: account.app_token || '',
                                app_sign: account.app_sign || ''
                            });
                        }
                        this.areas = (areasData || []).map(area => ({
                            area: area.name,
                            accounts: accountsByArea[area.name] || []
                        }));
                        this.pruneStaleSelections();
                        const names = this.areas.map(g => g.area);
                        if (!this.batchPanelArea || !names.includes(this.batchPanelArea)) this.batchPanelArea = names[0] || '';
                    } catch (e) {
                        console.error('load accounts failed', e);
                        this.showError(`加载数据失败：${e.message}`);
                    }
                },
                async saveAccounts() {
                    if (!this.currentUser) return false;
                    try {
                        const userId = this.currentUser.id;
                        const { data: existingAreas } = await db.from('areas').select('name').eq('user_id', userId);
                        const { data: existingAccounts } = await db.from('accounts').select('id, area_name, uname').eq('user_id', userId);
                        const currentAreaNames = new Set(this.areas.map(g => g.area));
                        const currentAccountKeys = new Set();
                        for (const group of this.areas) for (const acc of group.accounts) currentAccountKeys.add(`${group.area}|${acc.uname}`);
                        const areasToDelete = (existingAreas || []).filter(a => !currentAreaNames.has(a.name)).map(a => a.name);
                        if (areasToDelete.length > 0) await db.from('areas').delete().eq('user_id', userId).in('name', areasToDelete);
                        for (const areaName of currentAreaNames) {
                            if (!(existingAreas || []).some(a => a.name === areaName)) await db.from('areas').insert({ name: areaName, user_id: userId, sort_order: 0 });
                        }
                        const accountsToDelete = (existingAccounts || []).filter(a => !currentAccountKeys.has(`${a.area_name}|${a.uname}`)).map(a => a.id);
                        if (accountsToDelete.length > 0) await db.from('accounts').delete().eq('user_id', userId).in('id', accountsToDelete);
                        for (const group of this.areas) {
                            for (const acc of group.accounts) {
                                const existing = (existingAccounts || []).find(a => a.area_name === group.area && a.uname === acc.uname);
                                const accountData = {
                                    area_name: group.area,
                                    uname: acc.uname,
                                    upwd: acc.upwd,
                                    name: acc.name,
                                    token: acc.token,
                                    time: acc.time,
                                    sign: acc.sign,
                                    uinfo: acc.uinfo || '',
                                    history: acc.history || '',
                                    app_token: acc.app_token || '',
                                    app_sign: acc.app_sign || ''
                                };
                                if (existing) await db.from('accounts').update(accountData).eq('id', existing.id).eq('user_id', userId);
                                else await db.from('accounts').insert({ ...accountData, user_id: userId });
                            }
                        }
                        return true;
                    } catch (e) {
                        console.error('save accounts failed', e);
                        this.showError(`保存失败：${e.message}`);
                        return false;
                    }
                },
            async onAccountCardsSorted() {
                const saved = await this.saveAccounts();
                if (!saved) {
                    await this.loadAccounts();
                    return;
                }
                this.showSuccess('排序已保存');
            },
            findAccountLocation(account) {
                for (const group of this.areas) {
                    const index = group.accounts.findIndex(item => item.uname === account.uname && item.upwd === account.upwd);
                    if (index >= 0) {
                        return { group, index };
                    }
                }
                return null;
            },
            findAccountByUname(uname) {
                for (const group of this.areas) {
                    const index = group.accounts.findIndex(item => item.uname === uname);
                    if (index >= 0) {
                        return { group, index, account: group.accounts[index] };
                    }
                }
                return null;
            },
            normalizeAreaName(area) {
                return String(area || '').trim();
            },
            ensureArea(areaName) {
                const targetArea = this.normalizeAreaName(areaName);
                if (!targetArea) return this.failWithMessage('区服不能为空');
                let group = this.areas.find(item => item.area === targetArea);
                if (!group) {
                    group = { area: targetArea, accounts: [] };
                    this.areas.push(group);
                }
                return group;
            },
            parseLoginUrlToParams(raw) {
                const s = String(raw || '').trim();
                if (!s) return { error: 'empty' };
                let u;
                try {
                    u = new URL(s);
                } catch {
                    try {
                        u = new URL(s, 'https://dldl.50pk.com');
                    } catch {
                        return { error: 'invalid' };
                    }
                }
                const q = u.searchParams;
                return {
                    token: (q.get('token') || '').trim(),
                    time: (q.get('time') || '').trim(),
                    sign: (q.get('sign') || '').trim()
                };
            },
            extractLoginParamsFromUrl() {
                const raw = this.loginUrlPaste;
                if (!String(raw || '').trim()) {
                    this.showError('请先粘贴完整登录地址');
                    return;
                }
                const parsed = this.parseLoginUrlToParams(raw);
                if (parsed.error === 'invalid') {
                    this.showError('地址格式无效，请粘贴以 http(s):// 开头的完整链接，或从 ? 开始的查询串');
                    return;
                }
                const { token, time, sign } = parsed;
                if (!token && !time && !sign) {
                    this.showError('链接中未找到 token、time、sign 参数，请确认是 login.php 带参地址');
                    return;
                }
                this.accountForm.token = token;
                this.accountForm.time = time;
                this.accountForm.sign = sign;
                if (token && time && sign) {
                    this.showSuccess('已从地址中提取 token、time、sign');
                } else {
                    const missing = [];
                    if (!token) missing.push('token');
                    if (!time) missing.push('time');
                    if (!sign) missing.push('sign');
                    this.showMessage('warning', `已填入能解析到的项，仍缺少：${missing.join('、')}，请检查链接或手动补全`);
                }
            },
            openAccountModal(account = null) {
                this.loginUrlPaste = '';
                if (account) {
                    this.accountModalMode = 'edit';
                    this.accountForm = {
                        area: this.findAccountLocation(account)?.group.area || '',
                        name: account.name || '',
                        uname: account.uname || '',
                        upwd: account.upwd || '',
                        token: account.token != null ? String(account.token) : '',
                        time: account.time != null ? String(account.time) : '',
                        sign: account.sign != null ? String(account.sign) : '',
                        uinfo: account.uinfo != null ? String(account.uinfo) : '',
                        history: account.history != null ? String(account.history) : '',
                        url: account.url != null ? String(account.url) : ''
                    };
                    this.editingAccountRef = account;
                } else {
                    this.accountModalMode = 'create';
                    this.accountForm = {
                        area: this.areas[0]?.area || '',
                        name: '',
                        uname: '',
                        upwd: '',
                        token: '',
                        time: '',
                        sign: '',
                        uinfo: '',
                        history: '',
                        url: ''
                    };
                    this.editingAccountRef = null;
                }
                this.accountModalVisible = true;
            },
            closeAccountModal() {
                this.accountModalVisible = false;
                this.loginUrlPaste = '';
                this.editingAccountRef = null;
            },
            async submitAccountModal() {
                const area = this.normalizeAreaName(this.accountForm.area);
                const name = String(this.accountForm.name || '').trim();
                const uname = String(this.accountForm.uname || '').trim();
                const upwd = String(this.accountForm.upwd || '').trim();
                const token = String(this.accountForm.token || '').trim();
                const time = String(this.accountForm.time || '').trim();
                const sign = String(this.accountForm.sign || '').trim();
                const uinfo = String(this.accountForm.uinfo || '').trim();
                const history = String(this.accountForm.history || '').trim();
                const url = String(this.accountForm.url || '').trim();
                if (!area) return this.failWithMessage('请选择或填写区服');
                if (!uname) return this.failWithMessage('请输入账号 uname');
                if (!upwd) return this.failWithMessage('请输入密码 upwd');
                const targetGroup = this.ensureArea(area);
                if (!targetGroup) return;
                if (this.accountModalMode === 'create') {
                    if (this.findAccountByUname(uname)) return this.failWithMessage('该 uname 已存在');
                    try {
                        const { data, error } = await db.from('accounts').insert({
                            user_id: this.currentUser.id, area_name: area, uname, upwd, name, token, time, sign, uinfo, history, url
                        }).select().single();
                        if (error) {
                            if (error.code === '23505') return this.failWithMessage(`区服 ${area} 下账号 ${uname} 已存在`);
                            throw error;
                        }
                        targetGroup.accounts.push({ id: data.id, name, uname, upwd, token, time, sign, uinfo, history, url });
                        this.showSuccess('账号已添加');
                    } catch (e) {
                        return this.failWithMessage(`添加失败：${e.message}`);
                    }
                } else {
                    const location = this.findAccountLocation(this.editingAccountRef || {});
                    if (!location) return this.failWithMessage('未找到要编辑的账号');
                    const target = location.group.accounts[location.index];
                    const existing = this.findAccountByUname(uname);
                    if (existing && existing.account !== target) return this.failWithMessage('该 uname 已存在');
                    try {
                        const updateData = { area_name: area, uname, upwd, name, token, time, sign, uinfo, history, url, app_token: target.app_token || '', app_sign: target.app_sign || '' };
                        const { error } = await db.from('accounts').update(updateData)
                            .eq('id', target.id).eq('user_id', this.currentUser.id);
                        if (error) {
                            if (error.code === '23505') return this.failWithMessage(`区服 ${area} 下账号 ${uname} 已存在`);
                            throw error;
                        }
                        if (location.group.area !== area) {
                            if (!this.areas.find(g => g.area === area)) {
                                await db.from('areas').insert({ name: area, user_id: this.currentUser.id, sort_order: 999 });
                            }
                            location.group.accounts.splice(location.index, 1);
                            targetGroup.accounts.push(target);
                        }
                        target.name = name;
                        target.uname = uname;
                        target.upwd = upwd;
                        target.token = token;
                        target.time = time;
                        target.sign = sign;
                        target.uinfo = uinfo;
                        target.history = history;
                        target.url = url;
                        this.showSuccess('账号已更新');
                    } catch (e) {
                        return this.failWithMessage(`保存失败：${e.message}`);
                    }
                }
                this.closeAccountModal();
            },
            editAccount(account) {
                this.openAccountModal(account);
            },
            async deleteEditingAccount() {
                try {
                    if (this.accountModalMode !== 'edit' || !this.editingAccountRef) {
                        this.showError('未找到要删除的账号');
                        return;
                    }
                    const location = this.findAccountLocation(this.editingAccountRef);
                    if (!location) {
                        this.showError('未找到要删除的账号');
                        return;
                    }
                    const target = location.group.accounts[location.index];
                    const confirmed = await this.confirmAction(`确认删除账号 ${target.uname} 吗？该操作不可恢复。`, '删除账号');
                    if (!confirmed) return;
                    const { error } = await db.from('accounts').delete()
                        .eq('id', target.id).eq('user_id', this.currentUser.id);
                    if (error) throw error;
                    location.group.accounts.splice(location.index, 1);
                    if (!location.group.accounts.length) {
                        this.areas = this.areas.filter(item => item.area !== location.group.area);
                    }
                    this.showSuccess('账号已删除');
                    this.closeAccountModal();
                } catch (e) {
                    this.showError(`删除账号失败：${e?.message || e}`);
                }
            },
            async deleteArea(group) {
                try {
                    const areaName = this.normalizeAreaName(group?.area);
                    if (!areaName) {
                        this.showError('区服名称无效');
                        return;
                    }
                    const target = this.areas.find(item => item.area === areaName);
                    if (!target) {
                        this.showError('未找到要删除的区服');
                        return;
                    }
                    const confirmed = await this.confirmAction(`确认删除区服 ${areaName} 吗？将同时删除该区服下 ${target.accounts.length} 个账号，且不可恢复。`, '删除区服');
                    if (!confirmed) return;
                    await db.from('accounts').delete().eq('user_id', this.currentUser.id).eq('area_name', areaName);
                    await db.from('areas').delete().eq('user_id', this.currentUser.id).eq('name', areaName);
                    this.areas = this.areas.filter(item => item.area !== areaName);
                    if (this.accountModalVisible && this.accountModalMode === 'edit') {
                        const editingArea = this.findAccountLocation(this.editingAccountRef || {})?.group?.area;
                        if (editingArea === areaName) {
                            this.closeAccountModal();
                        }
                    }
                    this.showSuccess(`已删除区服 ${areaName}`);
                } catch (e) {
                    this.showError(`删除区服失败：${e?.message || e}`);
                }
            },
                async persistToken(account, tokenInfo) {
                    if (!account || !account.id || !this.currentUser) {
                        this.showError('无法保存 token：缺少账号 ID 或未登录');
                        return false;
                    }
                    const location = this.findAccountLocation(account);
                    const target = location ? location.group.accounts[location.index] : account;
                    target.token = String(tokenInfo.token || '');
                    target.time = String(tokenInfo.time || '');
                    target.sign = String(tokenInfo.sign || '');
                    try {
                        const { error } = await db.from('accounts')
                            .update({
                                token: target.token,
                                time: target.time,
                                sign: target.sign
                            })
                            .eq('id', account.id)
                            .eq('user_id', this.currentUser.id);
                        if (error) throw error;
                        return true;
                    } catch (e) {
                        console.error('save token failed', e);
                        this.showError(`token 已获取，但写回 Supabase 失败：${e?.message || e}`);
                        return false;
                    }
                },
                /** 扫码页（login.php）内刷新 token 后，通过 postMessage 回写 Supabase */
                async handleTokenRefreshedFromLoginPage(payload) {
                    let account = null;
                    const accountId = payload && payload.accountId;
                    if (accountId != null && accountId !== '') {
                        for (const group of this.areas) {
                            account = group.accounts.find((a) => String(a.id) === String(accountId));
                            if (account) break;
                        }
                    }
                    if (!account && payload && payload.uname) {
                        const found = this.findAccountByUname(payload.uname);
                        account = found && found.account;
                    }
                    if (!account) {
                        console.warn('login page token refresh: account not found', payload);

                        const u = new URL(url);
                        u.searchParams.set(callbackParam, cbName);

                        let done = false;
                        const cleanup = () => {
                            if (script && script.parentNode) script.parentNode.removeChild(script);
                            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
                        };

                        const timer = setTimeout(() => {
                            if (done) return;
                            done = true;
                            cleanup();
                            reject(new Error("jsonp timeout"));
                        }, timeoutMs);

                        window[cbName] = (payload) => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(payload);
                        };

                        const script = document.createElement("script");
                        script.src = u.toString();
                        script.onerror = () => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            reject(new Error("jsonp network error"));
                        };
                        document.head.appendChild(script);

                            try {
                                const bodyText = await resp.text();
                                if (bodyText) {
                                    const json = JSON.parse(bodyText);
                                    // code !== 0 表示失败（37 系 API 中 code: 0 = 成功）
                                    if (json && json.code !== undefined && json.code !== 0) {
                                        tokenValid = false;
                                    }
                                    // 服务端明确返回 token 为空字符串，说明 token 已失效
                                    if (json && json.hasOwnProperty('token') && json.token === '') {
                                        tokenValid = false;
                                    }
                                }
                            } catch (_) {
                                // 响应不是 JSON 或为空，忽略
                            }
                            if (tokenValid) {
                                this._setPassCodeState(area, account, { status: 'ok' });
                                this.showSuccess('通行证已发送');
                            } else {
                                this._setPassCodeState(area, account, { status: 'expired' });
                                this.showError('通行证已发送，但 token 已失效，请刷新 token');
                            }
                        } else {
                            throw new Error('HTTP ' + resp.status);
                        }
                    } catch (e) {
                        console.error('sendPassCode failed', e);
                        this._setPassCodeState(area, account, { status: 'fail' });
                        this.showError('通行证发送失败：' + (e?.message || e));
                    }
                },
                // --- 通行证登录 end ---
                async refreshToken(account) {
                    const uname = String(account && account.uname || '').trim();
                    const upwd = String(account && account.upwd || '').trim();
                    if (!uname || !upwd) {
                        this.showError('刷新 token 需要账号与密码');
                        return;
                    }
                    this.loadingText = `正在通过 APP SDK 刷新 ${uname} 的 token...`;
                    this.loadingVisible = true;
                    try {
                        const resp = await fetch('/api/app-login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ uname, upwd })
                        });
                        const result = await resp.json();
                        if (!result.ok || result.state !== 1) {
                            throw new Error(result.msg || result.message || 'APP 登录刷新失败');
                        }
                        const url = this.buildAppLoginUrl(result, account);
                        const appToken = String(result.token || '');
                        const appSign = String(result.sign || '');
                        // 同步更新本地 account 对象
                        account.app_token = appToken;
                        account.app_sign = appSign;
                        account.url = url;
                        if (this.currentUser && account.id != null) {
                            const { error: updateErr } = await db.from('accounts')
                                .update({ url, app_token: appToken, app_sign: appSign })
                                .eq('id', account.id)
                                .eq('user_id', this.currentUser.id);
                            if (updateErr) throw updateErr;
                        }
                        this.showSuccess(`已通过 APP SDK 刷新并保存 ${uname} 的凭据`);
                    } catch (e) {
                        console.error("refreshToken failed", e);
                        this.showError(`刷新 token 失败：${e?.message || e}`);
                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                },
                /** 代理IP相关方法 */
                loadProxyConfig() {
                    try {
                        this.useProxy = localStorage.getItem('dldl_useProxy') === 'true';
                        const savedUrl = localStorage.getItem('dldl_proxyWorkerUrl');
                        // 如果没有保存过 URL，或保存的是空值，使用默认值
                        if (!savedUrl || savedUrl.trim() === '') {
                            this.proxyWorkerUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                            localStorage.setItem('dldl_proxyWorkerUrl', this.proxyWorkerUrl);
                        } else {
                            this.proxyWorkerUrl = savedUrl;
                        }
                        if (this.useProxy && this.proxyWorkerUrl) {
                            this.proxyIP = '代理中';
                        }
                    } catch (e) {
                        console.error('loadProxyConfig failed', e);
                        this.proxyWorkerUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                    }
                },
                fixAndLoadProxyConfig() {
                    const defaultUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                    try {
                        // 强制修复：如果 URL 为空，设置默认值
                        const savedUrl = localStorage.getItem('dldl_proxyWorkerUrl');
                        if (!savedUrl || savedUrl.trim() === '') {
                            localStorage.setItem('dldl_proxyWorkerUrl', defaultUrl);
                        }
                        this.loadProxyConfig();
                    } catch (e) {
                        console.error('fixAndLoadProxyConfig failed', e);
                        this.proxyWorkerUrl = defaultUrl;
                    }
                },
                saveProxyConfig() {
                    try {
                        localStorage.setItem('dldl_useProxy', String(this.useProxy));
                        localStorage.setItem('dldl_proxyWorkerUrl', this.proxyWorkerUrl);
                    } catch (e) {
                        console.error('saveProxyConfig failed', e);
                    }
                },
                async toggleProxyAndRefreshIP() {
                    this.proxyIP = '切换中...';
                    
                    if (!this.useProxy) {
                        // 首次点击，启用代理
                        this.useProxy = true;
                    }
                    
                    try {
                        // 统一切换入口：后端优先 GH-Relay，兜底代理池
                        // 客户端 50 秒超时（后端 45 秒，留余量）
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 50000);
                        const switchResp = await fetch('/proxy-pool/switch', {
                            method: 'POST',
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        const switchData = await switchResp.json();
                        
                        if (!switchData.ok) {
                            throw new Error(switchData.message || '切换失败');
                        }
                        
                        // 根据来源显示不同信息
                        if (switchData.source === 'gh-relay') {
                            // GitHub Actions relay：显示 Azure runner 的真实出口 IP
                            const switchedText = switchData.switched ? '已切换' : '最新';
                            const timeAgo = this._formatTimeAgo(switchData.updatedAt);
                            this.proxyIP = `Azure IP: ${switchData.ip} (${switchedText}, ${timeAgo})`;
                            this.saveProxyConfig();
                            this.showSuccess(`${switchedText} IP: ${switchData.ip}`);
                        } else if (switchData.source === 'proxy-pool') {
                            // 免费代理池
                            const newProxy = switchData.currentProxy;
                            if (newProxy) {
                                this.proxyIP = `代理: ${newProxy}`;
                                this.showSuccess(`已切换代理: ${newProxy}`);
                            } else {
                                this.proxyIP = '代理: 无可用（走直连）';
                                this.showSuccess('无可用代理，当前走直连');
                            }
                            this.saveProxyConfig();
                        } else {
                            // 直连
                            this.proxyIP = '直连 (无可用代理)';
                            this.saveProxyConfig();
                            this.showSuccess(switchData.message || '当前走直连');
                        }
                    } catch (e) {
                        console.error('toggleProxyAndRefreshIP failed', e);
                        this.proxyIP = '切换失败（走直连）';
                        const errMsg = e.name === 'AbortError' ? '切换IP超时' : (e?.message || e);
                        this.showError(`切换IP失败：${errMsg}`);
                    }
                },

                /** 格式化时间差为 "x秒前/x分钟前" */
                _formatTimeAgo(isoString) {
                    if (!isoString) return '';
                    const diff = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
                    if (diff < 60) return diff + '秒前';
                    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
                    return Math.floor(diff / 3600) + '小时前';
                },
                
                // 获取当前代理IP
                async getProxyIP() {
                    try {
                        const timestamp = Date.now();
                        const response = await fetch(`${this.proxyWorkerUrl}/get-ip?t=${timestamp}`);
                        const data = await response.json();
                        return data.ip;
                    } catch (e) {
                        console.error('getProxyIP failed, trying fallback', e);
                        // 备用方案：直接调用 ipify API
                        try {
                            const timestamp = Date.now();
                            const fallbackResponse = await fetch(`https://api.ipify.org?format=json&t=${timestamp}`);
                            const fallbackData = await fallbackResponse.json();
                            return fallbackData.ip;
                        } catch (fallbackError) {
                            console.error('Fallback getIP failed', fallbackError);
                            return null;
                        }
                    }
                },

            }
        });
        app.directive('account-cards-sortable', accountCardsSortableDirective);
        app.use(ElementPlus);
        app.mount("#app");
    </script>
