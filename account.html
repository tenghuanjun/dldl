<html>
    
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>账号列表页</title>
        <script src="vue.global.js"></script>
        <link rel="stylesheet" href="lib/element-plus.css" />
    <script src="lib/element-plus.min.js"></script>
    <script src="lib/Sortable.min.js"></script>
    <script src="lib/supabase.min.js"></script>
    <script src="lib/crypto-js.js"></script>
</head>

<body>
    <div id="app" class="container">
        <div v-if="!isLoggedIn" class="login-container">
            <div class="login-box">
                <h2 class="login-title">用户登录</h2>
                <div class="login-form">
                    <div class="login-field">
                        <label class="login-label">用户名</label>
                        <input class="login-input" v-model="loginForm.username" placeholder="请输入用户名" @keyup.enter="handleLogin">
                    </div>
                    <div class="login-field">
                        <label class="login-label">密码</label>
                        <input class="login-input" type="password" v-model="loginForm.password" placeholder="请输入密码" @keyup.enter="handleLogin">
                    </div>
                    <div class="login-actions">
                        <button class="btn login-btn" type="button" @click="handleLogin" :disabled="loginLoading" :class="{ 'btn-loading': loginLoading }">{{ loginLoading ? '登录中...' : '登录' }}</button>
                        <button class="btn btn-secondary login-btn" type="button" @click="handleRegister" :disabled="loginLoading" :class="{ 'btn-loading': loginLoading }">{{ loginLoading ? '注册中...' : '注册' }}</button>
                    </div>
                    <div v-if="loginError" class="login-error">{{ loginError }}</div>
                </div>
            </div>
        </div>
        <template v-if="isLoggedIn">
        <header class="account-controls-sticky">
            <div class="sticky-row sticky-row-top">
                <div class="user-info">
                    <span class="username">{{ currentUser?.username }}</span>
                    <span class="user-plan" :class="currentPlan.cls" v-if="currentPlan.text">{{ currentPlan.text }}</span>
                    <button v-if="isAdmin" class="btn btn-secondary btn-compact" type="button" @click="openUserManageModal">用户管理</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="handleLogout">退出</button>
                </div>
                <div class="sticky-tools">
                    <select v-model="urlFilter" class="url-filter-select">
                        <option value="all">全部</option>
                        <option value="valid">地址有效</option>
                        <option value="expired">地址过期</option>
                        <option value="none">无地址</option>
                    </select>
                    <button class="btn btn-secondary btn-compact" type="button" @click="refreshAccounts" :disabled="accountsRefreshing">{{ accountsRefreshing ? '刷新中...' : '刷新列表' }}</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="openAccountModal()">新增</button>
                    <button class="btn btn-secondary btn-compact" type="button" @click="showPwd = !showPwd">{{ showPwd ? '隐藏密码' : '显示密码' }}</button>
                    <button
                        class="btn btn-compact"
                        type="button"
                        :disabled="selectedAccountCount === 0"
                        @click="batchLaunchSelected"
                    >批量启动（{{ selectedAccountCount }}）</button>
                    <button
                        class="btn btn-compact"
                        type="button"
                        :disabled="selectedAccountCount === 0"
                        @click="openBatchPassCode"
                    >批量填通行证（{{ selectedAccountCount }}）</button>
                    <!-- 代理IP 按钮已禁用：免费代理池源站失效 + GH-Relay 未持续运行 + Worker Relay 可能闲置被回收，
                         三层代理链均不可用，useProxy=true 反而会导致 h5sdk/login 请求转发到死 Worker 而失败。
                         如将来修复代理链，取消注释 <button> 即可恢复。 -->
                    <!-- <button class="btn btn-compact" :class="useProxy ? 'btn-proxy-active' : 'btn-secondary'" type="button" @click="toggleProxyAndRefreshIP">代理IP 已停用</button> -->
                    <button class="btn btn-secondary btn-compact" type="button" @click="openAreaSortModal">区服排序</button>
                    <button class="btn btn-compact" :class="syncRunning ? 'btn-danger' : 'btn-secondary'" type="button" @click="openSyncModal">{{ syncRunning ? '同步中■' : '窗口同步' }}</button>
                </div>
            </div>
            <div class="sticky-row sticky-row-batch">
                <span class="batch-row-head">
                    同区批次
                    <span class="batch-info-icon" title="按该区下列表顺序分批启动，与下方勾选无关">ⓘ</span>
                </span>
                <el-select
                    v-model="batchPanelArea"
                    class="batch-area-select batch-select-ep"
                    size="default"
                    filterable
                    clearable
                    placeholder="区服"
                >
                    <el-option
                        v-for="g in areas"
                        :key="'batch-opt-' + g.area"
                        :label="g.area"
                        :value="g.area"
                    />
                </el-select>
                <label class="batch-inline-label">每批</label>
                <input
                    v-model.number="batchPanelSize"
                    type="number"
                    min="1"
                    step="1"
                    class="form-input batch-num-input"
                >
                <label class="batch-inline-label">第</label>
                <input
                    v-model.number="batchPanelBatchNo"
                    type="number"
                    min="1"
                    step="1"
                    class="form-input batch-num-input"
                >
                <label class="batch-inline-label">批</label>
                <button class="btn btn-compact" type="button" @click="batchLaunchByAreaSlice">启动该批</button>
                <button class="btn btn-compact" type="button" @click="resetAccountState" title="清除所有勾选和已填的通行证码">重置</button>
                <span class="batch-search-sep"></span>
                <input
                    v-model="searchKeyword"
                    type="text"
                    class="form-input search-input"
                    placeholder="昵称搜索"
                >
                <button v-if="searchMode" class="btn btn-compact btn-clear-search" type="button" @click="clearSearch">退出搜索</button>
            </div>
        </header>

        <template v-if="!searchMode"><section class="area" v-for="group in visibleAreas" :key="group.area">
            <div class="area-head">
                <div class="area-title">{{ group.area }}</div>
                <div class="area-sub">
                    {{ filteredAccounts(group).length }} 个账号
                    <button type="button" class="btn-link" @click="selectAllInArea(group, true)">全选</button>
                    <button type="button" class="btn-link" @click="selectAllInArea(group, false)">取消全选</button>
                    <button class="btn btn-mini btn-sort-highlight" type="button" @click="openAccountSortModal(group)">账号排序</button>
                    <button class="btn btn-danger btn-mini" type="button" @click="deleteArea(group)">删除区服</button>
                </div>
            </div>

            <div class="cards" v-account-cards-sortable="group">
                <div class="card sortable-account-card" :class="{ 'card-launched': getAppLoginStatus(group.area, account) === 'launched', 'card-selected': isAccountSelected(group.area, account) }" v-for="(account, idx) in filteredAccounts(group)" :key="`${group.area}-${account.uname}`" @click="toggleAccountSelection(group.area, account)">
                    <label class="card-check-wrap" @mousedown.stop @click.stop>
                        <input
                            type="checkbox"
                            :checked="isAccountSelected(group.area, account)"
                            @change="onAccountCheckboxChange($event, group.area, account)"
                        >
                    </label>
                    <button type="button" class="card-drag-handle" aria-label="拖拽排序" title="拖拽排序" @click.stop @mousedown.stop>⋮⋮</button>
                    <div class="card-main">
                        <div class="card-top">
                            <div class="card-name">
                                <div class="nick white-space-nowrap"><span class="card-index">{{ idx + 1 }}</span>{{ account.name || '-' }}</div>
                                <div class="uname white-space-nowrap" v-if="showPwd">{{ account.uname }}</div>
                                <div class="uname white-space-nowrap" v-if="showPwd">{{ account.upwd }}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-secondary" type="button" @click.stop="editAccount(account)">编辑</button>
                                <button class="btn btn-secondary" type="button" @click.stop="refreshToken(account)">刷新APPtoken</button>
                                <button class="btn btn-secondary" type="button" @click.stop="copyLoginUrl(account)">复制网址</button>
                                <button class="btn" type="button" @click.stop="appLogin(group.area, account)">APP登录</button>
                                <span v-if="getAppLoginStatus(group.area, account) === 'launched'" class="pass-code-status ok">已启动</span>
                                <!-- <button class="btn" type="button" @click="openLogin(account)">网页登录</button> -->
                                <!-- <button class="btn btn-secondary" type="button" @click="openQuickLogin(group.area, account)">快捷登录</button> -->
                            </div>
                            <div class="card-pass-row">
                                <div class="pass-code-input-wrap">
                                    <input
                                        ref="passCodeInputs"
                                        class="pass-code-input"
                                        type="text"
                                        placeholder="通行证码"
                                        :value="getPassCodeValue(group.area, account)"
                                        @click.stop @mousedown.stop
                                        @input="onPassCodeInput($event, group.area, account)"
                                        @blur="onPassCodeBlur($event, group.area, account)"
                                        @keyup.enter="($event) => { $event.target.blur(); }"
                                    >
                                    <button
                                        v-if="getPassCodeValue(group.area, account)"
                                        class="pass-code-clear"
                                        type="button"
                                        tabindex="-1"
                                        title="清除"
                                        @click.stop @mousedown.prevent="clearPassCode(group.area, account)"
                                    >✕</button>
                                </div>
                                <span v-if="isPassCodeSending(group.area, account)" class="pass-code-status sending">发送中…</span>
                                <span v-else-if="getPassCodeStatus(group.area, account) === 'ok'" class="pass-code-status ok">已发送 ✓</span>
                                <span v-else-if="getPassCodeStatus(group.area, account) === 'expired'" class="pass-code-status expired">已失效</span>
                                <span v-else-if="getPassCodeStatus(group.area, account) === 'fail'" class="pass-code-status fail">失败</span>
                            </div>
                        </div>
                    </div>
                    <span v-if="account.url && getUrlRemaining(account)" class="card-url-age" :class="urlRemainingState(account)">{{ getUrlRemaining(account) }}</span>
                    <span
                        class="card-url-dot"
                        :class="(account.url && String(account.url).trim()) ? 'has-url' : 'no-url'"
                        :title="(account.url && String(account.url).trim()) ? '有URL' : '无URL'"
                    ></span>
                </div>
            </div>
        </section>
        </template>

        <section v-else class="search-section">
            <div class="area-head">
                <div class="area-title">搜索结果：{{ searchKeyword }}（{{ searchResults.length }} 个账号）</div>
                <div class="area-sub">
                    <button type="button" class="btn-link" @click="selectAllSearch(true)">全选</button>
                    <button type="button" class="btn-link" @click="selectAllSearch(false)">取消全选</button>
                    <button class="btn btn-secondary btn-mini" type="button" @click="clearSearch">退出搜索</button>
                </div>
            </div>

            <div class="cards">
                <div class="card sortable-account-card" :class="{ 'card-launched': getAppLoginStatus(item.area, item.account) === 'launched', 'card-selected': isAccountSelected(item.area, item.account) }" v-for="(item, idx) in searchResults" :key="item.area + '-' + item.account.uname" @click="toggleAccountSelection(item.area, item.account)">
                    <label class="card-check-wrap" @mousedown.stop @click.stop>
                        <input
                            type="checkbox"
                            :checked="isAccountSelected(item.area, item.account)"
                            @change="onAccountCheckboxChange($event, item.area, item.account)"
                        >
                    </label>
                    <div class="card-main">
                        <div class="card-top">
                            <div class="card-name">
                                <div class="nick white-space-nowrap"><span class="card-index">{{ idx + 1 }}</span>{{ item.account.name || '-' }}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-secondary" type="button" @click.stop="editAccount(item.account)">编辑</button>
                                <button class="btn btn-secondary" type="button" @click.stop="refreshToken(item.account)">刷新APPtoken</button>
                                <button class="btn btn-secondary" type="button" @click.stop="copyLoginUrl(item.account)">复制网址</button>
                                <button class="btn" type="button" @click.stop="appLogin(item.area, item.account)">APP登录</button>
                                <span v-if="getAppLoginStatus(item.area, item.account) === 'launched'" class="pass-code-status ok">已启动</span>
                            </div>
                            <div class="card-pass-row">
                                <div class="pass-code-input-wrap">
                                    <input
                                        ref="passCodeInputs"
                                        class="pass-code-input"
                                        type="text"
                                        placeholder="通行证码"
                                        :value="getPassCodeValue(item.area, item.account)"
                                        @click.stop @mousedown.stop
                                        @input="onPassCodeInput($event, item.area, item.account)"
                                        @blur="onPassCodeBlur($event, item.area, item.account)"
                                        @keyup.enter="($event) => { $event.target.blur(); }"
                                    >
                                    <button
                                        v-if="getPassCodeValue(item.area, item.account)"
                                        class="pass-code-clear"
                                        type="button"
                                        tabindex="-1"
                                        title="清除"
                                        @click.stop @mousedown.prevent="clearPassCode(item.area, item.account)"
                                    >✕</button>
                                </div>
                                <span v-if="isPassCodeSending(item.area, item.account)" class="pass-code-status sending">发送中…</span>
                                <span v-else-if="getPassCodeStatus(item.area, item.account) === 'ok'" class="pass-code-status ok">已发送 ✓</span>
                                <span v-else-if="getPassCodeStatus(item.area, item.account) === 'expired'" class="pass-code-status expired">已失效</span>
                                <span v-else-if="getPassCodeStatus(item.area, item.account) === 'fail'" class="pass-code-status fail">失败</span>
                            </div>
                        </div>
                    </div>
                    <span v-if="item.account.url && getUrlRemaining(item.account)" class="card-url-age" :class="urlRemainingState(item.account)">{{ getUrlRemaining(item.account) }}</span>
                    <span
                        class="card-url-dot"
                        :class="(item.account.url && String(item.account.url).trim()) ? 'has-url' : 'no-url'"
                        :title="(item.account.url && String(item.account.url).trim()) ? '有URL' : '无URL'"
                    ></span>
                </div>
            </div>
        </section>

        <!-- <div class="tip">同一区服下可按住左侧「⋮⋮」拖拽卡片调整账号顺序，松手后自动保存到数据库。勾选卡片左侧复选框后点「批量启动」会按 APP 登录方式依次打开窗口（可跨多个区服，只启动已勾选的账号）。「同区服按批次启动」用于同一区内按每批人数、第几批切片启动，与勾选无关。单个账号点击「APP登录」按钮。</div>
        <div class="tip tip-secondary">点击「打开扫码页」会经本地代理打开 login.php：若当前账号已缓存 token，则直接使用；仅在没有 token 时会请求 h5sdk/login 并写入 Supabase。账号页或扫码页内「刷新 token」成功后，会将新 token/time/sign 更新到 Supabase 对应账号行（按 id 匹配）。</div>
        <div class="tip tip-secondary">「快捷登录」携带该账号的 uname、upwd、uinfo 打开新窗口，在 <code>37.com.cn/h5game/public/?pid=46&amp;gid=1005176</code> 注入 UINFO/HISTORY cookie 完成登录。无 uinfo 时按 uname/upwd 自动生成。需使用 DLDL-Proxy 桌面客户端。</div>
        <div class="tip tip-secondary">「代理IP」使用 GitHub Actions Runner 的 Azure IP 轮换：点击按钮查看当前可用 IP。每个账号的「刷新 token」优先使用 Actions 缓存的 token（5 分钟内有效），缓存未命中时走代理池直连。如需强制从全新 IP 获取 token，请在项目目录启动 proxy 后调用 <code>POST /gh-relay/request-token</code>（最多等待 2 分钟，Actions 定时任务每 5 分钟执行一次）。</div> -->

        <div v-if="accountModalVisible" class="modal-mask" @click.self="closeAccountModal()">
            <div class="modal">
                <div class="modal-title">{{ accountModalMode === 'create' ? '新增账号' : '编辑账号' }}</div>
                <div class="modal-actions modal-actions-top">
                    <button v-if="accountModalMode === 'edit'" class="btn btn-danger" type="button" @click="deleteEditingAccount()">删除账号</button>
                    <button class="btn btn-secondary" type="button" @click="closeAccountModal()">取消</button>
                    <button class="btn" type="button" @click="submitAccountModal()">保存</button>
                </div>
                <div class="form-grid">
                    <div class="form-field full">
                        <label class="form-label">区服</label>
                        <el-select
                            v-model="accountForm.area"
                            class="area-select"
                            filterable
                            allow-create
                            default-first-option
                            clearable
                            placeholder="搜索或选择区服，也可输入新名称后回车创建"
                        >
                            <el-option
                                v-for="group in areas"
                                :key="group.area"
                                :label="group.area"
                                :value="group.area"
                            />
                        </el-select>
                    </div>
                    <div class="form-field">
                        <label class="form-label">平台</label>
                        <el-select v-model="accountForm.platform" class="platform-select">
                            <el-option label="37系（原斗罗）" value="37"></el-option>
                            <el-option label="28手游" value="28"></el-option>
                        </el-select>
                    </div>
                    <div class="form-field">
                        <label class="form-label">昵称 name</label>
                        <input class="form-input" v-model="accountForm.name" placeholder="请输入昵称">
                    </div>
                    <div class="form-field">
                        <label class="form-label">账号 uname</label>
                        <input class="form-input" v-model="accountForm.uname" placeholder="请输入账号">
                    </div>
                    <div class="form-field full">
                        <label class="form-label">密码 upwd</label>
                        <input class="form-input" v-model="accountForm.upwd" placeholder="请输入密码">
                    </div>
                    <div class="form-field full form-section-label">快捷登录 Cookie</div>
                    <div class="form-field full">
                        <label class="form-label">uinfo</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.uinfo" rows="2" placeholder="可选；快捷登录优先使用该值注入 UINFO，留空则按 uname/upwd 自动生成"></textarea>
                    </div>
                    <div class="form-field full">
                        <label class="form-label">history</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.history" rows="2" placeholder='可选；建议为 JSON 数组，如 [{"uname":"xxx","upwd":"yyy"}]'></textarea>
                    </div>
                    <div class="form-field full form-section-label">扫码登录 token</div>
                    <div class="form-field full">
                        <label class="form-label">完整登录地址</label>
                        <div class="url-extract-row">
                            <textarea
                                v-model="loginUrlPaste"
                                class="form-input form-textarea url-paste-input"
                                rows="2"
                                placeholder="粘贴浏览器地址栏中的 login.php?... 整段链接，点击右侧「提取」自动填入下方三项"
                            ></textarea>
                            <button type="button" class="btn url-extract-btn" @click="extractLoginParamsFromUrl">提取</button>
                        </div>
                    </div>
                    <div class="form-field full">
                        <label class="form-label">token</label>
                        <textarea class="form-input form-textarea form-mono" v-model="accountForm.token" rows="3" placeholder="可选；留空则打开扫码页时会自动拉取"></textarea>
                    </div>
                    <div class="form-field">
                        <label class="form-label">time</label>
                        <input class="form-input" v-model="accountForm.time" placeholder="可选，与 sign 配套">
                    </div>
                    <div class="form-field">
                        <label class="form-label">sign</label>
                        <input class="form-input form-mono" v-model="accountForm.sign" placeholder="可选，与 time 配套">
                    </div>
                    <div class="form-field full form-section-label">APP登录地址</div>
                    <div class="form-field full">
                        <label class="form-label">url</label>
                        <div class="pass-code-input-wrap">
                            <textarea
                                class="form-input form-textarea form-mono"
                                v-model="accountForm.url"
                                rows="2"
                                placeholder="点击「APP登录」后自动生成，可手动编辑"
                            ></textarea>
                            <button
                                v-if="accountForm.url"
                                class="pass-code-clear"
                                type="button"
                                tabindex="-1"
                                title="清除"
                                @mousedown.prevent="accountForm.url = ''"
                            >✕</button>
                        </div>
                    </div>
                </div>
                <div class="form-help">保存后会写入数据库，新增账号会自动创建对应区服分组。可将完整 login.php 链接粘贴到上方并点「提取」，或手动填写 token / time / sign，或通过「刷新 token」写入。</div>
                <div class="modal-actions">
                    <button v-if="accountModalMode === 'edit'" class="btn btn-danger" type="button" @click="deleteEditingAccount()">删除账号</button>
                    <button class="btn btn-secondary" type="button" @click="closeAccountModal()">取消</button>
                    <button class="btn" type="button" @click="submitAccountModal()">保存</button>
                </div>
            </div>
        </div>

        <div v-if="areaSortModalVisible" class="modal-mask" @click.self="closeAreaSortModal">
            <div class="modal">
                <div class="modal-title">区服排序</div>
                <div class="area-sort-tip">拖拽下方区服调整顺序，松手后自动保存</div>
                <div class="area-sort-list" ref="areaSortList">
                    <div class="area-sort-item" v-for="group in areaSortList" :key="group.area" :data-area="group.area">
                        <span class="area-sort-handle">⋮⋮</span>
                        <span class="area-sort-name">{{ group.area }}</span>
                        <span class="area-sort-count">{{ group.accounts.length }} 个账号</span>
                    </div>
                </div>
                    <div class="modal-actions">
                    <button class="btn btn-secondary" type="button" @click="closeAreaSortModal">关闭</button>
                </div>
            </div>
        </div>

        <div v-if="accountSortModalVisible" class="modal-mask" @click.self="closeAccountSortModal">
            <div class="modal">
                <div class="modal-title">账号排序 - {{ accountSortArea }}</div>
                <div class="account-sort-tip">拖拽下方账号调整顺序，完成后点击「保存」统一写入（仅显示昵称）</div>
                <div class="account-sort-list" ref="accountSortList">
                    <div class="account-sort-item" v-for="account in accountSortList" :key="account.id" :data-id="account.id">
                        <span class="account-sort-handle">⋮⋮</span>
                        <span class="account-sort-name">{{ account.name || account.uname || '-' }}</span>
                    </div>
                </div>
                <div class="modal-actions">

        function destroyAccountCardsSortable(el) {
            if (el._accountCardsSortable) {
                el._accountCardsSortable.destroy();
                el._accountCardsSortable = null;
            }
        }

        const accountCardsSortableDirective = {
            mounted(el, binding) {
                el._sortableGroupRef = binding.value;
                const SortableCtor = window.Sortable;
                if (typeof SortableCtor !== 'function' || !binding.value || !Array.isArray(binding.value.accounts)) {
                    return;
                }
                el._accountCardsSortable = SortableCtor.create(el, {
                    animation: 150,
                    handle: '.card-drag-handle',
                    draggable: '.sortable-account-card',
                    ghostClass: 'card-sortable-ghost',
                    chosenClass: 'card-sortable-chosen',
                    dragClass: 'card-sortable-drag',
                    forceFallback: true,
                    fallbackTolerance: 3,
                    fallbackOnBody: true,
                    // .cards 是 4 列 CSS Grid，会被 Sortable 误判为“纯横向”，导致跨行/跨列交换很难触发。
                    // 降低交换阈值 + 启用反向交换区，使二维网格里的拖拽排序灵敏可用。
                    swapThreshold: 0.65,
                    invertSwap: true,
                    onEnd(evt) {
                        const g = el._sortableGroupRef;
                        if (!g || !Array.isArray(g.accounts)) return;
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        if (oldIndex === newIndex || oldIndex == null || newIndex == null) return;
                        const list = g.accounts;
                        const moved = list.splice(oldIndex, 1)[0];
                        list.splice(newIndex, 0, moved);
                        const vm = binding.instance;
                        if (vm && typeof vm.onAccountCardsSorted === 'function') {
                            void vm.onAccountCardsSorted(g.area);
                        }
                    }
                });
            },
            updated(el, binding) {
                el._sortableGroupRef = binding.value;
            },
            unmounted(el) {
                destroyAccountCardsSortable(el);
            }
        };

            const code = String(plain);
            if (!code) return '';
            let c = String.fromCharCode(code.charCodeAt(0) + code.length);
            for (let i = 1; i < code.length; i++) {
                c += String.fromCharCode(code.charCodeAt(i) + code.charCodeAt(i - 1));

            return encodeURIComponent(c);

                    return out;
                },
                isAdmin() {
                    return this.currentUser?.username === 'tenghuanjun';
                },
                /** 当前登录用户的套餐摘要：用于 header 醒目展示到期时间 */
                currentPlan() {
                    const u = this.currentUser;
                    if (!u) return { text: '', cls: '' };
                    if (!u.plan_type) return { text: '未开通套餐', cls: 'plan-none' };
                    if (u.plan_type === 'permanent') return { text: '永久卡', cls: 'plan-active' };
                    const end = u.plan_expire_at ? new Date(u.plan_expire_at) : null;
                    if (!end || isNaN(end.getTime())) return { text: this.planTypeName(u.plan_type), cls: 'plan-active' };
                    const now = new Date();
                    const days = Math.ceil((end - now) / 86400000);
                    const endStr = this.fmtFullDate(u.plan_expire_at);
                    if (end <= now) return { text: `已过期 ${endStr}`, cls: 'plan-expired' };
                    return { text: `剩${days}天 · 到期${endStr}`, cls: 'plan-active' };
                }
            },
            mounted() {
                this.checkLoginState();
                this.fixAndLoadProxyConfig();
                // 已登录则立即校验一次，并每小时检测：账号被禁用或套餐过期时自动退出
                if (this.isLoggedIn) this.checkAccountStatus();
                // 静默后台校验：每 5 分钟检测一次账号禁用/套餐过期（前端无感知，仅异常时弹出退出提示）
                this._statusTimer = setInterval(() => { this.checkAccountStatus(); }, 300000);
                this._onLoginPageTokenMessage = (event) => {
                    if (event.origin !== window.location.origin) return;
                    const payload = event.data;
                    if (!payload || payload.type !== 'dldl_token_refreshed') return;
                    void this.handleTokenRefreshedFromLoginPage(payload);
                };
                window.addEventListener('message', this._onLoginPageTokenMessage);
                // 监听同步引擎主动上报（如 F10 强制停止），保持 UI 状态一致
                if (window.__ELECTRON__ && typeof window.__ELECTRON__.onSyncEvent === 'function') {
                    window.__ELECTRON__.onSyncEvent((payload) => {
                        if (payload && payload.type === 'status') {
                            this.syncRunning = !!payload.running;
                            if (!payload.running && payload.reason === 'f10') {
                                this.showSuccess('同步已通过 F10 强制停止');
                            }
                        }
                    });
                }
            },
            beforeUnmount() {
                if (this._onLoginPageTokenMessage) {
                    window.removeEventListener('message', this._onLoginPageTokenMessage);
                }
                if (this._statusTimer) { clearInterval(this._statusTimer); this._statusTimer = null; }
            },
            methods: {
                hashPassword(password) {
                    const hash = CryptoJS.PBKDF2(password, 'salt', { keySize: 64 / 4, iterations: 100000, hasher: CryptoJS.algo.SHA512 });
                    return hash.toString(CryptoJS.enc.Hex);
                },
                encryptPassword(password) {
                    return CryptoJS.AES.encrypt(password, 'dldl_aes_key_2024').toString();
                },
                decryptPassword(encrypted) {
                    if (!encrypted) return '';
                    try {
                        const bytes = CryptoJS.AES.decrypt(encrypted, 'dldl_aes_key_2024');
                        return bytes.toString(CryptoJS.enc.Utf8);
                    } catch (e) { return ''; }
                },
                checkLoginState() {
                    const savedUser = localStorage.getItem('dldl_user');
                    if (savedUser) {
                        try {
                            this.currentUser = JSON.parse(savedUser);
                            this.isLoggedIn = true;
                            // 先展示缓存数据，同时后台拉取最新数据
                            this.loadAccountsFromCache();
                            this.loadAccounts();
                        } catch (e) {
                            localStorage.removeItem('dldl_user');
                        }
                    }
                },
                async handleLogin() {
                    const username = String(this.loginForm.username || '').trim();
                    const password = String(this.loginForm.password || '').trim();
                    if (!username || !password) { this.loginError = '请输入用户名和密码'; return; }
                    this.loginLoading = true; this.loginError = '';
                    try {
                        const { data, error } = await db.from('users').select('*').eq('username', username).single();
                        if (error || !data) throw new Error('用户不存在');
                        const hash = this.hashPassword(password);
                        if (hash !== data.password_hash) throw new Error('密码错误');
                        if (data.enabled === false) throw new Error('账号已被禁用，请联系管理员');
                        // 套餐过期直接拒绝登录（管理员与永久卡不受限；未开通套餐不拦截）
                        if (data.username !== 'tenghuanjun' && data.plan_type && data.plan_type !== 'permanent' && data.plan_expire_at) {
                            const exp = new Date(data.plan_expire_at).getTime();
                            if (!isNaN(exp) && Date.now() >= exp) throw new Error('套餐已过期，请联系管理员续费');
                        }
                        const { password_hash, ...userInfo } = data;
                        this.currentUser = userInfo; this.isLoggedIn = true;
                        localStorage.setItem('dldl_user', JSON.stringify(userInfo));
                        this.loginForm = { username: '', password: '' };
                        // 先展示缓存数据，同时后台拉取最新
                        this.loadAccountsFromCache();
                        this.loadAccounts();
                    } catch (e) { this.loginError = e.message || '登录失败'; }
                    finally { this.loginLoading = false; }
                },
                async handleRegister() {
                    const username = String(this.loginForm.username || '').trim();
                    const password = String(this.loginForm.password || '').trim();
                    if (!username || !password) { this.loginError = '请输入用户名和密码'; return; }
                    if (password.length < 6) { this.loginError = '密码至少6位'; return; }
                    this.loginLoading = true; this.loginError = '';
                    try {
                        const password_hash = this.hashPassword(password);
                        const encrypted_pwd = this.encryptPassword(password);
                        const { data, error } = await db.from('users').insert({ username, password_hash, encrypted_pwd }).select().single();
                        if (error) { if (error.code === '23505') throw new Error('用户名已存在'); throw error; }
                        const { password_hash: _, encrypted_pwd: __, ...userInfo } = data;
                        this.currentUser = userInfo; this.isLoggedIn = true;
                        localStorage.setItem('dldl_user', JSON.stringify(userInfo));
                        this.loginForm = { username: '', password: '' };
                        this.showSuccess('注册成功');
                    } catch (e) { this.loginError = e.message || '注册失败'; }
                    finally { this.loginLoading = false; }
                },
                handleLogout() {
                    // 清除当前用户的缓存再重置状态
                    if (this.currentUser) {
                        localStorage.removeItem('dldl_accounts_' + this.currentUser.id);
                    }
                    this.isLoggedIn = false; this.currentUser = null; this.areas = [];
                    localStorage.removeItem('dldl_user');
                },
                openAreaSortModal() {

                closeAreaSortModal() {

                async toggleUserEnabled(user) {
                    if (user.username === 'tenghuanjun') return;
                    try {
                        const newStatus = !user.enabled;
                        const { error } = await db.from('users').update({ enabled: newStatus }).eq('id', user.id);
                        if (error) throw error;
                        user.enabled = newStatus;
                        this.showSuccess(`已${newStatus ? '启用' : '禁用'}用户 ${user.username}`);
                    } catch (e) {
