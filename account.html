                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                },
                // --- 通行证登录 ---
                /** 通行证状态 key，用于 passCodeMap */
                _passCodeKey(area, account) {
                    return this.accountSelectKey(area, account);
                },
                _setPassCodeState(area, account, updates) {
                    const key = this._passCodeKey(area, account);
                    this.passCodeMap = {
                        ...this.passCodeMap,
                        [key]: {
                            ...(this.passCodeMap[key] || {}),
                            ...updates
                        }
                    };
                },
                _appLoginStatusKey(area, account) {
                    return this.accountSelectKey(area, account);
                },
                _setAppLoginStatus(area, account, status) {
                    const key = this._appLoginStatusKey(area, account);
                    this.appLoginStatusMap = {
                        ...this.appLoginStatusMap,
                        [key]: status
                    };
                },
                getAppLoginStatus(area, account) {
                    return this.appLoginStatusMap[this._appLoginStatusKey(area, account)] || '';
                },
                getPassCodeValue(area, account) {
                    const key = this._passCodeKey(area, account);
                    return (this.passCodeMap[key] && this.passCodeMap[key].value) || '';
                },
                getPassCodeStatus(area, account) {
                    const key = this._passCodeKey(area, account);
                    return (this.passCodeMap[key] && this.passCodeMap[key].status) || '';
                },
                isPassCodeSending(area, account) {
                    return this.getPassCodeStatus(area, account) === 'sending';
                },
                onPassCodeInput(ev, area, account) {
                    const val = ev.target.value;
                    if (val === '' || val == null) {
                        // 清空值时，同时清除已发送状态，允许下次重新发送
                        this._setPassCodeState(area, account, { value: '', status: '' });
                    } else {
                        // 有值时只更新 value，不改变 status（保持 ok/fail 等状态）
                        this._setPassCodeState(area, account, { value: val });
                    }
                },
                onPassCodeBlur(ev, area, account) {
                    const code = String(ev.target.value || '').trim();
                    // 值为空，不发请求
                    if (!code) return;
                    // 已发送 / 已失效状态下不重复发请求
                    const curStatus = this.getPassCodeStatus(area, account);
                    if (curStatus === 'ok' || curStatus === 'expired') return;
                    this.sendPassCode(code, area, account);
                },
                clearPassCode(area, account) {
                    this._setPassCodeState(area, account, { value: '', status: '' });
                },
                async sendPassCode(code, area, account) {
                    if (!window.hex_md5) {
                        this.showError('md5.js 未加载，无法发送通行证');
                        return;
                    }
                    this._setPassCodeState(area, account, { status: 'sending' });
                    try {
                        // 优先使用 APP 登录的 token/sign，没有则回退到 h5sdk 的
                        const passToken = String(account.app_token || account.token || '');
                        const passSign = String(account.app_sign || account.sign || '');
                        const dataObj = {
                            gid: '1003279',
                            pid: '46',
                            token: encodeURIComponent(passToken),
                            time: Date.now(),
                            sign: passSign,
                            appVer: '',
                            platCode: '37wan',
                            IMEI: ''
                        };
                        const dataStr = JSON.stringify(dataObj);
                        const timestamp = Date.now();
                        const sign = window.hex_md5(code + String(timestamp) + 'pcjgv587!?');
                        const body = 'id=' + encodeURIComponent(code) +
                            '&data=' + encodeURIComponent(dataStr) +
                            '&time=' + timestamp +
                            '&sign=' + sign;
                        const url = 'http://app.xxh5.z7xz.com/pc/postCodeInfo';
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: body
                        });
                        if (resp.ok) {
                            let tokenValid = true;
                            try {
                                const bodyText = await resp.text();
                                if (bodyText) {
                                    const json = JSON.parse(bodyText);
                                    // code !== 0 表示失败（37 系 API 中 code: 0 = 成功）
                                    if (json && json.code !== undefined && json.code !== 0) {
                                        tokenValid = false;
                                    }
                                    // 服务端明确返回 token 为空字符串，说明 token 已失效
                                    if (json && json.hasOwnProperty('token') && json.token === '') {
                                        tokenValid = false;
                                    }
                                }
                            } catch (_) {
                                // 响应不是 JSON 或为空，忽略
                            }
                            if (tokenValid) {
                                this._setPassCodeState(area, account, { status: 'ok' });
                                this.showSuccess('通行证已发送');
                            } else {
                                this._setPassCodeState(area, account, { status: 'expired' });
                                this.showError('通行证已发送，但 token 已失效，请刷新 token');
                            }
                        } else {
                            throw new Error('HTTP ' + resp.status);
                        }
                    } catch (e) {
                        console.error('sendPassCode failed', e);
                        this._setPassCodeState(area, account, { status: 'fail' });
                        this.showError('通行证发送失败：' + (e?.message || e));
                    }
                },
                // --- 通行证登录 end ---

                // ===== 批量填通行证（实验性功能） =====
                openBatchPassCode() {
                    if (this.selectedAccountCount === 0) {
                        this.showError('请先勾选要填通行证的账号');
                        return;
                    }
                    this.batchPassCodes = '';
                    this.batchPassMsg = '';
                    this.batchPassMsgType = 'info';
                    this.batchPassVisible = true;
                },
                closeBatchPassCode() {
                    this.batchPassVisible = false;
                },
                async submitBatchPassCodes() {
                    if (this.batchPassSending) return;
                    const codes = String(this.batchPassCodes || '')
                        .split(/\r?\n/)
                        .map((s) => s.trim())
                        .filter((s) => s.length > 0);
                    const selected = [];
                    for (const group of this.areas) {
                        for (const account of group.accounts) {
                            const k = this.accountSelectKey(group.area, account);
                            if (this.accountSelectMap[k]) selected.push({ area: group.area, account });
                        }
                    }
                    if (!selected.length) {
                        this.showError('没有勾选的账号');
                        return;
                    }
                    if (codes.length !== selected.length) {
                        this.batchPassMsg = `勾选了 ${selected.length} 个账号，但输入了 ${codes.length} 个码，数量需一致`;
                        this.batchPassMsgType = 'fail';
                        this.showError(this.batchPassMsg);
                        return;
                    }
                    this.batchPassSending = true;
                    let okCount = 0;
                    const fails = [];
                    try {
                        for (let i = 0; i < selected.length; i++) {
                            const { area, account } = selected[i];
                            const code = codes[i];
                            this._setPassCodeState(area, account, { value: code });
                            try {
                                await this.sendPassCode(code, area, account);
                                const st = this.getPassCodeStatus(area, account);
                                if (st === 'ok') okCount++;
                                else fails.push((account.uname || account.id || '') + '(状态:' + st + ')');
                            } catch (e) {
                                fails.push((account.uname || account.id || '') + ':' + (e && e.message ? e.message : e));
                            }
                        }
                    } finally {
                        this.batchPassSending = false;
                    }
                    if (fails.length === 0) {
                        this.batchPassMsg = `全部发送完成：${okCount}/${selected.length} 成功`;
                        this.batchPassMsgType = 'ok';
                    } else {
                        this.batchPassMsg = `完成 ${okCount}/${selected.length}，失败 ${fails.length}：${fails.join('；')}`;
                        this.batchPassMsgType = 'fail';
                    }
                },
                // ===== 批量填通行证 end =====

                // ===== 批量启动程序（浏览选 exe + 启动数量，位于同步弹窗内） =====
                async pickExePath() {
                    try {
                        const res = await window.__ELECTRON__.pickExe();
                        if (res && res.ok && res.path) {
                            this.exeLauncherPath = res.path;
                            this.exeLauncherMsg = '';
                            this.persistExeLaunchConfig();
                        } else if (res && !res.canceled && res.message) {
                            this.showError(res.message);
                        }
                    } catch (e) {
                        this.showError('选择程序失败：' + (e && e.message ? e.message : e));
                    }
                },
                async submitExeLaunch() {
                    if (this.exeLauncherSending) return;
                    if (!this.exeLauncherPath) {
                        this.showError('请先点击「浏览…」选择要启动的程序');
                        return;
                    }
                    const count = Math.max(1, Math.min(200, parseInt(this.exeLauncherCount, 10) || 1));
                    this.exeLauncherSending = true;
                    this.exeLauncherMsg = `正在启动 ${count} 个...`;
                    this.exeLauncherMsgType = 'info';
                    try {
                        const res = await window.__ELECTRON__.batchLaunchExe({
                            exePath: this.exeLauncherPath,
                            count
                        });
                        if (res && res.ok) {
                            const errMsg = (res.errors && res.errors.length)
                                ? `，失败 ${res.errors.length}：${res.errors.join('；')}` : '';
                            this.exeLauncherMsg = `已启动 ${res.launched}/${res.total} 个${errMsg}`;
                            this.exeLauncherMsgType = (res.launched === res.total) ? 'ok' : 'fail';
                            this.persistExeLaunchConfig();
                        } else {
                            this.exeLauncherMsg = res && res.message ? res.message : '启动失败';
                            this.exeLauncherMsgType = 'fail';
                            this.showError(this.exeLauncherMsg);
                        }
                    } catch (e) {
                        this.exeLauncherMsg = '启动异常：' + (e && e.message ? e.message : e);
                        this.exeLauncherMsgType = 'fail';
                    } finally {
                        this.exeLauncherSending = false;
                    }
                },
                // 批量复制通行证码：逐窗处理 → 复一个立刻赋一个
                async batchCopyPasscodes() {
                    if (this.batchCopyPassBusy) return;
                    const api = this._syncApi();
                    if (!api) return;
                    this.batchCopyPassBusy = true;
                    this.batchCopyPassCodesStr = '';
                    this.batchCopyPassResult = '';
                    try {
                        this.batchCopyPassResult = '正在刷新窗口列表...';
                        try { await this.refreshSyncWindows(); } catch (_) {}
                        const nativeHwnds = this.syncWindows
                            .filter(w => w.type === '原生客户端')
                            .map(w => w.hwnd);
                        if (!nativeHwnds.length) {
                            this.showError('没有识别到原生客户端窗口，请先批量启动、刷新窗口');
                            return;
                        }
                        const selected = [];
                        for (const group of this.areas) {
                            for (const acct of group.accounts) {
                                const k = this.accountSelectKey(group.area, acct);
                                if (this.accountSelectMap[k]) selected.push({ area: group.area, account: acct });
                            }
                        }
                        if (!selected.length) {
                            this.showError('请先在账号列表中勾选要填通行证的账号');
                            return;
                        }
                        if (nativeHwnds.length !== selected.length) {
                            this.showError('窗口 ' + nativeHwnds.length + ' 个 vs 勾选 ' + selected.length + ' 个，数量不一致');
                            return;
                        }
                        const allCodes = [];
                        let ok = 0, fail = 0;
                        for (let i = 0; i < nativeHwnds.length; i++) {
                            this.batchCopyPassResult = (i + 1) + '/' + nativeHwnds.length;
                            try {
                                const res = await api.batchCopyPasscodes({
                                    hwnds: [nativeHwnds[i]],
                                    px: 66.67, py: 86.67,
                                });
                                const code = (res && res.ok && res.codes && res.codes[0]) ? String(res.codes[0]).trim() : '';
                                if (!code || code.startsWith('[SKIP') || code.startsWith('[ERR') || code.startsWith('[EMPTY')) {
                                    allCodes.push(code || '[EMPTY]'); fail++; continue;
                                }
                                allCodes.push(code);
                                const { area, account } = selected[i];
                                this._setPassCodeState(area, account, { value: code });
                                try {
                                    await this.sendPassCode(code, area, account);
                                    if (this.getPassCodeStatus(area, account) === 'ok') ok++; else fail++;
                                } catch (_) { fail++; }
                            } catch (_) { allCodes.push('[ERR]'); fail++; }
                        }
                        this.batchCopyPassCodesStr = allCodes.join(',');
                        this.batchCopyPassResult = '共 ' + nativeHwnds.length + ' 个' + (ok ? '，成功 ' + ok : '') + (fail ? '，' + fail + ' 个失败' : '');
                        this.showSuccess(this.batchCopyPassResult);
                    } finally {
                        this.batchCopyPassBusy = false;
                    }
                },
                copyPasscodesToClipboard() {
                    if (!this.batchCopyPassCodesStr) return;
                    navigator.clipboard.writeText(this.batchCopyPassCodesStr)
                        .then(() => this.showSuccess('已复制到剪贴板'))
                        .catch(() => this.showError('自动复制失败，请选中下方文本框按 Ctrl+C 手动复制'));
                },
                feedPasscodesToBatchFill() {
                    if (!this.batchCopyPassCodesStr) return;
                    // 逗号拆分 → 过滤掉 [SKIP]/[ERR] 的失败项 → 转为换行格式
                    const codes = this.batchCopyPassCodesStr
                        .split(',')
                        .map(s => s.trim())
                        .filter(s => s && !s.startsWith('[SKIP') && !s.startsWith('[ERR'));
                    if (!codes.length) {
                        this.showError('没有有效的通行证码可填入（已排除跳过和失败的条目）');
                        return;
                    }
                    if (!this.selectedAccountCount) {
                        this.showError('请先在账号列表中勾选要填通行证的账号');
                        return;
                    }
                    if (codes.length !== this.selectedAccountCount) {
                        this.showError('复制到的有效码 ' + codes.length + ' 个，跟已勾选账号 ' + this.selectedAccountCount + ' 个数量不一致。请确认勾选数量与启动数量一致。');
                        return;
                    }
                    // 填入批量填通行证文本框（换行格式），弹出弹窗供确认发送
                    this.batchPassCodes = codes.join('\n');
                    this.batchPassMsg = '';
                    this.batchPassMsgType = 'info';
                    this.batchPassVisible = true;
                },
                // ===== 批量启动程序 end =====


                async refreshToken(account) {
                    // 刷新 APP token 前强制校验：读本地缓存对比，无新鲜记录才联网复核（管理员无阻断）
                    if (!(await this.assertActive())) return;
                    const uname = String(account && account.uname || '').trim();
                    const upwd = String(account && account.upwd || '').trim();
                    if (!uname || !upwd) {
                        this.showError('刷新 token 需要账号与密码');
                        return;
                    }
                    this.loadingText = `正在通过 APP SDK 刷新 ${uname} 的 token...`;
                    this.loadingVisible = true;
                    try {
                        const resp = await fetch('/api/app-login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ uname, upwd, platform: String(account.platform || '37') })
                        });
                        const result = await resp.json();
                        if (!result.ok || result.state !== 1) {
                            throw new Error(result.msg || result.message || 'APP 登录刷新失败');
                        }
                        const url = this.buildAppLoginUrl(result, account);
                        const appToken = String(result.token || '');
                        const appSign = String(result.sign || '');
                        const now = new Date().toISOString();
                        // 同步更新本地 account 对象
                        account.app_token = appToken;
                        account.app_sign = appSign;
                        account.url = url;
                        account.url_created_at = now;
                        if (this.currentUser && account.id != null) {
                            const { error: updateErr } = await db.from('accounts')
                                .update({ url, app_token: appToken, app_sign: appSign, url_created_at: now })
                                .eq('id', account.id)
                                .eq('user_id', this.currentUser.id);
                            if (updateErr) throw updateErr;
                        }
                        this.showSuccess(`已通过 APP SDK 刷新并保存 ${uname} 的凭据`);
                    } catch (e) {
                        console.error("refreshToken failed", e);
                        this.showError(`刷新 token 失败：${e?.message || e}`);
                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                },
                /** 代理IP相关方法 */
                loadProxyConfig() {
                    try {
                        // 代理功能已停用（三层代理链均不可用），强制 false，防止旧 localStorage 残留导致请求走死 Worker
                        this.useProxy = false;
                        const savedUrl = localStorage.getItem('dldl_proxyWorkerUrl');
                        // 如果没有保存过 URL，或保存的是空值，使用默认值
                        if (!savedUrl || savedUrl.trim() === '') {
                            this.proxyWorkerUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                            localStorage.setItem('dldl_proxyWorkerUrl', this.proxyWorkerUrl);
                        } else {
                            this.proxyWorkerUrl = savedUrl;
                        }
                        if (this.useProxy && this.proxyWorkerUrl) {
                            this.proxyIP = '代理中';
                        }
                    } catch (e) {
                        console.error('loadProxyConfig failed', e);
                        this.proxyWorkerUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                    }
                },
                fixAndLoadProxyConfig() {
                    const defaultUrl = 'https://red-moon-ff95.tenghuanjun.workers.dev';
                    try {
                        // 强制修复：如果 URL 为空，设置默认值
                        const savedUrl = localStorage.getItem('dldl_proxyWorkerUrl');
                        if (!savedUrl || savedUrl.trim() === '') {
                            localStorage.setItem('dldl_proxyWorkerUrl', defaultUrl);
                        }
                        this.loadProxyConfig();
                    } catch (e) {
                        console.error('fixAndLoadProxyConfig failed', e);
                        this.proxyWorkerUrl = defaultUrl;
                    }
                },
                saveProxyConfig() {
                    try {
                        localStorage.setItem('dldl_useProxy', String(this.useProxy));
                        localStorage.setItem('dldl_proxyWorkerUrl', this.proxyWorkerUrl);
                    } catch (e) {
                        console.error('saveProxyConfig failed', e);
                    }
                },
                async toggleProxyAndRefreshIP() {
                    this.proxyIP = '切换中...';
                    
                    if (!this.useProxy) {
                        // 首次点击，启用代理
                        this.useProxy = true;
                    }
                    
                    try {
                        // 统一切换入口：后端优先 GH-Relay，兜底代理池
                        // 客户端 50 秒超时（后端 45 秒，留余量）
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 50000);
                        const switchResp = await fetch('/proxy-pool/switch', {
                            method: 'POST',
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        const switchData = await switchResp.json();
                        
                        if (!switchData.ok) {
                            throw new Error(switchData.message || '切换失败');
                        }
                        
                        // 根据来源显示不同信息
                        if (switchData.source === 'gh-relay') {
                            // GitHub Actions relay：显示 Azure runner 的真实出口 IP
                            const switchedText = switchData.switched ? '已切换' : '最新';
                            const timeAgo = this._formatTimeAgo(switchData.updatedAt);
                            this.proxyIP = `Azure IP: ${switchData.ip} (${switchedText}, ${timeAgo})`;
                            this.saveProxyConfig();
                            this.showSuccess(`${switchedText} IP: ${switchData.ip}`);
                        } else if (switchData.source === 'proxy-pool') {
                            // 免费代理池
                            const newProxy = switchData.currentProxy;
                            if (newProxy) {
                                this.proxyIP = `代理: ${newProxy}`;
                                this.showSuccess(`已切换代理: ${newProxy}`);
                            } else {
                                this.proxyIP = '代理: 无可用（走直连）';
                                this.showSuccess('无可用代理，当前走直连');
                            }
                            this.saveProxyConfig();
                        } else {
                            // 直连
                            this.proxyIP = '直连 (无可用代理)';
                            this.saveProxyConfig();
                            this.showSuccess(switchData.message || '当前走直连');
                        }
                    } catch (e) {
                        console.error('toggleProxyAndRefreshIP failed', e);
                        this.proxyIP = '切换失败（走直连）';
                        const errMsg = e.name === 'AbortError' ? '切换IP超时' : (e?.message || e);
                        this.showError(`切换IP失败：${errMsg}`);
                    }
                },

                /** 格式化时间差为 "x秒前/x分钟前" */
                _formatTimeAgo(isoString) {
                    if (!isoString) return '';
                    const diff = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
                    if (diff < 60) return diff + '秒前';
                    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
                    return Math.floor(diff / 3600) + '小时前';
                },
                
                // 获取当前代理IP
                async getProxyIP() {
                    try {
                        const timestamp = Date.now();
                        const response = await fetch(`${this.proxyWorkerUrl}/get-ip?t=${timestamp}`);
                        const data = await response.json();
                        return data.ip;
                    } catch (e) {
                        console.error('getProxyIP failed, trying fallback', e);
                        // 备用方案：直接调用 ipify API
                        try {
                            const timestamp = Date.now();
                            const fallbackResponse = await fetch(`https://api.ipify.org?format=json&t=${timestamp}`);
                            const fallbackData = await fallbackResponse.json();
                            return fallbackData.ip;
                        } catch (fallbackError) {
                            console.error('Fallback getIP failed', fallbackError);
                            return null;
                        }
                    }
                },

                // ========== 窗口同步（整合自 tongbuqi 同步器） ==========
                _syncApi() {
                    const e = window.__ELECTRON__;
                    if (!e || typeof e.syncEnumerate !== 'function') {
                        this.showError('窗口同步仅在 DLDL-Proxy 桌面客户端内可用');
                        return null;
                    }
                    return e;
                },
                async openSyncModal() {
                    if (!this._syncApi()) return;
                    // 打开时先回填本地持久化的 程序路径 / 启动数量 / 同步方式
                    await this.loadExeLaunchConfig();
                    this.syncModalVisible = true;
                    // 打开时刷新一次状态与窗口列表
                    try {
                        const st = await window.__ELECTRON__.syncStatus();
                        if (st && st.ok && st.status) this.syncRunning = !!st.status.running;
                    } catch (_) {}
                    await this.refreshSyncWindows();
                },
                // 读取本地持久化的批量启动 + 同步方式配置
                async loadExeLaunchConfig() {
                    try {
                        const res = await window.__ELECTRON__.getExeLaunchConfig();
                        if (res && res.ok && res.config) {
                            const c = res.config;
                            if (typeof c.exeLauncherPath === 'string') this.exeLauncherPath = c.exeLauncherPath;
                            if (typeof c.exeLauncherCount === 'number') this.exeLauncherCount = c.exeLauncherCount;
                            if (c.syncMode === 'native' || c.syncMode === 'web') this.syncMode = c.syncMode;
                        }
                    } catch (_) {}
                },
                // 保存本地持久化配置（exe 路径 / 启动数量 / 同步方式）
                async persistExeLaunchConfig() {
                    try {
                        await window.__ELECTRON__.saveExeLaunchConfig({
                            exeLauncherPath: this.exeLauncherPath,
                            exeLauncherCount: this.exeLauncherCount,
                            syncMode: this.syncMode,
                        });
                    } catch (_) {}
                },
                closeSyncModal() {
                    this.syncModalVisible = false;
                },
                async refreshSyncWindows() {
                    const api = this._syncApi();
                    if (!api) return;
                    this.syncLoading = true;
                    try {
                        const res = await api.syncEnumerate();
                        if (!res || !res.ok) {
                            this.showError(`识别窗口失败：${res && res.message || '未知错误'}`);
                            this.syncWindows = [];
                            return;
                        }
                        this.syncWindows = res.windows || [];
                        // 校正已选：移除已消失的窗口
                        const alive = new Set(this.syncWindows.map(w => w.hwnd));
                        if (this.syncMaster && !alive.has(this.syncMaster)) this.syncMaster = null;
                        this.syncTargets = this.syncTargets.filter(h => alive.has(h));
                        // 未选主控时，默认选第一个多开窗口为主控，其余多开窗口为同步目标
                        if (!this.syncRunning && !this.syncMaster) {
                            const dldl = this.syncWindows.filter(w => w.is_dldl);
                            if (dldl.length) {
                                this.syncMaster = dldl[0].hwnd;
                                this.syncTargets = dldl.slice(1).map(w => w.hwnd);
                                api.syncHighlight(this.syncMaster);
                            }
                        }
                    } catch (e) {
                        this.showError(`识别窗口失败：${e?.message || e}`);
                    } finally {
                        this.syncLoading = false;
                    }
                },
                onPickMaster(w) {
                    const oldMaster = this.syncMaster;
                    // 切换主控时，旧主控不再担任主控 → 自动加回同步目标（仍在窗口列表且非新主控）
                    if (oldMaster && oldMaster !== w.hwnd) {
                        const alive = this.syncWindows.map(x => x.hwnd);
                        if (alive.includes(oldMaster) && !this.syncTargets.includes(oldMaster)) {
                            this.syncTargets.push(oldMaster);
                        }
                    }
                    // 新主控从同步目标里剔除，并正式设为当前主控
                    this.syncTargets = this.syncTargets.filter(h => h !== w.hwnd);
                    this.syncMaster = w.hwnd;
                    const api = this._syncApi();
                    if (api) api.syncHighlight(w.hwnd);
                },
                toggleSyncTarget(hwnd) {
                    if (this.syncMaster === hwnd) return;
                    const i = this.syncTargets.indexOf(hwnd);
                    if (i >= 0) this.syncTargets.splice(i, 1);
                    else this.syncTargets.push(hwnd);
                },
                async startSync() {
                    const api = this._syncApi();
                    if (!api) return;
                    if (!this.syncMaster) { this.showError('请先选择主控窗口'); return; }
                    if (!this.syncTargets.length) { this.showError('请至少勾选一个同步目标窗口'); return; }
                    try {
                        const res = await api.syncStart({
                            master: this.syncMaster,
                            targets: this.syncTargets.slice(),
                            mode: this.syncMode,
                        });
                        if (!res || !res.ok) {
                            this.showError(`开始同步失败：${res && res.message || '未知错误'}`);
                            return;
                        }
                        this.syncRunning = true;
                        this.showSuccess(`已开始同步：主控 1 个 → 同步 ${this.syncTargets.length} 个（F10 可停止）`);
                    } catch (e) {
                        this.showError(`开始同步失败：${e?.message || e}`);
                    }
                },
                async stopSync() {
                    const api = this._syncApi();
                    if (!api) return;
                    try {
                        await api.syncStop();
                    } catch (_) {}
                    this.syncRunning = false;
                    this.showSuccess('已停止同步');
                },

                /** 通用窗口管理入口：仅作用于上方已枚举的多开游戏窗口 */
                async _opSyncWindows(action, extra) {
                    const api = this._syncApi();
                    if (!api) return;
                    const hwnds = this.syncWindows.map(w => w.hwnd);
                    if (!hwnds.length) { this.showError('没有可操作的窗口，请先「刷新窗口」'); return; }
                    // 关闭窗口前若正在同步，先停同步（避免主控被关导致异常）
                    if (action === 'close' && this.syncRunning) {
                        try { await this.stopSync(); } catch (_) {}
                    }
                    const labelMap = { close: '关闭', set_size: '调整宽高', arrange: '自动排列', hide: '隐藏', show: '显示' };
                    try {
                        const res = await api.syncWindowOp({ action, hwnds, ...(extra || {}) });
                        if (!res || !res.ok) {
                            this.showError('窗口操作失败：' + (res && res.message || '未知错误'));
                            return;
                        }
                        if (action === 'close') {
                            this.showSuccess(`已关闭 ${res.count} 个同步窗口`);
                            // 窗口关闭后刷新列表
                            setTimeout(() => this.refreshSyncWindows(), 600);
                        } else {
                            const failed = (res.failed && res.failed.length) ? `（${res.failed.length} 个失败）` : '';
                            this.showSuccess(`已${labelMap[action] || action} ${res.count} 个窗口${failed}`);
                        }
                    } catch (e) {
                        this.showError('窗口操作失败：' + (e?.message || e));
                    }
                },
                /** 应用宽高到所有多开窗口（保持当前位置，仅改尺寸） */
                applySyncSize() {
                    const w = parseInt(this.syncWinW, 10);
                    const h = parseInt(this.syncWinH, 10);
                    if (!w || !h || w <= 0 || h <= 0) { this.showError('请输入有效的宽高（> 0）'); return; }
                    this._opSyncWindows('set_size', { w, h });
                },
                /** 自动排列所有多开窗口为网格（用当前宽高输入作为每窗尺寸） */
                autoArrangeSync() {
                    const winW = parseInt(this.syncWinW, 10) || 0;
                    const winH = parseInt(this.syncWinH, 10) || 0;
                    this._opSyncWindows('arrange', { winW, winH, gap: 4 });
                },
                hideSyncWindows() { this._opSyncWindows('hide'); },
                showSyncWindows() { this._opSyncWindows('show'); },
                closeAllSyncWindows() { this._opSyncWindows('close'); },
                /** 预览红框高亮当前选中的主控窗口，便于确认哪个是主窗口 */
                previewMasterHighlight() {
                    if (!this.syncMaster) { this.showError('请先选择主控窗口（左侧单选框）'); return; }
                    const api = this._syncApi();
                    if (!api) return;
                    try { api.syncHighlight(this.syncMaster); this.showSuccess('已高亮主控窗口红框'); }
                    catch (e) { this.showError('高亮失败：' + (e?.message || e)); }
                },

            }
        });
        app.directive('account-cards-sortable', accountCardsSortableDirective);
        app.use(ElementPlus);
        app.mount("#app");
    </script>

            font-size: 12px;
            color: var(--text-muted);
            display: inline-flex; align-items: center;
            gap: 8px; margin-left: auto;
        }

        /* ===== Cards Grid ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            align-items: start;
        }
        @media (max-width: 1080px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 760px)  { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 480px)  { .cards { grid-template-columns: 1fr; } }

        .sticky-row-batch .search-input { width: 260px; max-width: 260px; flex: 0 0 260px; box-sizing: border-box; }
        .btn-clear-search { margin-left: 2px; }
        .batch-search-sep { display: inline-block; width: 12px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 0;
            box-shadow: var(--shadow-xs);
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }
        .card.card-launched {
            background: #ecfdf5;
            border-color: #a7f3d0;
        }
        .card.card-selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .card.card-launched:hover {
            border-color: #6ee7b7;
        }
        .card:hover {
            box-shadow: var(--shadow);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .sortable-account-card {
            display: flex; flex-direction: row;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            min-height: 0; position: relative;
        }

        .card-url-dot {
            position: absolute; top: 8px; right: 8px;
            width: 8px; height: 8px;
            border-radius: 50%; flex-shrink: 0;
        }
        .card-url-dot.has-url { background: var(--success); box-shadow: 0 0 6px rgba(16,185,129,0.4); }
        .card-url-dot.no-url  { background: var(--border); }
        .card-url-age {
            position: absolute; top: 5px; right: 22px;
            font-size: 11px; color: #16a34a; font-weight: 600;
            white-space: nowrap; pointer-events: none;
        }
        .card-url-age.urgent { color: #b45309; font-weight: 600; }
        .card-url-age.expired { color: #c0392b; font-weight: 700; }

        .card-check-wrap {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            width: 20px; cursor: pointer;
        }
        .card-check-wrap input[type="checkbox"] {
            width: 15px; height: 15px; margin: 0;
            cursor: pointer; accent-color: var(--accent);
        }

        .sortable-account-card .card-main { flex: 1; min-width: 0; }

        .card-drag-handle {
            flex-shrink: 0;
            width: 24px; min-height: 44px;
            align-self: stretch;
            margin: 0; padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 12px; line-height: 1;
            letter-spacing: -1px;
            cursor: grab;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .card-drag-handle:hover {
            background: var(--bg);
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }
        .card-drag-handle:active { cursor: grabbing; }

        .card-sortable-ghost  { opacity: 0.4; }
        .card-sortable-chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
        .card-sortable-drag   { opacity: 0.95; }

        .card-top {
            display: flex; flex-direction: column;
            align-items: stretch; gap: 8px; margin: 0;
        }

        .card-actions {
            display: flex; gap: 5px;
            flex-wrap: wrap; justify-content: flex-start;
        }
        .card-actions .btn { padding: 5px 10px; font-size: 12px; border-radius: 4px; }

        .card-name { min-width: 0; }
        .card-name .nick {
            font-size: 14px; font-weight: 600;
            color: var(--text); margin-bottom: 3px;
        }
        .card-name .nick .card-index {
            display: inline-block;
            min-width: 18px; padding: 0 4px; margin-right: 5px;
            font-size: 11px; font-weight: 700; line-height: 16px;
            text-align: center; color: #fff; background: var(--accent);
            border-radius: 8px; vertical-align: middle;
        }
        .card-name .uname {
            font-size: 11px; color: var(--text-muted);
            word-break: break-all; line-height: 1.4;
        }

        .card-pass-row {
            display: flex; align-items: center;
            gap: 6px; margin-top: 8px;
        }

        .pass-code-input-wrap { flex: 1; min-width: 0; position: relative; }
        .pass-code-input {
            width: 100%; box-sizing: border-box;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 6px 24px 6px 8px;
            font-size: 12px; outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .pass-code-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .pass-code-input::placeholder { color: var(--text-muted); font-size: 11px; }

        .pass-code-clear {
            position: absolute; right: 4px; top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            border: none; border-radius: 50%;
            background: var(--border);
            color: var(--text-muted);
            font-size: 10px; line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
            transition: background 0.15s, color 0.15s;
        }
        .pass-code-clear:hover { background: var(--border-hover); color: var(--text-secondary); }

        .pass-code-status { flex-shrink: 0; font-size: 11px; white-space: nowrap; }
        .pass-code-status.sending  { color: var(--accent); }
        .pass-code-status.ok       { color: var(--success); }
        .pass-code-status.expired  { color: var(--danger); }
        .pass-code-status.fail     { color: var(--danger); }

        .card-row { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 10px; }
        .label    { font-size: 12px; color: var(--text-muted); }

        .pwd {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 8px 10px; font-size: 13px; outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .pwd:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        /* ===== Modal ===== */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.45);
            backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; z-index: 1000;
        }
        .modal {
            width: min(560px, 100%);
            max-height: min(90vh, 800px);
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
        }
        .modal-title {
            font-size: 17px; font-weight: 700;
            color: var(--text);
            margin-bottom: 18px;
            letter-spacing: -0.2px;
        }

        .form-section-label {
            margin: 6px 0 2px;
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-field { display: flex; flex-direction: column; gap: 5px; }
        .form-field.full { grid-column: 1 / -1; }

        .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }

        .form-input,
        .form-select {
            width: 100%; box-sizing: border-box;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 9px 12px; font-size: 13px; outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-input:focus,
        .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        textarea.form-input.form-textarea {
            min-height: 72px; resize: vertical; line-height: 1.45;
        }

        .url-extract-row { display: flex; gap: 10px; align-items: flex-start; }
        .url-paste-input  { flex: 1; min-width: 0; min-height: 52px; }
        .url-extract-btn  { flex-shrink: 0; align-self: flex-start; padding: 9px 14px; font-weight: 500; }

        .form-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
        .area-select { width: 100%; }
        .form-help { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 12px; }

        .modal-actions {
            display: flex; justify-content: space-between;
            align-items: center; gap: 10px; margin-top: 20px;
        }
        .modal-actions-top {
            margin-top: 0; margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        /* ===== Area Sort Modal ===== */
        .area-sort-tip { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .area-sort-list { max-height: 70vh; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
        .area-sort-item {
            display: inline-flex; align-items: center;
            gap: 6px; padding: 6px 10px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: default;
            font-size: 12px; transition: box-shadow 0.15s ease;
        }
        .area-sort-handle { flex-shrink: 0; color: var(--text-muted); font-size: 11px; cursor: grab; user-select: none; letter-spacing: -1px; }
        .area-sort-handle:active { cursor: grabbing; }
        .area-sort-name  { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
        .area-sort-count { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .area-sort-ghost  { opacity: 0.4; }
        .area-sort-chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

        /* ===== Account Sort Modal ===== */
        .account-sort-tip { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .account-sort-list { max-height: 70vh; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
        .account-sort-item {
            display: inline-flex; align-items: center;
            gap: 8px; padding: 8px 12px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: grab;
            width: fit-content; max-width: 100%;
            transition: box-shadow 0.15s ease;
        }
        .account-sort-handle { flex-shrink: 0; color: var(--text-muted); font-size: 13px; cursor: grab; user-select: none; letter-spacing: -1px; }
        .account-sort-handle:active { cursor: grabbing; }
        .account-sort-name  { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .account-sort-ghost  { opacity: 0.4; }
        .account-sort-chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

        /* ===== User Manage ===== */
        .modal.user-manage-modal {
            width: min(820px, 96vw);
            display: flex; flex-direction: column;
            overflow: hidden; max-height: min(88vh, 800px);
        }
        .user-manage-tip  { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
        .user-manage-list { flex: 1 1 auto; overflow-y: auto; margin: 0; padding-right: 4px; }

        /* 表头 */
        .user-manage-header {
            display: flex; align-items: center;
            padding: 0 14px 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* 列宽定义 */
        .um-col-name    { flex: 1 1 140px; min-width: 100px; display: flex; align-items: center; gap: 8px; }
        .um-col-status  { flex: 0 0 68px; display: flex; align-items: center; justify-content: flex-start; }
        .um-col-plan    { flex: 0 0 220px; display: flex; align-items: center; gap: 8px; }
        .um-col-actions { flex: 0 0 210px; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }

        .user-manage-header .um-col-status,
        .user-manage-header .um-col-plan,
        .user-manage-header .um-col-actions { justify-content: flex-start; }
        .user-manage-header .um-col-actions { justify-content: flex-end; }

        .user-manage-item {
            display: flex; align-items: center;
            padding: 10px 14px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 4px;
            transition: background 0.15s;
        }
        .user-manage-item:hover { background: var(--bg); }

        .user-manage-name  { font-size: 13px; font-weight: 600; color: var(--text); }
        .user-manage-role  { font-size: 10px; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 4px; font-weight: 600; flex-shrink: 0; }
        .user-manage-status { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
        .status-enabled  { color: var(--success); background: var(--success-soft); }
        .status-disabled { color: var(--danger);  background: var(--danger-soft); }
        .user-manage-plan  { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
        .plan-active  { color: #f59e0b; background: rgba(245,158,11,0.1); }
        .plan-expired { color: var(--danger); background: var(--danger-soft); }
        .plan-none    { color: var(--text-muted); background: rgba(148,163,184,0.1); }

        /* 当前用户套餐徽章（header 用户名旁） */
        .user-info .user-plan {
            font-size: 11px; padding: 2px 9px; border-radius: 999px;
            font-weight: 600; white-space: nowrap; flex-shrink: 0;
        }

        .um-col-plan .plan-select {
            flex-shrink: 0;
            font-size: 11px; padding: 4px 6px;
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px; cursor: pointer;
            max-width: 110px;
            transition: border-color 0.2s ease;
        }
        .um-col-plan .plan-select:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 操作按钮统一宽度 */
        .um-col-actions .btn {
            flex-shrink: 0;
            white-space: nowrap;
            min-width: 46px;
            text-align: center;
        }
        .um-btn-init   { min-width: 58px !important; }
        .um-btn-delete { min-width: 42px !important; }

        .user-manage-modal .modal-title,
        .user-manage-modal .user-manage-tip { flex-shrink: 0; }
        .user-manage-modal .user-manage-header { flex-shrink: 0; }
        .user-manage-modal .modal-actions { flex-shrink: 0; margin-top: 14px; }

        /* ===== Loading ===== */
        .loading-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(3px);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; gap: 14px;
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; font-weight: 500; color: #fff; }

        /* ===== Tips ===== */
        .tip { margin-top: 12px; color: var(--text-muted); font-size: 13px; }
        .tip-secondary { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
        .tip code {
            font-size: 12px; padding: 1px 6px; border-radius: 4px;
            background: var(--bg); color: var(--accent);
        }

        .visually-hidden {
            position: absolute;
            width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0);
            white-space: nowrap; border: 0;
        }
        .white-space-nowrap { white-space: nowrap; }

        /* ===== Element Plus Overrides ===== */
        .el-select { --el-color-primary: var(--accent); }
        .el-select .el-select__wrapper {
            border-radius: var(--radius-sm) !important;
            box-shadow: none !important;
            border: 1px solid var(--border);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .el-select .el-select__wrapper:hover { border-color: var(--border-hover); }
        .el-select .el-select__wrapper.is-focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px var(--accent-soft) !important;
        }
        .el-select-dropdown { border-radius: var(--radius) !important; border: 1px solid var(--border) !important; box-shadow: var(--shadow-lg) !important; }
        .el-select-dropdown__item { font-size: 13px !important; }
        .el-select-dropdown__item.is-selected { color: var(--accent) !important; font-weight: 600; }
        .el-select-dropdown__item:hover { background: var(--bg) !important; }
        .el-popper.is-light { background: var(--surface) !important; border: 1px solid var(--border) !important; }
        .el-select-dropdown__item.is-hovering { background: var(--bg) !important; }
    </style>
</body>

</html>
