                    }
                },
                // 套餐类型中文名
                planTypeName(type) {
                    return { permanent: '永久卡', year: '年卡', month: '月卡', trial: '体验卡' }[type] || '未设置';
                },
                // 日期格式化为 YYYY/MM/DD（供套餐到期展示）
                fmtFullDate(iso) {
                    if (!iso) return '';
                    const d = new Date(iso);
                    if (isNaN(d.getTime())) return '';
                    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
                },
                // 日期格式化为 MM/DD
                fmtDate(iso) {
                    if (!iso) return '';
                    const d = new Date(iso);
                    return `${d.getMonth() + 1}/${d.getDate()}`;
                },
                // 列表显示：套餐名 + 起止日期
                planLabel(user) {
                    if (!user.plan_type) return '未设置';
                    const name = this.planTypeName(user.plan_type);
                    if (user.plan_type === 'permanent') return name;
                    const start = this.fmtDate(user.plan_start_at);
                    const end = this.fmtDate(user.plan_expire_at);
                    if (!user.plan_expire_at) return start ? `${name}（${start}起）` : name;
                    const exp = new Date(user.plan_expire_at);
                    const now = new Date();
                    if (exp <= now) return `${name}·已过期（${end}）`;
                    const days = Math.ceil((exp - now) / 86400000);
                    return `${name} ${start}→${end} 剩${days}天`;
                },
                // 套餐标签着色：有效 / 过期 / 未设置
                planClass(user) {
                    if (!user.plan_type) return 'plan-none';
                    if (user.plan_type === 'permanent') return 'plan-active';
                    if (user.plan_expire_at && new Date(user.plan_expire_at) > new Date()) return 'plan-active';
                    return 'plan-expired';
                },
                // 根据套餐类型计算默认到期日（从现在起算）
                defaultPlanExpire(planType) {
                    const now = new Date();
                    if (planType === 'year') { const d = new Date(now); d.setFullYear(d.getFullYear() + 1); return d; }
                    if (planType === 'month') { const d = new Date(now); d.setMonth(d.getMonth() + 1); return d; }
                    if (planType === 'trial') { const d = new Date(now); d.setDate(d.getDate() + 3); return d; }
                    return null;
                },
                /** 修复 select 同值不触发 change 的问题：点击下拉时先清空值，确保选任何项都触发 change */
                onPlanSelectOpen(evt) {
                    evt.target.value = '';
                },
                // 设置套餐：选择类型后弹出到期日输入，让管理员指定具体过期时间
                async setPlan(user, evt) {
                    if (user.username === 'tenghuanjun') return;
                    const planType = evt && evt.target ? evt.target.value : evt;
                    if (!planType) {
                        // 空值=用户取消了选择或选中了占位项，还原 select
                        if (evt && evt.target) evt.target.value = user.plan_type || '';
                        return;
                    }
                    const label = this.planTypeName(planType);
                    const defaultExpire = this.defaultPlanExpire(planType);
                    const defaultDateStr = defaultExpire ? defaultExpire.toISOString().slice(0, 10) : '';
                    // 弹窗让用户确认/修改到期日期
                    const expireDateStr = await this.promptPlanExpireDate(user.username, label, defaultDateStr);
                    if (expireDateStr === null) {
                        if (evt && evt.target) evt.target.value = user.plan_type || '';
                        return;
                    }
                    const now = new Date();
                    let expire = null;
                    if (planType !== 'permanent' && expireDateStr) {
                        expire = new Date(expireDateStr + 'T23:59:59');
                        if (isNaN(expire.getTime())) {
                            this.showError('日期格式不正确');
                            if (evt && evt.target) evt.target.value = user.plan_type || '';
                            return;
                        }
                    }
                    try {
                        const payload = {
                            plan_type: planType,
                            plan_start_at: now.toISOString(),
                            plan_expire_at: expire ? expire.toISOString() : null,
                            enabled: true  // 设置/续费套餐即恢复启用
                        };
                        const { error } = await db.from('users').update(payload).eq('id', user.id);
                        if (error) throw error;
                        user.plan_type = payload.plan_type;
                        user.plan_start_at = payload.plan_start_at;
                        user.plan_expire_at = payload.plan_expire_at;
                        user.enabled = true;
                        const expireInfo = expire ? `，到期 ${expireDateStr}` : '';
                        this.showSuccess(`已将 ${user.username} 设置为「${label}」${expireInfo}`);
                    } catch (e) {
                        if (evt && evt.target) evt.target.value = user.plan_type || '';
                        this.showError(`设置套餐失败：${e.message}`);
                    }
                },
                async deleteUser(user) {
                    if (user.username === 'tenghuanjun') return;
                    if (this.loadingVisible) return;
                    const confirmed = await this.confirmAction(`确认删除用户 ${user.username} 吗？该用户下的所有区服和账号将一并删除，不可恢复。`, '删除用户');
                    if (!confirmed) return;
                    this.loadingText = '正在删除用户...';
                    this.loadingVisible = true;
                    try {
                        await db.from('accounts').delete().eq('user_id', user.id);
                        await db.from('areas').delete().eq('user_id', user.id);
                        const { error } = await db.from('users').delete().eq('id', user.id);
                        if (error) throw error;
                        this.allUsers = this.allUsers.filter(u => u.id !== user.id);
                        this.showSuccess(`已删除用户 ${user.username}`);
                    } catch (e) {
                        this.showError(`删除失败：${e.message}`);
                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                },
                async initUserData(user) {
                    if (this.userInitLoading[user.id]) return;
                    this.userInitLoading = Object.assign({}, this.userInitLoading, { [user.id]: true });
                    try {
                        // 走 Worker 端执行（red-moon 协调 Worker 再分发到 dlapi-1~99 并发刷新），
                        // 客户端只需把 userId 发给 Worker，无需翻墙直连游戏服。
                        const base = this.proxyWorkerUrl || 'https://red-moon-ff95.tenghuanjun.workers.dev';
                        const resp = await fetch(base + '/api/admin-init-refresh', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: user.id })
                        });
                        const result = await resp.json();
                        const scanned = result.scanned || 0;
                        const refreshed = result.refreshed || 0;
                        const errors = result.errors || 0;
                        const skipped = result.skipped || 0;
                        const detail = Array.isArray(result.detail) ? result.detail : [];
                        const skipNote = skipped > 0 ? `，跳过 ${skipped} 个（未过期）` : '';
                        if (errors === 0) {
                            this.showSuccess(`数据初始化完成（${user.username}）：扫描 ${scanned} 个，刷新 ${refreshed} 个${skipNote}`);
                        } else {
                            // 区分 Worker 故障（detail 含 batch/error）与账号刷新失败（detail 含 uname/error）
                            const workerFails = detail.filter(d => d.batch);
                            let msg = `数据初始化完成（${user.username}）：成功 ${refreshed}，失败 ${errors}${skipNote}`;
                            const accFails = detail.filter(d => d.uname).map(d => d.uname + (d.error ? '(' + d.error + ')' : ''));
                            if (accFails.length) msg += '\n账号失败：' + accFails.join('、');
                            if (workerFails.length) msg += '\nWorker故障：' + workerFails.map(d => '批' + d.batch + ' ' + d.error).join('；');
                            this.showError(msg);
                        }
                    } catch (e) {
                        this.showError(`数据初始化失败（${user.username}）：${e.message}`);
                    } finally {
                        this.userInitLoading = Object.assign({}, this.userInitLoading, { [user.id]: false });
                    }
                },
                openChangePwdModal(user) {
                    this.changePwdUser = user;
                    this.newPassword = '';
                    this.changePwdModalVisible = true;
                },
                closeChangePwdModal() {
                    this.changePwdModalVisible = false;
                    this.changePwdUser = null;
                },
                async submitChangePwd() {
                    const pwd = String(this.newPassword || '').trim();
                    if (!pwd) { this.showError('请输入新密码'); return; }
                    if (pwd.length < 6) { this.showError('密码至少6位'); return; }
                    try {
                        const password_hash = this.hashPassword(pwd);
                        const encrypted_pwd = this.encryptPassword(pwd);
                        const { error } = await db.from('users').update({ password_hash, encrypted_pwd }).eq('id', this.changePwdUser.id);
                        if (error) throw error;
                        this.showSuccess(`已修改用户 ${this.changePwdUser.username} 的密码`);
                        this.closeChangePwdModal();
                    } catch (e) {
                        this.showError(`修改密码失败：${e.message}`);
                    }
                },
                async showUserPassword(user) {
                    this.showPwdLoading = true;
                    try {
                        const { data, error } = await db.from('users').select('encrypted_pwd').eq('id', user.id).single();
                        if (error) throw error;
                        const pwd = this.decryptPassword(data?.encrypted_pwd);
                        this.showPwdText = pwd || '(未设置或无法解密)';
                        this.showPwdUser = user;
                        this.showPwdVisible = true;
                    } catch (e) {
                        this.showError('获取密码失败：' + (e.message || '未知错误'));
                    } finally { this.showPwdLoading = false; }
                },
                closeShowPwd() {
                    this.showPwdVisible = false;
                    this.showPwdUser = null;
                    this.showPwdText = '';
                },
                showMessage(type, message) {
                    if (typeof ElMessage === 'function') {
                        ElMessage({
                            type,
                            message: String(message || ''),
                            duration: 2200,
                            showClose: true
                        });
                        return;
                    }
                    alert(String(message || ''));
                },
                showError(message) {
                    this.showMessage('error', message);
                },
                showSuccess(message) {
                    this.showMessage('success', message);
                },
                failWithMessage(message) {
                    this.showError(message);
                    return null;
                },
                async confirmAction(message, title = '提示') {
                    if (!ElMessageBox || typeof ElMessageBox.confirm !== 'function') {
                        return window.confirm(String(message || title));
                    }
                    try {
                        await ElMessageBox.confirm(String(message || ''), title, {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning',
                            closeOnClickModal: false,
                            appendTo: document.body
                        });
                        return true;
                    } catch (_) {
                        return false;
                    }
                },
                /** 弹出日期输入框，让管理员指定套餐到期日。返回日期字符串 'YYYY-MM-DD' 或 null（取消） */
                async promptPlanExpireDate(username, planLabel, defaultDateStr) {
                    // 降级：无 ElMessageBox 时直接用 window.prompt
                    if (!ElMessageBox || typeof ElMessageBox.prompt !== 'function') {
                        const input = window.prompt(`为用户「${username}」设置「${planLabel}」\n请输入到期日期（YYYY-MM-DD）：`, defaultDateStr);
                        if (!input) return null;
                        return input.trim();
                    }
                    try {
                        const { value } = await ElMessageBox.prompt(
                            `为用户「${username}」设置「${planLabel}」\n请输入到期日期：`,
                            '设置到期时间',
                            {
                                confirmButtonText: '确定',
                                cancelButtonText: '取消',
                                inputValue: defaultDateStr,
                                inputType: 'text',
                                inputPlaceholder: 'YYYY-MM-DD',
                                closeOnClickModal: false,
                                appendTo: document.body
                            }
                        );
                        return (value || '').trim() || null;
                    } catch (_) {
                        return null;
                    }
                },
                CACHE_KEY_ACCOUNTS() {
                    return 'dldl_accounts_' + (this.currentUser?.id || '');
                },
                saveAccountsToCache() {
                    if (this.areas.length > 0 && this.currentUser) {
                        try { localStorage.setItem(this.CACHE_KEY_ACCOUNTS(), JSON.stringify(this.areas)); } catch (e) {}
                    }
                },
                loadAccountsFromCache() {
                    if (!this.currentUser) return false;
                    try {
                        const cached = localStorage.getItem(this.CACHE_KEY_ACCOUNTS());
                        if (cached) {
                            this.areas = JSON.parse(cached);
                            const names = this.areas.map(g => g.area);
                            if (!this.batchPanelArea || !names.includes(this.batchPanelArea)) this.batchPanelArea = names[0] || '';
                            return true;
                        }
                    } catch (e) {}
                    return false;
                },
                /**
                 * 校验当前登录用户状态：被禁用或套餐过期则自动退出登录。
                 * 由「刷新列表」及每小时定时器调用。返回 false 表示已退出。
                 * 查询失败时 fail-open（返回 true，不误踢）。
                 */
                async checkAccountStatus() {
                    if (!this.currentUser || !this.currentUser.id) return true;
                    try {
                        const { data: u, error: uErr } = await db
                            .from('users').select('enabled, plan_type, plan_expire_at').eq('id', this.currentUser.id).single();
                        if (uErr || !u) return true; // 查询失败不阻塞主流程
                        // 同步套餐信息，使 header 到期时间始终最新（管理员改套餐后即见）
                        this.currentUser.plan_type = u.plan_type;
                        this.currentUser.plan_expire_at = u.plan_expire_at;
                        // 将最新校验结果写入本地缓存，供关键操作前「读本地对比」使用（无需每次点击都现请求接口）
                        try {
                            localStorage.setItem('dldl_status_check', JSON.stringify({
                                userId: this.currentUser.id,
                                enabled: u.enabled,
                                plan_type: u.plan_type,
                                plan_expire_at: u.plan_expire_at,
                                checkedAt: Date.now()
                            }));
                        } catch (_) { /* 缓存不可用时忽略，下次定时器或复核会补 */ }
                        if (u.enabled === false) {
                            this.handleLogout();
                            this.showError('当前账号已被禁用，已自动退出登录');
                            return false;
                        }
                        // 套餐过期检测：管理员与永久卡不受限；未开通套餐（plan_type 为空）不在此拦截
                        if (!this.isAdmin && u.plan_type && u.plan_type !== 'permanent' && u.plan_expire_at) {
                            const exp = new Date(u.plan_expire_at).getTime();
                            if (!isNaN(exp) && Date.now() >= exp) {
                                this.handleLogout();
                                this.showError('套餐已过期，已自动退出登录，请联系管理员续费');
                                return false;
                            }
                        }
                        return true;
                    } catch (_) {
                        return true;
                    }
                },
                /**
                 * 关键操作前的强制校验（顶部刷新列表 / 刷新 APP token 等入口调用）。
                 * 优先读取本地缓存（由 5 分钟定时器持续写入），仅当本地无「当前用户的新鲜记录」时才联网复核一次，
                 * 避免频繁请求接口影响体验。管理员（isAdmin）全程无阻断。
                 * 返回 false 表示已被禁用或套餐过期并已自动退出。
                 */
                async assertActive() {
                    if (this.isAdmin) return true;                       // 管理员不受套餐/禁用限制
                    if (!this.currentUser || !this.currentUser.id) return true;
                    const now = Date.now();
                    const FRESH_MS = 5 * 60 * 1000;                      // 与定时器间隔一致
                    let rec = null;
                    try {
                        const raw = localStorage.getItem('dldl_status_check');
                        if (raw) rec = JSON.parse(raw);
                    } catch (_) { rec = null; }
                    // 本地有当前用户的新鲜记录 → 直接对比，不请求接口
                    if (rec && rec.userId === this.currentUser.id && (now - rec.checkedAt) < FRESH_MS) {
                        if (rec.enabled === false) {
                            this.handleLogout();
                            this.showError('当前账号已被禁用，已自动退出登录');
                            return false;
                        }
                        if (rec.plan_type && rec.plan_type !== 'permanent' && rec.plan_expire_at) {
                            const exp = new Date(rec.plan_expire_at).getTime();
                            if (!isNaN(exp) && now >= exp) {
                                this.handleLogout();
                                this.showError('套餐已过期，已自动退出登录，请联系管理员续费');
                                return false;
                            }
                        }
                        return true;
                    }
                    // 本地无新鲜记录（首次/陈旧）→ 强制联网复核一次（checkAccountStatus 内部会写回本地）
                    return await this.checkAccountStatus();
                },
                async refreshAccounts() {
                    // 点击刷新列表时先校验：优先读本地缓存（5 分钟定时器已更新），无新鲜记录才联网复核
                    if (!(await this.assertActive())) return;
                    this.accountsRefreshing = true;
                    try {
                        await this.loadAccounts();
                    } finally {
                        this.accountsRefreshing = false;
                    }
                },
                async loadAccounts() {
                    if (!this.currentUser) return;
                    try {
                        const { data: areasData, error: areasError } = await db
                            .from('areas').select('*').eq('user_id', this.currentUser.id).order('sort_order');
                        if (areasError) throw areasError;
                        const { data: accountsData, error: accountsError } = await db
                            .from('accounts').select('*').eq('user_id', this.currentUser.id).order('sort_order');
                        if (accountsError) throw accountsError;
                        const accountsByArea = {};
                        for (const account of (accountsData || [])) {
                            if (!accountsByArea[account.area_name]) accountsByArea[account.area_name] = [];
                            accountsByArea[account.area_name].push({
                                id: account.id,
                                uname: account.uname,
                                upwd: account.upwd,
                                name: account.name,
                                token: account.token,
                                time: account.time,
                                sign: account.sign,
                                uinfo: account.uinfo || '',
                                history: account.history || '',
                                url: account.url || '',
                                app_token: account.app_token || '',
                                app_sign: account.app_sign || '',
                                created_at: account.created_at || '',
                                url_created_at: account.url_created_at || ''
                            });
                        }
                        this.areas = (areasData || []).map(area => ({
                            area: area.name,
                            accounts: accountsByArea[area.name] || []
                        }));
                        this.pruneStaleSelections();
                        const names = this.areas.map(g => g.area);
                        if (!this.batchPanelArea || !names.includes(this.batchPanelArea)) this.batchPanelArea = names[0] || '';
                        this.saveAccountsToCache();
                        // 自动回填缺失的 url_created_at（从 URL 的 time 参数解析）
                        this.backfillUrlCreatedAt(accountsData);
                    } catch (e) {
                        console.error('load accounts failed', e);
                        this.showError(`加载数据失败：${e.message}`);
                    }
                },
                /** 从账号 URL 的 time 参数解析 Unix 秒时间戳，回填缺失的 url_created_at */
                async backfillUrlCreatedAt(accountsData) {
                    if (!this.currentUser || !Array.isArray(accountsData) || accountsData.length === 0) return;
                    const pending = [];
                    for (const account of accountsData) {
                        if (account.url_created_at) continue; // 已有，跳过
                        if (!account.url) continue;           // 无 URL，跳过
                        try {
                            const u = new URL(account.url);
                            const timeParam = u.searchParams.get('time');
                            if (!timeParam) continue;
                            const unixSeconds = parseInt(timeParam, 10);
                            if (isNaN(unixSeconds) || unixSeconds <= 0) continue;
                            const isoStr = new Date(unixSeconds * 1000).toISOString();
                            pending.push({ id: account.id, url_created_at: isoStr });
                        } catch (_) {
                            // URL 解析失败，静默跳过
                        }
                    }
                    if (pending.length === 0) return;
                    let done = 0;
                    for (const item of pending) {
                        try {
                            const { error } = await db.from('accounts')
                                .update({ url_created_at: item.url_created_at })
                                .eq('id', item.id)
                                .eq('user_id', this.currentUser.id);
                            if (!error) done++;
                            else console.warn('backfill url_created_at update failed:', item.id, error.message);
                        } catch (e) {
                            console.warn('backfill url_created_at error:', item.id, e?.message || e);
                        }
                    }
                    if (done > 0) {
                        console.log(`已回填 ${done} 条账号的 url_created_at`);
                        // 回填后刷新数据，确保界面展示最新的 url_created_at
                        await this.loadAccounts();
                    }
                },
                async saveAccounts() {
                    if (!this.currentUser) return false;
                    try {
                        const userId = this.currentUser.id;
                        const { data: existingAreas } = await db.from('areas').select('name').eq('user_id', userId);
                        const { data: existingAccounts } = await db.from('accounts').select('id, area_name, uname').eq('user_id', userId);
                        const currentAreaNames = new Set(this.areas.map(g => g.area));
                        const currentAccountKeys = new Set();
                        for (const group of this.areas) for (const acc of group.accounts) currentAccountKeys.add(`${group.area}|${acc.uname}`);
                        const areasToDelete = (existingAreas || []).filter(a => !currentAreaNames.has(a.name)).map(a => a.name);
                        if (areasToDelete.length > 0) await db.from('areas').delete().eq('user_id', userId).in('name', areasToDelete);
                        for (const areaName of currentAreaNames) {
                            if (!(existingAreas || []).some(a => a.name === areaName)) await db.from('areas').insert({ name: areaName, user_id: userId, sort_order: 0 });
                        }
                        const accountsToDelete = (existingAccounts || []).filter(a => !currentAccountKeys.has(`${a.area_name}|${a.uname}`)).map(a => a.id);
                        if (accountsToDelete.length > 0) await db.from('accounts').delete().eq('user_id', userId).in('id', accountsToDelete);
                        for (const group of this.areas) {
                            for (let ai = 0; ai < group.accounts.length; ai++) {
                                const acc = group.accounts[ai];
                                const existing = (existingAccounts || []).find(a => a.area_name === group.area && a.uname === acc.uname);
                                const accountData = {
                                    area_name: group.area,
                                    uname: acc.uname,
                                    upwd: acc.upwd,
                                    name: acc.name,
                                    token: acc.token,
                                    time: acc.time,
                                    sign: acc.sign,
                                    uinfo: acc.uinfo || '',
                                    history: acc.history || '',
                                    app_token: acc.app_token || '',
                                    app_sign: acc.app_sign || '',
                                    sort_order: ai
                                };
                                if (existing) await db.from('accounts').update(accountData).eq('id', existing.id).eq('user_id', userId);
                                else await db.from('accounts').insert({ ...accountData, user_id: userId });
                            }
                        }
                        return true;
                    } catch (e) {
                        console.error('save accounts failed', e);
                        this.showError(`保存失败：${e.message}`);
                        return false;
                    }
                },
            async onAccountCardsSorted(area) {
                // 账号顺序持久化到数据库的 sort_order 列（由 saveAccounts 写入每个账号在区服内的下标）。
                // 保存后立刻从 DB 重新读回，保证界面顺序 == 数据库真实顺序：
                // 若写库被丢弃（例如 Supabase schema 缓存未刷新导致新列被静默忽略），这里会立即回退暴露问题。
                const savedDb = await this.saveAccounts();
                await this.loadAccounts();
                if (!savedDb) this.showError('排序保存失败');
                else this.showSuccess('排序已保存');
            },
            findAccountLocation(account) {
                for (const group of this.areas) {
                    const index = group.accounts.findIndex(item => item.uname === account.uname && item.upwd === account.upwd);
                    if (index >= 0) {
                        return { group, index };
                    }
                }
                return null;
            },
            findAccountByUname(uname) {
                for (const group of this.areas) {
                    const index = group.accounts.findIndex(item => item.uname === uname);
                    if (index >= 0) {
                        return { group, index, account: group.accounts[index] };
                    }
                }
                return null;
            },
            normalizeAreaName(area) {
                return String(area || '').trim();
            },
            ensureArea(areaName) {
                const targetArea = this.normalizeAreaName(areaName);
                if (!targetArea) return this.failWithMessage('区服不能为空');
                let group = this.areas.find(item => item.area === targetArea);
                if (!group) {
                    group = { area: targetArea, accounts: [] };
                    this.areas.push(group);
                }
                return group;
            },
            parseLoginUrlToParams(raw) {
                const s = String(raw || '').trim();
                if (!s) return { error: 'empty' };
                let u;
                try {
                    u = new URL(s);
                } catch {
                    try {
                        u = new URL(s, 'https://dldl.50pk.com');
                    } catch {
                        return { error: 'invalid' };
                    }
                }
                const q = u.searchParams;
                return {
                    token: (q.get('token') || '').trim(),
                    time: (q.get('time') || '').trim(),
                    sign: (q.get('sign') || '').trim()
                };
            },
            extractLoginParamsFromUrl() {
                const raw = this.loginUrlPaste;
                if (!String(raw || '').trim()) {
                    this.showError('请先粘贴完整登录地址');
                    return;
                }
                const parsed = this.parseLoginUrlToParams(raw);
                if (parsed.error === 'invalid') {
                    this.showError('地址格式无效，请粘贴以 http(s):// 开头的完整链接，或从 ? 开始的查询串');
                    return;
                }
                const { token, time, sign } = parsed;
                if (!token && !time && !sign) {
                    this.showError('链接中未找到 token、time、sign 参数，请确认是 login.php 带参地址');
                    return;
                }
                this.accountForm.token = token;
                this.accountForm.time = time;
                this.accountForm.sign = sign;
                if (token && time && sign) {
                    this.showSuccess('已从地址中提取 token、time、sign');
                } else {
                    const missing = [];
                    if (!token) missing.push('token');
                    if (!time) missing.push('time');
                    if (!sign) missing.push('sign');
                    this.showMessage('warning', `已填入能解析到的项，仍缺少：${missing.join('、')}，请检查链接或手动补全`);
                }
            },
            openAccountModal(account = null) {
                this.loginUrlPaste = '';
                if (account) {
                    this.accountModalMode = 'edit';
                    this.accountForm = {
                        area: this.findAccountLocation(account)?.group.area || '',
                        name: account.name || '',
                        uname: account.uname || '',
                        upwd: account.upwd || '',
                        platform: account.platform || '37',
                        token: account.token != null ? String(account.token) : '',
                        time: account.time != null ? String(account.time) : '',
                        sign: account.sign != null ? String(account.sign) : '',
                        uinfo: account.uinfo != null ? String(account.uinfo) : '',
                        history: account.history != null ? String(account.history) : '',
                        url: account.url != null ? String(account.url) : ''
                    };
                    this.editingAccountRef = account;
                } else {
                    this.accountModalMode = 'create';
                    this.accountForm = {
                        area: this.areas[0]?.area || '',
                        name: '',
                        uname: '',
                        upwd: '',
                        platform: '37',
                        token: '',
                        time: '',
                        sign: '',
                        uinfo: '',
                        history: '',
                        url: ''
                    };
                    this.editingAccountRef = null;
                }
                this.accountModalVisible = true;
            },
            closeAccountModal() {
                this.accountModalVisible = false;
                this.loginUrlPaste = '';
                this.editingAccountRef = null;
            },
            async submitAccountModal() {
                const area = this.normalizeAreaName(this.accountForm.area);
                const name = String(this.accountForm.name || '').trim();
                const uname = String(this.accountForm.uname || '').trim();
                const upwd = String(this.accountForm.upwd || '').trim();
                const token = String(this.accountForm.token || '').trim();
                const time = String(this.accountForm.time || '').trim();
                const sign = String(this.accountForm.sign || '').trim();
                const uinfo = String(this.accountForm.uinfo || '').trim();
                const history = String(this.accountForm.history || '').trim();
                const url = String(this.accountForm.url || '').trim();
                if (!area) return this.failWithMessage('请选择或填写区服');
                if (!uname) return this.failWithMessage('请输入账号 uname');
                if (!upwd) return this.failWithMessage('请输入密码 upwd');
                const targetGroup = this.ensureArea(area);
                if (!targetGroup) return;
                if (this.accountModalMode === 'create') {
                    if (this.findAccountByUname(uname)) return this.failWithMessage('该 uname 已存在');
                    if (this.loadingVisible) return;
                    this.loadingText = '正在添加账号...';
                    this.loadingVisible = true;
                    try {
                        // 确保区服记录存在（外键 accounts.area_name → areas.name）
                        const { data: areaExists } = await db.from('areas').select('name').eq('name', area).eq('user_id', this.currentUser.id).maybeSingle();
                        if (!areaExists) {
                            await db.from('areas').insert({ name: area, user_id: this.currentUser.id, sort_order: 0 });
                        }
                        const { data, error } = await db.from('accounts').insert({
                            user_id: this.currentUser.id, area_name: area, uname, upwd, platform: this.accountForm.platform || '37', name, token, time, sign, uinfo, history, url
                        }).select().single();
                        if (error) {
                            if (error.code === '23505') { this.showError(`区服 ${area} 下账号 ${uname} 已存在`); return; }
                            throw error;
                        }
                        targetGroup.accounts.push({ id: data.id, name, uname, upwd, token, time, sign, uinfo, history, url, created_at: data.created_at || '', url_created_at: data.url_created_at || '' });
                        this.saveAccountsToCache();
                        this.showSuccess('账号已添加');
                        this.closeAccountModal();
                    } catch (e) {
                        this.showError(`添加失败：${e.message}`);
                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                } else {
                    if (this.loadingVisible) return;
                    const location = this.findAccountLocation(this.editingAccountRef || {});
                    if (!location) return this.failWithMessage('未找到要编辑的账号');
                    const target = location.group.accounts[location.index];
                    const existing = this.findAccountByUname(uname);
                    if (existing && existing.account !== target) return this.failWithMessage('该 uname 已存在');
                    this.loadingText = '正在保存账号...';
                    this.loadingVisible = true;
                    try {
                        // 确保区服记录存在（外键 accounts.area_name → areas.name），必须在更新账号之前创建
                        const { data: areaExists } = await db.from('areas').select('name').eq('name', area).eq('user_id', this.currentUser.id).maybeSingle();
                        if (!areaExists) {
                            await db.from('areas').insert({ name: area, user_id: this.currentUser.id, sort_order: 999 });
                        }
                        const updateData = { area_name: area, uname, upwd, platform: this.accountForm.platform || '37', name, token, time, sign, uinfo, history, url, app_token: target.app_token || '', app_sign: target.app_sign || '' };
                        const { error } = await db.from('accounts').update(updateData)
                            .eq('id', target.id).eq('user_id', this.currentUser.id);
                        if (error) {
                            if (error.code === '23505') { this.showError(`区服 ${area} 下账号 ${uname} 已存在`); return; }
                            throw error;
                        }
                        if (location.group.area !== area) {
                            location.group.accounts.splice(location.index, 1);
                            targetGroup.accounts.push(target);
                        }
                        target.name = name;
                        target.uname = uname;
                        target.upwd = upwd;
                        target.token = token;
                        target.time = time;
                        target.sign = sign;
                        target.uinfo = uinfo;
                        target.history = history;
                        target.url = url;
                        this.saveAccountsToCache();
                        this.showSuccess('账号已更新');
                        this.closeAccountModal();
                    } catch (e) {
                        this.showError(`保存失败：${e.message}`);
                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                }
            },
            editAccount(account) {
                this.openAccountModal(account);
            },
            async deleteEditingAccount() {
                if (this.loadingVisible) return;
                try {
                    if (this.accountModalMode !== 'edit' || !this.editingAccountRef) {
                        this.showError('未找到要删除的账号');
                        return;
                    }
                    const location = this.findAccountLocation(this.editingAccountRef);
                    if (!location) {
                        this.showError('未找到要删除的账号');
                        return;
                    }
                    const target = location.group.accounts[location.index];
                    const confirmed = await this.confirmAction(`确认删除账号 ${target.uname} 吗？该操作不可恢复。`, '删除账号');
                    if (!confirmed) return;
                    this.loadingText = '正在删除账号...';
                    this.loadingVisible = true;
                    const { error } = await db.from('accounts').delete()
                        .eq('id', target.id).eq('user_id', this.currentUser.id);
                    if (error) throw error;
                    location.group.accounts.splice(location.index, 1);
                    if (!location.group.accounts.length) {
                        this.areas = this.areas.filter(item => item.area !== location.group.area);
                    }
                    this.saveAccountsToCache();
                    this.showSuccess('账号已删除');
                    this.closeAccountModal();
                } catch (e) {
                    this.showError(`删除账号失败：${e?.message || e}`);
                } finally {
                    this.loadingVisible = false;
                    this.loadingText = '';
                }
            },
            async deleteArea(group) {
                if (this.loadingVisible) return;
                try {
                    const areaName = this.normalizeAreaName(group?.area);
                    if (!areaName) {
                        this.showError('区服名称无效');
                        return;
                    }
                    const target = this.areas.find(item => item.area === areaName);
                    if (!target) {
                        this.showError('未找到要删除的区服');
                        return;
                    }
                    const confirmed = await this.confirmAction(`确认删除区服 ${areaName} 吗？将同时删除该区服下 ${target.accounts.length} 个账号，且不可恢复。`, '删除区服');
                    if (!confirmed) return;
                    this.loadingText = '正在删除区服...';
                    this.loadingVisible = true;
                    await db.from('accounts').delete().eq('user_id', this.currentUser.id).eq('area_name', areaName);
                    await db.from('areas').delete().eq('user_id', this.currentUser.id).eq('name', areaName);
                    this.areas = this.areas.filter(item => item.area !== areaName);
                    this.saveAccountsToCache();
                    if (this.accountModalVisible && this.accountModalMode === 'edit') {
                        const editingArea = this.findAccountLocation(this.editingAccountRef || {})?.group?.area;
                        if (editingArea === areaName) {
                            this.closeAccountModal();
                        }
                    }
                    this.showSuccess(`已删除区服 ${areaName}`);
                } catch (e) {
                    this.showError(`删除区服失败：${e?.message || e}`);
                } finally {
                    this.loadingVisible = false;
                    this.loadingText = '';
                }
            },
                async persistToken(account, tokenInfo) {
                    if (!account || !account.id || !this.currentUser) {
                        this.showError('无法保存 token：缺少账号 ID 或未登录');

                        const u = new URL(url);
                        u.searchParams.set(callbackParam, cbName);

                        let done = false;
                        const cleanup = () => {
                            if (script && script.parentNode) script.parentNode.removeChild(script);
                            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
                        };

                        const timer = setTimeout(() => {
                            if (done) return;
                            done = true;
                            cleanup();
                            reject(new Error("jsonp timeout"));
                        }, timeoutMs);

                        window[cbName] = (payload) => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(payload);
                        };

                        const script = document.createElement("script");
                        script.src = u.toString();
                        script.onerror = () => {
                            if (done) return;
                            done = true;
                            clearTimeout(timer);
                            cleanup();
                            reject(new Error("jsonp network error"));
                        };
                        document.head.appendChild(script);

                    this.showSuccess(`已完成打开 ${list.length} 个 APP 登录窗口`);
                },
                /** 在 areas 中查找账号所属区服名 */
                findAccountArea(account) {
                    for (const g of this.areas) {
                        if (g.accounts.some(a => a === account || (a.id != null && account.id != null && a.id === account.id))) {
                            return g.area;
                        }
                    }
                    return '';
                },
                /** 计算 URL 剩余有效时长，格式：剩 x天x小时；已过期返回"已过期" */
                getUrlRemaining(account) {
                    if (!account) return '';
                    const timeStr = account.url_created_at || account.created_at || '';
                    if (!timeStr) return '';
                    const urlTime = new Date(timeStr);
                    if (isNaN(urlTime.getTime())) return '';
                    const ageMs = Date.now() - urlTime.getTime();
                    if (ageMs < 0) return `剩 ${this.urlValidityHours}小时`;
                    const remainingMs = this.urlValidityHours * 3600000 - ageMs;
                    if (remainingMs <= 0) return '已过期';
                    const totalHours = Math.floor(remainingMs / 3600000);
                    const days = Math.floor(totalHours / 24);
                    const hours = totalHours % 24;
                    if (days > 0 && hours > 0) return `剩 ${days}天${hours}小时`;
                    if (days > 0) return `剩 ${days}天`;
                    if (hours > 0) return `剩 ${hours}小时`;
                    const minutes = Math.floor(remainingMs / 60000);
                    if (minutes > 0) return `剩 ${minutes}分钟`;
                    return '剩 <1分钟';
                },
                /** 剩余时间状态类名：expired=已过期, urgent=12小时内 */
                urlRemainingState(account) {
                    if (!account) return '';
                    const timeStr = account.url_created_at || account.created_at || '';
                    if (!timeStr) return '';
                    const urlTime = new Date(timeStr);
                    if (isNaN(urlTime.getTime())) return '';
                    const ageMs = Date.now() - urlTime.getTime();
                    const remainingMs = this.urlValidityHours * 3600000 - ageMs;
                    if (remainingMs <= 0) return 'expired';
                    if (remainingMs <= 12 * 3600000) return 'urgent';
                    return '';
                },
                /** 保留旧方法名兼容 */
                getUrlAge(account) {
                    return this.getUrlRemaining(account);
                },
                /** URL 已生成的小时数 */
                urlAgeHours(account) {
                    if (!account) return -1;
                    const timeStr = account.url_created_at || account.created_at || '';
                    if (!timeStr) return -1;
                    const urlTime = new Date(timeStr);
                    if (isNaN(urlTime.getTime())) return -1;
                    const diffMs = Date.now() - urlTime.getTime();
                    if (diffMs < 0) return 0;
                    return Math.floor(diffMs / 3600000);
                },
                /** 根据筛选条件过滤区服下的账号 */
                filteredAccounts(group) {
                    if (this.urlFilter === 'all') return group.accounts;
                    return group.accounts.filter(a => {
                        const has = !!(a.url && String(a.url).trim());
                        const age = this.urlAgeHours(a);
                        if (this.urlFilter === 'none') return !has;
                        if (this.urlFilter === 'valid') return has && age >= 0 && age <= this.urlValidityHours - 1;
                        if (this.urlFilter === 'expired') return has && age >= this.urlValidityHours;
                        return true;
                    });
                },
                async batchLaunchSelected() {
                    if (this.loadingVisible) return;
                    // 整批拦截：当前用户套餐无效时直接拦掉，避免每个账号刷一条错误
                    if (!this.checkPlanBeforeLaunch()) return;
                    const list = this.getSelectedAccountsOrdered();
                    if (!list.length) {
                        this.showError('请先勾选要启动的账号');
                        return;
                    }
                    this.loadingText = `正在批量启动 ${list.length} 个账号...`;
                    this.loadingVisible = true;
                    try {
                        await this.batchLaunchAccounts(list);
                    } finally {
                        this.loadingVisible = false;
                        this.loadingText = '';
                    }
                },
                async batchLaunchByAreaSlice() {
                    if (this.loadingVisible) return;
                    // 整批拦截：当前用户套餐无效时直接拦掉，避免每个账号刷一条错误
                    if (!this.checkPlanBeforeLaunch()) return;
                    const area = String(this.batchPanelArea || '').trim();
                    if (!area) {
                        this.showError('请选择区服');
                        return;
                    }
                    const group = this.areas.find((g) => g.area === area);
                    if (!group || !group.accounts.length) {

                    }
                    const size = Math.max(1, Math.floor(Number(this.batchPanelSize)) || 10);
                    const batchNo = Math.max(1, Math.floor(Number(this.batchPanelBatchNo)) || 1);
                    const start = (batchNo - 1) * size;
                    const slice = group.accounts.slice(start, start + size);
                    if (!slice.length) {
                        this.showError(
                            `第 ${batchNo} 批没有账号（当前区服共 ${group.accounts.length} 个，每批 ${size} 个，有效批次为 1～${Math.max(1, Math.ceil(group.accounts.length / size))}）`
                        );
                        return;
                    }
                    this.loadingText = `正在批量启动第 ${batchNo} 批（${slice.length} 个账号）...`;
                    this.loadingVisible = true;
                    try {
