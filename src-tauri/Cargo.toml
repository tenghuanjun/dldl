[package]
name = "dldl-proxy"
version = "1.0.0"
description = "斗罗大陆 H5 本地代理与账号管理（Tauri 壳）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dldl_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2.6", features = [] }
tauri-plugin-single-instance = "2"
url = "2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
